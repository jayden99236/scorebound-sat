<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free digital SAT practice: 147 original questions, an adaptive full-length test, estimated scores, and explanations in English or Russian.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Scorebound SAT Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a test-booklet desk. Home = setup sheet + score log; test = passage | question split with a fixed answer bar; results = score scale + domain bars + review. */
:root {
  --paper: #F5F6FA;
  --surface: #FFFFFF;
  --ink: #16213A;
  --muted: #5B6478;
  --line: #DCE0EA;
  --pencil: #F2B705;
  --pencil-ink: #3A2C00;
  --pencil-soft: #FFF3C4;
  --navy: #22346B;
  --good: #1D7F55;
  --good-soft: #E1F3EA;
  --bad: #B83A26;
  --bad-soft: #FBE7E3;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1422; --surface: #171E30; --ink: #E6EAF4; --muted: #9AA3B8; --line: #2A3350;
    --pencil: #F5C842; --pencil-ink: #241B00; --pencil-soft: #3A3215; --navy: #9DB2F2;
    --good: #4CC48E; --good-soft: #15342A; --bad: #F08A76; --bad-soft: #3D1F1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1422; --surface: #171E30; --ink: #E6EAF4; --muted: #9AA3B8; --line: #2A3350;
  --pencil: #F5C842; --pencil-ink: #241B00; --pencil-soft: #3A3215; --navy: #9DB2F2;
  --good: #4CC48E; --good-soft: #15342A; --bad: #F08A76; --bad-soft: #3D1F1A; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--f-display); letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink); position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--pencil); }
.topbar small { color: var(--muted); font-size: 13px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-primary:hover { opacity: .9; border-color: var(--ink); }
.btn-pencil { background: var(--pencil); color: var(--pencil-ink); border-color: var(--pencil); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Home */
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: end; padding-block: 40px 28px; }
.hero h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--pencil) 62%, var(--pencil) 92%, transparent 92%); }
.hero p { color: var(--muted); max-width: 52ch; margin: 14px 0 0; }
.scale { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.scale-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scale-row + .scale-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.scale-row b { font: 700 22px/1 var(--f-mono); }
.scale-row span { color: var(--muted); font-size: 13px; }

.home-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; padding-bottom: 48px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; min-width: 0; }
.panel h2 { font-size: 20px; margin-bottom: 4px; }
.panel > p.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.field { margin-top: 20px; }
.field > .eyebrow { display: block; margin-bottom: 10px; }
.secpick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.seccard { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper); display: grid; gap: 4px; }
.seccard b { font: 700 16px/1.2 var(--f-display); }
.seccard span { color: var(--muted); font-size: 13px; }
.seccard[aria-checked="true"] { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip .num { color: var(--muted); margin-left: 4px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--pencil-soft); border-color: var(--pencil); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; background: var(--paper); flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.opts { display: flex; flex-wrap: wrap; gap: 20px; }
.startrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
.startrow .meta { color: var(--muted); font-size: 14px; }

.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log .when { color: var(--muted); font-size: 12px; }
.log .sc { font: 700 18px/1 var(--f-mono); grid-row: span 2; align-self: center; text-align: right; }
.log .sc small { display: block; font: 500 11px/1.4 var(--f-body); color: var(--muted); }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); font-size: 14px; }
.tips { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
.tips kbd { font: 600 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink); background: var(--paper); }

/* Test */
.testbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.testbar .secname { font: 700 15px/1.2 var(--f-display); }
.testbar .secname small { display: block; font: 500 12px var(--f-body); color: var(--muted); }
.timer { font: 700 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: 8px; }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.timer-wrap { display: flex; align-items: center; gap: 8px; }
.testbar .right { justify-self: end; display: flex; gap: 8px; align-items: center; }

.qwrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 120px; display: grid; gap: 28px; }
.qwrap.split { grid-template-columns: 1fr 1fr; }
.qwrap.solo { max-width: 720px; }
.passage { font: 400 17px/1.7 var(--f-read); min-width: 0; padding-right: 28px; border-right: 1px solid var(--line); }
.passage p { margin: 0 0 1em; max-width: 62ch; }
.passage table { border-collapse: collapse; font: 14px var(--f-body); margin: 6px 0 14px; }
.passage caption { text-align: left; font-weight: 700; padding-bottom: 6px; }
.passage th, .passage td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
.passage td.n { font-family: var(--f-mono); text-align: right; }
.passage ul { margin: 0; padding-left: 1.2em; }
.passage li { margin-bottom: 6px; }
.passage .blank { display: inline-block; min-width: 64px; border-bottom: 2px solid var(--ink); }
.tablescroll { overflow-x: auto; }
.qpane { min-width: 0; }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 3px double var(--line); }
.qbadge { font: 700 15px/1 var(--f-mono); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 6px 9px; }
.markbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; font-weight: 600; font-size: 14px; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.markbtn svg { width: 16px; height: 16px; }
.markbtn[aria-pressed="true"] { color: var(--bad); }
.markbtn[aria-pressed="true"] svg path { fill: var(--bad); }
.skilltag { margin-left: auto; font-size: 12px; color: var(--muted); }
.stem { font-size: 16px; margin: 0 0 18px; }
.stem.math { font: 400 18px/1.65 var(--f-read); }
.choices { display: grid; gap: 10px; }
.crow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
.choice { display: flex; align-items: center; gap: 14px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.choice:hover:not(:disabled) { border-color: var(--muted); }
.choice .ctext { min-width: 0; overflow-wrap: anywhere; }
.choice.mathc .ctext { font: 400 17px var(--f-read); }
.bub { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 700 13px var(--f-mono); transition: background .12s; }
.choice[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice[aria-checked="true"] .bub { background: var(--ink); color: var(--paper); }
.crow.struck .choice .ctext { text-decoration: line-through; color: var(--muted); }
.crow.struck .choice { opacity: .7; }
.strike { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; width: 42px; font: 700 12px var(--f-mono); color: var(--muted); text-decoration: line-through; }
.strike[aria-pressed="true"] { background: var(--paper); color: var(--ink); text-decoration: none; }
.choice.is-correct { border-color: var(--good); background: var(--good-soft); box-shadow: none; }
.choice.is-correct .bub { background: var(--good); border-color: var(--good); color: var(--surface); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: none; }
.choice.is-wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.choice:disabled { cursor: default; }
.gridin { display: grid; gap: 8px; max-width: 280px; }
.gridin input { font: 700 22px var(--f-mono); padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; }
.gridin input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--pencil-soft); }
.gridin small { color: var(--muted); font-size: 13px; }
.gridin.is-correct input { border-color: var(--good); background: var(--good-soft); }
.gridin.is-wrong input { border-color: var(--bad); background: var(--bad-soft); }
.feedback { margin-top: 18px; border-radius: 12px; padding: 14px 16px; background: var(--paper); border: 1px solid var(--line); }
.feedback b { display: block; margin-bottom: 4px; }
.feedback.ok b { color: var(--good); }
.feedback.no b { color: var(--bad); }
.feedback p { margin: 0; font-size: 14px; }

.testfoot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.testfoot .inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.testfoot .inner > :last-child { justify-self: end; display: flex; gap: 8px; }
.navtoggle { border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 10px; padding: 9px 14px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.navpanel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 7; width: min(520px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 12px 40px rgba(10,20,40,.22); }
.navpanel h3 { font-size: 16px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 0 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1.5px dashed var(--muted); }
.legend i.a { background: var(--ink); border: 0; }
.legend i.m { background: var(--bad); border: 0; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
.navgrid button { height: 40px; border-radius: 8px; border: 1.5px dashed var(--muted); background: var(--surface); font: 700 14px var(--f-mono); position: relative; }
.navgrid button.ans { background: var(--ink); color: var(--paper); border: 1.5px solid var(--ink); }
.navgrid button.cur { outline: 3px solid var(--pencil); outline-offset: 1px; }
.navgrid button.mk::after { content: ""; position: absolute; top: -4px; right: -4px; width: 11px; height: 11px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
.navpanel .submitrow { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.navpanel .warn { font-size: 13px; color: var(--muted); }
.exitbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* Results */
.res-head { padding-block: 36px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: end; }
.res-head h1 { font-size: clamp(28px, 4.5vw, 42px); font-weight: 800; letter-spacing: -.02em; }
.res-head p { color: var(--muted); margin: 10px 0 0; }
.scorecards { display: grid; gap: 12px; }
.scorecard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.scorecard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.scorecard .big { font: 700 44px/1 var(--f-mono); letter-spacing: -.02em; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--paper); border: 1px solid var(--line); margin: 16px 0 6px; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--pencil); }
.track .pin { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: var(--surface); transform: translate(-50%, -50%); }
.ticks { display: flex; justify-content: space-between; font: 500 11px var(--f-mono); color: var(--muted); }
.res-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 24px; padding-bottom: 56px; align-items: start; }
.statline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.stat { border-radius: 12px; background: var(--paper); padding: 12px; }
.stat b { display: block; font: 700 20px/1.1 var(--f-mono); }
.stat span { font-size: 12px; color: var(--muted); }
.dom { margin-top: 14px; }
.dom .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.dom .row span:last-child { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.dom .bar { height: 8px; background: var(--paper); border-radius: 99px; margin-top: 6px; overflow: hidden; }
.dom .bar i { display: block; height: 100%; background: var(--navy); border-radius: 99px; }
.dom .bar i.weak { background: var(--bad); }
.review { display: grid; gap: 10px; }
.ritem { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.ritem summary { list-style: none; display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
.ritem summary::-webkit-details-marker { display: none; }
.ritem .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-mono); color: var(--surface); }
.ritem .mark.ok { background: var(--good); }
.ritem .mark.no { background: var(--bad); }
.ritem .mark.skip { background: var(--muted); }
.ritem .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.ritem .pair { font: 600 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.ritem .body { padding: 0 14px 14px 50px; font-size: 14px; }
.ritem .body p { margin: 0 0 8px; }
.ritem .body .ex { background: var(--paper); border-radius: 8px; padding: 10px 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* Full-length test */
.modout { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.modout li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; background: var(--surface); }
.modout li:first-child { border-top: 0; }
.modout li .num { color: var(--muted); font-size: 12px; white-space: nowrap; }
.modout li.brk { background: var(--paper); color: var(--muted); font-style: italic; }
.modout li.done { color: var(--muted); }
.modout li.done span:first-child { text-decoration: line-through; }
.modout li.next { background: var(--pencil-soft); font-weight: 600; }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; max-width: 62ch; }
.between { max-width: 640px; margin: 0 auto; padding-block: 48px; display: grid; gap: 16px; }
.between h1 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 800; letter-spacing: -.02em; }
.between p { margin: 0; }
.breakbox { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.breakbox > div { min-width: 0; flex: 1 1 240px; }
.breakbox p { color: var(--muted); font-size: 14px; margin-top: 6px; }
.stem table { border-collapse: collapse; font: 14px var(--f-body); margin: 12px 0; }
.stem th, .stem td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; font-variant-numeric: tabular-nums; }

/* Language menu and hover explanation */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.topbar { flex-wrap: wrap; }
.topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; min-width: 0; }
.langsel { font: 600 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.testbar .right { flex-wrap: wrap; }
.qhead { position: relative; }
.expbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 5px; font-size: 13px; font-weight: 600; }
.expbtn:hover, .exp-wrap.open .expbtn { border-color: var(--pencil); background: var(--pencil-soft); }
.expbtn .qm { width: 20px; height: 20px; border-radius: 50%; background: var(--pencil); color: var(--pencil-ink); display: grid; place-items: center; font: 700 12px var(--f-mono); }
.exp-pop { display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 8; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 14px 40px rgba(10,20,40,.22); font-size: 14px; line-height: 1.6; }
