const EX_RU = {
  rw1: `Двоеточие показывает, что дальше объясняется пропуск. Эскизы, в которых архитектор не стала «committing to a single design» и оставила место для изменений, — предварительные: provisional значит «временный, допускающий изменения».`,
  rw2: `«Although» задаёт противопоставление с письмами, где она обсуждает своё ремесло «at length» (подробно). Раз она давала «brief and guarded answers» (короткие и сдержанные ответы), она была reticent — сдержанной, неразговорчивой.`,
  rw3: `Охватить все замечания всего на четырёх страницах — это concision, то есть краткость: умение сказать много малым числом слов. Redundancy (избыточность) — противоположность.`,
  rw4: `Первое предложение сообщает, что тихоходки переживают обезвоживание. Второе описывает механизм (они сворачиваются в «тун» и замедляют обмен веществ). Оно ничего не опровергает, а оживление описано в третьем предложении.`,
  rw5: `Текст переходит от роста числа городских ульев к предостережению: конкуренция за цветы может вредить диким пчёлам там, где цветов мало. Текст не призывает к запрету и не сравнивает, какие цветы предпочитают разные пчёлы.`,
  rw6: `Урожай в целом вырос (с 42 до 55) с одним снижением — с 2018 (51) до 2019 (47). Остальные варианты неверно читают таблицу: максимум был 55 в 2020 году, и 2020 год — самый высокий, а не самый низкий.`,
  rw7: `Стандартное хранение — это высушивание и заморозка. Если семена авокадо и какао при этом погибают, стандартные методы не могут их сохранить. Остальные варианты текст не подтверждает.`,
  rw8: `В самых древних слоях нашли сельскохозяйственные орудия и не нашли рыболовных снастей — это указывает на земледелие. Сказать, что рыбаки «never» там жили, — слишком сильно, ведь раскопки охватили только древнейшие слои.`,
  rw9: `Обе части — независимые предложения, и их можно соединить точкой с запятой. Одна запятая даёт comma splice (ошибочную «склейку» запятой), отсутствие знака — слитное предложение, а «which the oldest» грамматически неверно.`,
  rw10: `Подлежащее — «collection» (единственное число). «Of letters written by the expedition's crew members» — предложная группа, она не меняет подлежащее, поэтому глагол «is».`,
  rw11: `«Both» показывает, что архитекторов двое, а проекты принадлежат им. Значит, нужен притяжательный падеж множественного числа: architects'.`,
  rw12: `«A nineteenth-century mathematician» — необязательное приложение, его нужно выделить запятыми с двух сторон. В остальных вариантах нет одной из запятых или стоит точка с запятой, которая не может отделять подлежащее от сказуемого.`,
  rw13: `Смертельно опасные утечки — следствие использования ядовитых хладагентов, поэтому нужна связка причины и следствия: «Consequently» (следовательно).`,
  rw14: `Второй результат (рост на 12 процентов) противопоставлен первому (никакого эффекта). «However» (однако) выражает это противопоставление.`,
  rw15: `Только вариант «Stretching about 2,300 kilometers» говорит о размере, причём использует и длину (2 300 км), и факт «world's largest». Остальные — о местоположении или биоразнообразии.`,
  rw16: `Выступления перед законодателями и создание природоохранных организаций — способы публично поддерживать дело. Это и есть advocating (выступать в защиту).`,
  rw17: `Инженеры нашли серьёзный изъян, и город вернулся к прежнему плану. Значит, проект был rejected (отклонён).`,
  rw18: `Эссе на темы «ranging from friendship to astronomy» охватывают самые разные предметы — это eclectic (разнородный). «Systematic» подходит к единой теории, от которой книга как раз отказывается.`,
  rw19: `Свободный переход между жанрами показывает, что она умела менять стиль под новые условия, то есть adapt (приспосабливать).`,
  rw20: `Участники пропускали вопросы, поэтому в данных есть пробелы — они incomplete (неполные). Ничто не говорит о том, что данные выдуманы (fabricated).`,
  rw21: `«But» и «grew more enthusiastic» показывают, что первые отзывы были не слишком восторженными. Lukewarm — «прохладный», в лучшем случае умеренно положительный.`,
  rw22: `Текст называет распространённое мнение (пустыни безжизненны) и опровергает его данными о пустыне Сонора. О дождях, других пустынях или угрозах в нём речи нет.`,
  rw23: `Предложение 1 — достижение (симфония 1933 года), предложение 2 — забвение («went unplayed»), предложение 3 — поворот (находка 2009 года, вызвавшая новый интерес).`,
  rw24: `Первые два предложения показывают выгоду каждой стороны (люди получают мёд, птицы — воск). Третье подводит итог: это партнёрство, которое «benefits both species».`,
  rw25: `Текст 1 предсказывает сокращение рабочих мест после повышения зарплаты. Текст 2 обнаружил, что занятость «did not fall», а это прямо противоречит прогнозу. Кроме того, текст 2 связывает зарплаты с текучестью кадров, так что он не стал бы утверждать, что они не связаны.`,
  rw26: `Текст 2 приводит два вида данных по окаменелостям (нет следов волочения хвоста, быстрый рост), которые противоречат образу медленных, холоднокровных, волочащих хвост динозавров. Поэтому автор счёл бы этот образ устаревшим.`,
  rw27: `Текст описывает систему барьеров и сообщает, что она предотвратила несколько крупных наводнений. Утверждение, что она остановила «all flooding», преувеличивает, отказ от MOSE в тексте не предлагается, а 2020 год противоречит «for centuries».`,
  rw28: `В последнем предложении сказано, что мышцы «stretch it open to display its color». Остальные варианты в тексте не упоминаются.`,
  rw29: `Мара раз за разом поворачивает назад у края деревни — это и показывает нежелание уезжать. Остальные цитаты описывают деревню или других людей, а не колебания Мары.`,
  rw30: `Утверждение сравнивает велосипед и автомобиль, поэтому в доказательстве должны быть оба: 19 минут на велосипеде против 27 на машине. Остальные варианты верны, но не сравнивают эти два способа.`,
  rw31: `14% − 2% = 12 процентных пунктов. Доля выросла в семь раз, а не просто удвоилась, а «14 пунктов» не учитывает начальные 2%.`,
  rw32: `В пузырьках сохраняется древний воздух, а глубина соответствует возрасту. Поэтому, сравнивая разные глубины, учёные сравнивают атмосферу в разные эпохи.`,
  rw33: `Головоломка была одна и та же, менялось только её описание. Раз поведение различалось, на вовлечённость повлияло описание.`,
  rw34: `Если без шмелей семена не образуются, растение от них зависит. Посещение другими насекомыми ослабило бы гипотезу, а время цветения или общие предпочтения шмелей ничего не говорят о зависимости именно этого растения.`,
  rw35: `Текст противопоставляет медленное переписывание от руки быстрой печати и называет следствия: книги подешевели, а идеи распространились шире.`,
  rw36: `Меньше каланов — больше морских ежей, а больше ежей съедает больше ламинарии. Значит, каланы сдерживают ежей и тем самым защищают ламинариевые леса.`,
  rw37: `«By the time» вместе с прошедшим событием («arrived») требует Past Perfect: туристы had found укрытие ещё до прибытия спасателей.`,
  rw38: `«Orchestra» — собирательное существительное в единственном числе, поэтому местоимение «it». «Them» к тому же стоит не в том падеже для подлежащего.`,
  rw39: `Двоеточие вводит перечень после законченного предложения. Точка с запятой должна соединять два независимых предложения, а «flour, water, and salt» таким не является.`,
  rw40: `Два независимых предложения можно соединить запятой и сочинительным союзом («, and»). Одна запятая без союза — это comma splice.`,
  rw41: `Подлежащее — «Each» (единственное число). «Of the paintings» его не меняет, поэтому глагол «shows».`,
  rw42: `Вводный оборот описывает того, кто изучал рукописи, поэтому сразу после запятой должен стоять этот человек. Только в одном варианте там стоит «the linguist». В остальных оборот «повисает» (dangling modifier).`,
  rw43: `Птицы принадлежат одному региону (region's), а привычки гнездования — многим птицам (birds'). Поэтому оба слова стоят в притяжательной форме: region's birds'.`,
  rw44: `Придаточное с «which» добавляет дополнительную информацию, поэтому его нужно выделить запятыми с обеих сторон. Обе запятые есть только в одном варианте.`,
  rw45: `Оборот между запятыми определяет «walls», и ему нужно причастие прошедшего времени: «built from local limestone». «Were built» и «they were built» добавляют второе сказуемое или целое предложение и ломают структуру.`,
  rw46: `«Its» — притяжательное местоимение для существительного в единственном числе, такого как «company». «It's» означает «it is», а «its'» никогда не бывает правильным.`,
  rw47: `Долгая выдержка заставляла людей не двигаться — это причина и следствие: «As a result» (в результате).`,
  rw48: `Кофе нужны узкие условия, а чай переносит широкий диапазон климата. Это противопоставление: «by contrast».`,
  rw49: `Небольшая выборка — причина, по которой выводы нужно подтвердить. Это вывод, поэтому подходит «Therefore» (поэтому).`,
  rw50: `Второе предложение добавляет ещё один способ, которым мангры справляются с солью, поэтому связка должна выражать добавление: «Additionally».`,
  rw51: `Рост торговли — дополнительная польза помимо безопасности. Это не противопоставление и не конкретный пример безопасности, поэтому «In addition».`,
  rw52: `Представление должно сказать, кто она и чем знаменита. Только вариант, где она названа первой выдающейся прима-балериной Америки, делает и то и другое. Остальные не объясняют, кто она, или вообще не о ней.`,
  rw53: `Только вариант с «whereas» описывает извержения обоих вулканов и противопоставляет их.`,
  rw54: `Главный результат — сравнение уровня стресса у велосипедистов и водителей. Его называет только один вариант. Остальные описывают устройство исследования или город.`,
  rw55: `Приписать всю заслугу одной семье — значит упростить историю, в которой участвовали десятки торговцев. Reductive — «упрощающий, сводящий сложное к одному фактору».`,
  rw56: `Упрёк критиков связан с тем, что работы повторяют прежние мотивы. Derivative — «вторичный, заимствованный»; автор же считает, что критики не заметили, как эти мотивы переосмыслены.`,
  rw57: `Одобрение с множеством условий — ограниченное, частичное, то есть qualified. Unequivocal (безоговорочный) — противоположность.`,
  rw58: `Исследователи «don't dispute the warning function», то есть старое объяснение не отвергается. Они добавляют выбор партнёра как второй фактор, поэтому вариант «опровергает полностью» неверен.`,
  rw59: `Текст 2 предполагает, что у Марлоу была причина (авансы) представлять себя автором, который всё тщательно планирует, поэтому письма могут быть не беспристрастным свидетельством. При этом текст не утверждает, что она вообще ничего не планировала.`,
  rw60: `Второе предложение описывает эффект (новые полосы привлекают больше водителей). Третье просто даёт ему название: induced demand (индуцированный спрос).`,
  rw61: `Те же приёмы — значит, те же местные гончары. Далёкая глина — значит, сырьё привозили издалека. Вместе это значит, что местные мастера работали с привозной глиной. Новые поселенцы или чужие мастерские, скорее всего, принесли бы другие приёмы.`,
  rw62: `Чтобы предпочесть дороги насекомым, нужно исключить насекомых (их численность стабильна) и связать спад с дорогами (сильнее всего возле них). Первый вариант делает и то и другое. Второй, наоборот, указывает на насекомых.`,
  rw63: `Если число записей выросло так же в городах без новой библиотеки, рост, скорее всего, вызван чем-то другим. Остальные факты согласуются с утверждением.`,
  rw64: `Чтобы приписать эффект программе, а не общему фактору, нужно сравнить изменение в группе с программой и в группе без неё. Только первый вариант делает это сравнение (2,1 против 0,2 часа). Последний вариант, наоборот, намекает на общий фактор.`,
  rw65: `У трассы различались две вещи (тепло и азот), и любая из них может объяснить раннее цветение. Поэтому исследователи не могут приписать его одной температуре. Сказать, что температура «no effect», — слишком сильно.`,
  rw66: `Текст излагает неудачу модели, мнение критиков и затем защиту экономиста, за которой остаётся последнее слово. Второй вариант — только позиция критиков, а о согласии критиков насчёт периодов стабильного роста в тексте не говорится.`,
  rw67: `Она вслух хвалит еду, но тайком её исправляет. Значит, вкус ей важен, но из вежливости она держит мнение при себе — она тактична.`,
  rw68: `Когда элементы перечня сами содержат запятые (город, штат), элементы разделяют точкой с запятой. Остальные элементы уже разделены ею, поэтому «Texas;» сохраняет единообразие.`,
  rw69: `Дополнительная информация открывается тире, значит, и закрываться должна тире. Запятая или точка с запятой не могут закрыть пару тире, а без закрывающего знака предложение неграмотно.`,
  rw70: `Порядок слов обратный: подлежащее стоит после глагола. Подлежащее — «an instrument and several jars», это множественное число, поэтому «were». «Artifacts» входит в предложную группу и подлежащим не является.`,
  rw71: `Придаточное указывает, о каком романе речь, то есть оно обязательное (essential) и запятыми не выделяется. Такое придаточное вводит «that». С «, which» понадобилась бы закрывающая запятая после 1998.`,
  rw72: `Подлежащему «Chien-Shiung Wu» нужно сказуемое. Длинное придаточное с «whose» между запятыми лишь отвлекает. «Being», «having been» и «to be» сказуемым быть не могут.`,
  rw73: `С «neither...nor» глагол согласуется с ближайшим подлежащим — «the actors» (множественное число). Предложение в прошедшем времени («would be cut»), поэтому «were».`,
  rw74: `«However» здесь связывает два независимых предложения, поэтому перед ним нужна точка с запятой, а после — запятая. Запятая перед ним даёт comma splice.`,
  rw75: `Крах в одних городах противопоставлен процветанию в других. Это контраст: «By contrast».`,
  rw76: `За похвалой масштабу следует критика точности («another matter»), поэтому связка должна выражать противопоставление: «however».`,
  rw77: `Первое предложение называет недостаток, второе — достоинство вопреки ему. «Still» (и всё же) выражает эту уступку.`,
  rw78: `Фактический результат заменил ожидаемый — это выражает «Instead» (вместо этого). «Accordingly» означало бы, что результат вытекал из ожиданий.`,
  rw79: `Только первый вариант называет общее свойство обоих волокон. Два варианта описывают различия, а последний говорит только о паутине.`,
  rw80: `У цели две части: назвать задачу исследования и объяснить обесцвечивание кораллов тем, кто о нём не знает. Только первый вариант делает и то и другое. Второй сообщает результат, а не цель.`,
  rw81: `Для контраста нужны обе формы — ранняя и поздняя — в противопоставлении. Это делает только вариант с «Whereas».`,

  m1: `Прибавьте 7 к обеим частям: 3<i>x</i> = 18. Разделите на 3: <i>x</i> = 6.`,
  m2: `Ежемесячная плата умножается на <i>m</i> (25<i>m</i>), а вступительный взнос прибавляется один раз (+40).`,
  m3: `Сложите уравнения: 2<i>x</i> = 14, значит, <i>x</i> = 7. (Тогда <i>y</i> = 3.)`,
  m4: `Угловой коэффициент = (13 − 5) ÷ (6 − 2) = 8 ÷ 4 = 2.`,
  m5: `Разложите на множители: (<i>x</i> − 2)(<i>x</i> − 3) = 0, значит, <i>x</i> = 2 или 3. Сумма равна 5. (Короче: для <i>x</i><sup>2</sup> + <i>bx</i> + <i>c</i> сумма корней равна −<i>b</i>.)`,
  m6: `(−2)<sup>2</sup> = 4, поэтому <i>f</i>(−2) = 2(4) − 3 = 5. Частая ошибка — возвести в квадрат после умножения, тогда получится −11.`,
  m7: `За <i>t</i> часов происходит <i>t</i>/3 удвоений, поэтому численность равна 500 × 2<sup><i>t</i>/3</sup>. Проверка: при <i>t</i> = 3 получается 1 000.`,
  m8: `(<i>x</i> + 3)(<i>x</i> + 3) = <i>x</i><sup>2</sup> + 3<i>x</i> + 3<i>x</i> + 9 = <i>x</i><sup>2</sup> + 6<i>x</i> + 9. Не забудьте средний член.`,
  m9: `32 = 2<sup>5</sup>, значит, <i>x</i> + 1 = 5 и <i>x</i> = 4.`,
  m10: `Пять чисел со средним 9 в сумме дают 45. 4 + 8 + 10 + 14 = 36, значит, <i>x</i> = 45 − 36 = 9.`,
  m11: `Цена со скидкой: 80 × 0,75 = 60. С налогом: 60 × 1,08 = 64,80.`,
  m12: `Всего 6 + 4 + 10 = 20 шариков, из них 4 синих: 4/20 = 1/5.`,
  m13: `6<sup>2</sup> + 8<sup>2</sup> = 36 + 64 = 100, а √100 = 10. (Это треугольник 3-4-5, увеличенный в 2 раза.)`,
  m14: `Уравнение имеет вид (<i>x</i> − <i>h</i>)<sup>2</sup> + (<i>y</i> − <i>k</i>)<sup>2</sup> = <i>r</i><sup>2</sup>, центр — (<i>h</i>, <i>k</i>). Здесь <i>h</i> = 3, а <i>y</i> + 2 = <i>y</i> − (−2), поэтому <i>k</i> = −2. Радиус равен 7.`,
  m15: `sin <i>A</i> = противолежащий катет / гипотенуза = 3/5, значит, прилежащий катет равен 4 (треугольник 3-4-5). cos <i>A</i> = прилежащий катет / гипотенуза = 4/5.`,
  m16: `Длина окружности = 2π<i>r</i> = 10π, значит, <i>r</i> = 5. Площадь = π<i>r</i><sup>2</sup> = 25π.`,
  m17: `Раскройте скобки: 5<i>x</i> − 10 = 3<i>x</i> + 4. Вычтите 3<i>x</i> и прибавьте 10: 2<i>x</i> = 14, значит, <i>x</i> = 7.`,
  m18: `Пересечение с осью <i>y</i> — там, где <i>x</i> = 0: <i>y</i> = −3(0) + 6 = 6, то есть (0, 6). Точка (2, 0) — пересечение с осью <i>x</i>.`,
  m19: `У параллельных прямых одинаковые угловые коэффициенты. Коэффициент 4 есть только у <i>y</i> = 4<i>x</i> + 7. У <i>y</i> = −¼<i>x</i> + 2 коэффициент противоположный и обратный, поэтому эта прямая перпендикулярна.`,
  m20: `Общий вес — 600 + 35<i>b</i>, а «at most» (не более) означает ≤ 2 000.`,
  m21: `600 + 35<i>b</i> ≤ 2 000 → 35<i>b</i> ≤ 1 400 → <i>b</i> ≤ 40.`,
  m22: `Подставьте: 2<i>x</i> + 3(<i>x</i> − 1) = 12 → 5<i>x</i> − 3 = 12 → <i>x</i> = 3. Тогда <i>y</i> = 3 − 1 = 2.`,
  m23: `Нет решений — значит, прямые параллельны и не совпадают. Коэффициенты пропорциональны: 3/6 = <i>k</i>/4, значит, <i>k</i> = 2. Проверьте, что свободные члены не в том же отношении: 8/5 ≠ 1/2, прямые различны.`,
  m24: `<i>a</i> + <i>c</i> = 50 и 12<i>a</i> + 8<i>c</i> = 520. Подставьте <i>c</i> = 50 − <i>a</i>: 12<i>a</i> + 400 − 8<i>a</i> = 520 → 4<i>a</i> = 120 → <i>a</i> = 30.`,
  m25: `Угловой коэффициент = (16 − 7) ÷ (4 − 1) = 3. При переходе от <i>x</i> = 1 к <i>x</i> = 0 вычитаем 3: <i>f</i>(0) = 7 − 3 = 4.`,
  m26: `15 умножается на <i>h</i>, поэтому стоимость растёт на $15 за каждый дополнительный час. 50 — фиксированная плата, а часовой визит стоит $65.`,
  m27: `<i>x</i> − 4 = 9 или <i>x</i> − 4 = −9, значит, <i>x</i> = 13 или <i>x</i> = −5. Среди вариантов есть только −5.`,
  m28: `Разность квадратов: <i>a</i><sup>2</sup> − <i>b</i><sup>2</sup> = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>). При <i>b</i> = 3 получаем (<i>x</i> − 3)(<i>x</i> + 3).`,
  m29: `У параболы <i>y</i> = (<i>x</i> − <i>h</i>)<sup>2</sup> + <i>k</i> вершина — точка (<i>h</i>, <i>k</i>) = (2, 5).`,
  m30: `Перенесите всё в одну часть: <i>x</i><sup>2</sup> − 4<i>x</i> − 12 = 0 → (<i>x</i> − 6)(<i>x</i> + 2) = 0. Корни 6 и −2, положительный — 6.`,
  m31: `3<sup>4</sup> = 3 × 3 × 3 × 3 = 81.`,
  m32: `Изнутри наружу: <i>h</i>(2) = 2(2) − 3 = 1. Затем <i>g</i>(1) = 1<sup>2</sup> + 1 = 2.`,
  m33: `Потеря 15% в год оставляет 85% стоимости, поэтому каждый год умножаем на 0,85: 24 000(0,85)<sup><i>t</i></sup>. При 0,15 оставалось бы только 15%.`,
  m34: `Минус перед скобкой меняет знак каждого члена: 2<i>x</i><sup>2</sup> + 3<i>x</i> − <i>x</i><sup>2</sup> + 5<i>x</i> − 4 = <i>x</i><sup>2</sup> + 8<i>x</i> − 4.`,
  m35: `Разделите каждый член на <i>x</i>: <i>x</i><sup>2</sup>/<i>x</i> + 6<i>x</i>/<i>x</i> = <i>x</i> + 6.`,
  m36: `Ровно одно решение — значит, дискриминант равен нулю: 6<sup>2</sup> − 4(1)(<i>c</i>) = 0 → 36 = 4<i>c</i> → <i>c</i> = 9. Тогда уравнение имеет вид (<i>x</i> + 3)<sup>2</sup> = 0.`,
  m37: `Возведите обе части в квадрат: <i>x</i> + 3 = 25, значит, <i>x</i> = 22. Проверка: √25 = 5.`,
  m38: `18 ÷ 45 = 0,4 страницы в секунду. 5 минут = 300 секунд, а 0,4 × 300 = 120.`,
  m39: `При шести значениях медиана — среднее двух центральных: (7 + 9) ÷ 2 = 8.`,
  m40: `Вопрос ограничивает выбор учениками 12-го класса (их 80). Из них 50 предпочитают искусство: 50/80 = 5/8. Ответ 5/14 считает всех 140 учеников — это частая ловушка.`,
  m41: `12 стаканов муки — это 3 × 4, значит, сахара нужно 2 × 4 = 8 стаканов.`,
  m42: `Углы, дополняющие друг друга до 180° (supplementary), в сумме дают 180°: <i>x</i> + 4<i>x</i> = 180 → 5<i>x</i> = 180 → <i>x</i> = 36.`,
  m43: `V = π<i>r</i><sup>2</sup><i>h</i> = π(9)(10) = 90π.`,
  m44: `Коэффициент подобия 10/4 = 2,5. <i>EF</i> = 6 × 2,5 = 15.`,
  m45: `Раскройте скобки: 4<i>x</i> − 4<i>a</i> + 2 = 4<i>x</i> − 10. Члены с <i>x</i> совпадают, поэтому решений бесконечно много при −4<i>a</i> + 2 = −10, то есть <i>a</i> = 3.`,
  m46: `10 = −2<i>k</i> + 4 → <i>k</i> = −3. Положите <i>y</i> = 0: 0 = −3<i>x</i> + 4 → <i>x</i> = 4/3. (Принимается и 1.333.)`,
  m47: `<i>n</i> + <i>b</i> = 10 и 3<i>n</i> + 7<i>b</i> = 50. Подставьте <i>n</i> = 10 − <i>b</i>: 30 + 4<i>b</i> = 50 → <i>b</i> = 5.`,
  m48: `Решений бесконечно много, когда одно уравнение кратно другому. Переход от −5<i>y</i> к 15<i>y</i> — умножение на −3, и 7 × (−3) = −21 сходится. Значит, <i>a</i> = 2 × (−3) = −6.`,
  m49: `Проверьте (1, 4): 4 &gt; 2(1) − 3 = −1 ✓ и 4 &lt; −1 + 6 = 5 ✓. (4, 4) не проходит первое неравенство (4 &gt; 5 неверно), (3, 2) — тоже (2 &gt; 3), а (−1, 8) не проходит второе (8 &lt; 7).`,
  m50: `За 8 минут уходит 160 литров, то есть 20 литров в минуту. 500 ÷ 20 = 25 минут.`,
  m51: `Сложите уравнения: члены с <i>y</i> сокращаются, и 4<i>x</i> = 12. Находить <i>x</i> отдельно не нужно.`,
  m52: `У данной прямой угловой коэффициент −2/3, значит, у ℓ он равен 3/2. <i>y</i> − 1 = (3/2)(<i>x</i> − 4) → <i>y</i> = 1,5<i>x</i> − 5. Пересечение с осью <i>y</i> — −5.`,
  m53: `$300 000 — это 300 тысяч. 12<i>t</i> + 150 &gt; 300 → <i>t</i> &gt; 12,5. Первое целое значение после этого — <i>t</i> = 13, то есть 2015 + 13 = 2028.`,
  m54: `Для <i>x</i><sup>2</sup> + <i>bx</i> + <i>c</i> произведение корней равно <i>c</i> = 16. Значит, 2 × <i>r</i> = 16 и <i>r</i> = 8. (Тогда <i>b</i> = −10.)`,
  m55: `Вершина параболы лежит посередине между нулями функции. Нули — 3 и −5, а (3 + (−5)) ÷ 2 = −1.`,
  m56: `−5 = <i>a</i>(4 − 2)<sup>2</sup> + 7 → −5 = 4<i>a</i> + 7 → 4<i>a</i> = −12 → <i>a</i> = −3.`,
  m57: `Запишите обе части как степени тройки: 3<sup>2<i>x</i></sup> = 3<sup>3</sup>, значит, 2<i>x</i> = 3 и <i>x</i> = 3/2 (или 1,5).`,
  m58: `Разложите на множители: (<i>x</i> − 2)(<i>x</i> + 2) ÷ (<i>x</i> + 2)<sup>2</sup>. Сократите один множитель (<i>x</i> + 2): получится (<i>x</i> − 2) ÷ (<i>x</i> + 2). Сокращать члены с <i>x</i><sup>2</sup> напрямую нельзя.`,
  m59: `Дискриминант <i>b</i><sup>2</sup> − 4<i>ac</i> = 16 − 40 = −24. При отрицательном дискриминанте действительных решений нет.`,
  m60: `Множитель 1,05 означает, что каждый год численность составляет 105% от прошлогодней, то есть растёт на 5%. «60 человек в год» описывает линейный рост, а при <i>t</i> = 0 численность равна 1 200.`,
  m61: `Приравняйте: <i>x</i><sup>2</sup> − 4<i>x</i> + 7 = 2<i>x</i> − 2 → <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = 0 → (<i>x</i> − 3)<sup>2</sup> = 0, значит, <i>x</i> = 3. Прямая касается параболы.`,
  m62: `(<i>x</i> − <i>r</i>) — множитель тогда и только тогда, когда <i>p</i>(<i>r</i>) = 0. <i>p</i>(2) = 8 − 8 − 18 + 18 = 0. Группировка подтверждает: <i>x</i><sup>2</sup>(<i>x</i> − 2) − 9(<i>x</i> − 2) = (<i>x</i> − 2)(<i>x</i> − 3)(<i>x</i> + 3).`,
  m63: `1,20 × 0,80 = 0,96, значит, итоговая цена — 96% от исходной. Изменения не компенсируют друг друга, потому что скидка 20% берётся от большей суммы.`,
  m64: `Исходная сумма 10 × 12 = 120. Без 30 остаётся 90 на 9 значений: 90 ÷ 9 = 10.`,
  m65: `Выделите полные квадраты: (<i>x</i><sup>2</sup> − 6<i>x</i> + 9) + (<i>y</i><sup>2</sup> + 8<i>y</i> + 16) = 25, то есть (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 25, и радиус равен 5.`,
  m66: `120° — это 1/3 от 360°. Длина окружности 2π(6) = 12π, а 1/3 от неё — 4π.`,
  rw82: `Текст 1 утверждает, что печатный станок изменил грамотность быстро. Текст 2 показывает медленный рост «for nearly two centuries» и называет другие причины — школы и дешёвую бумагу. При этом текст 2 не говорит, что станок вообще не повлиял: другие факторы были важны «at least as much».`,
  rw83: `Проектировщики исходят из того, что «the same number of cars» получит больше места. Текст 2 показывает, что это допущение не работает: когда ездить становится проще, машин становится больше, и пробки возвращаются. Текст 2 прямо говорит, что ширина дороги влияет на поведение водителей, поэтому два последних варианта ему противоречат.`,
  m67: `Подставьте <i>y</i> = 9: <i>x</i><sup>2</sup> = 9, то есть <i>x</i> = 3 или <i>x</i> = −3. Нужно положительное значение — 3.`,
  m68: `Приравняйте правые части: <i>x</i><sup>2</sup> + 1 = <i>x</i> + 3 → <i>x</i><sup>2</sup> − <i>x</i> − 2 = 0 → (<i>x</i> − 2)(<i>x</i> + 1) = 0. Значения <i>x</i> равны 2 и −1, их сумма равна 1.`,
  m69: `(<i>x</i> − 1)<sup>2</sup> = 4 означает <i>x</i> − 1 = 2 или <i>x</i> − 1 = −2, то есть <i>x</i> = 3 или <i>x</i> = −1. Получаются две точки, (3, 4) и (−1, 4): горизонтальная прямая пересекает параболу дважды.`,
  m70: `Подставьте: <i>x</i><sup>2</sup> + (<i>x</i> + 1)<sup>2</sup> = 25 → 2<i>x</i><sup>2</sup> + 2<i>x</i> − 24 = 0 → <i>x</i><sup>2</sup> + <i>x</i> − 12 = 0 → (<i>x</i> + 4)(<i>x</i> − 3) = 0. Положительное решение <i>a</i> = 3, значит <i>b</i> = 3 + 1 = 4.`,
  m71: `8 стаканов сахара — это 2 стакана, умноженные на 4, поэтому муку тоже умножаем на 4: 3 × 4 = 12 стаканов.`,
  m72: `Умножьте расстояние на карте на масштаб: 3,5 × 25 = 87,5 мили.`,
  m73: `В отношении 4 + 5 = 9 частей, значит, одна часть — это 36 : 9 = 4 ученика. На девочек приходится 5 частей: 5 × 4 = 20.`,
  m74: `Перемножьте отношения, чтобы <i>y</i> сократилось: (<i>x</i>/<i>y</i>)(<i>y</i>/<i>z</i>) = <i>x</i>/<i>z</i> = (3/4)(2/5) = 6/20 = 3/10 (или 0,3).`,
  m75: `Средняя скорость — это расстояние, делённое на время: 150 : 2,5 = 60 миль в час.`,
  m76: `Скорость печати — 45 : 3 = 15 страниц в минуту. 240 : 15 = 16 минут.`,
  m77: `Переведите обе единицы: 3 фута в секунду × 12 дюймов в футе = 36 дюймов в секунду, а 36 × 60 секунд в минуте = 2 160 дюймов в минуту.`,
  m78: `27 000 : 2,5 = 10 800 секунд. В часе 3 600 секунд, поэтому 10 800 : 3 600 = 3 часа.`,
  m79: `30% — это 0,30, и 0,30 × 250 = 75.`,
  m80: `После скидки 20% вы платите 80% исходной цены: 0,8<i>p</i> = 80, значит, <i>p</i> = 100. Если просто прибавить 20% к $80, получится $96 — это частая ошибка.`,
  m81: `Прирост составил 2 000 − 1 600 = 400. Разделите на исходное значение: 400 : 1 600 = 0,25, то есть 25%.`,
  m82: `Всего 4 + 6 + 10 = 20 шариков, из них 6 синих. 6/20 = 3/10.`,
  m83: `Учитываются только 80 учеников, которые играют на инструменте. Из них 45 занимаются спортом: 45/80 = 9/16 (или 0,5625). Дробь 45/200 отвечала бы на другой вопрос.`,
  m84: `Кратные 3: 3, 6, 9, 12, 15, 18 (6 чисел). Кратные 5: 5, 10, 15, 20 (4 числа). Число 15 посчитано дважды, поэтому подходящих чисел 6 + 4 − 1 = 9. 9/20 = 0,45.`,
  m85: `Упорядочьте значения: 3, 4, 7, 9, 12. Среднее по порядку значение — 7.`,
  m86: `Сумма первых значений: 5 × 8 = 40. Новая сумма: 6 × 9 = 54. Добавленное значение: 54 − 40 = 14.`,
  m87: `Подставьте <i>x</i> = 6: 2,5(6) + 10 = 15 + 10 = 25 сантиметров.`,
  m88: `Угловой коэффициент — это изменение <i>y</i> (балла) при увеличении <i>x</i> (часов телевизора) на единицу. Он равен −0,8, значит, прогнозируемый балл снижается на 0,8 за каждый час. Число 92 — это свободный член: прогнозируемый балл без телевизора.`,
  m89: `Каждое значение в 3 раза больше предыдущего — это экспоненциальный рост с множителем 3. Начальное значение при <i>t</i> = 0 равно 5, поэтому <i>f</i>(<i>t</i>) = 5(3)<sup><i>t</i></sup>. Линейная функция подходит только для первых двух точек, а 5<i>t</i><sup>3</sup> даёт 0 при <i>t</i> = 0.`,
  m90: `В выборке парк поддерживают 120 : 400 = 30%. Случайная выборка позволяет перенести эту долю на весь город: 0,30 × 20 000 = 6 000.`,
  m91: `Погрешность задаёт правдоподобный диапазон от 54 − 3 = 51% до 54 + 3 = 57%. В этот диапазон попадает только 52%.`,
  m92: `Чем больше случайная выборка, тем точнее оценка, поэтому погрешность уменьшается с ростом объёма выборки. Выборка B больше, значит, её погрешность, скорее всего, меньше.`,
  m93: `Случайное распределение по группам позволяет делать вывод о причине и следствии. Но добровольцы не были случайной выборкой из всех взрослых, поэтому вывод относится только к людям, похожим на них, а не ко всем.`,
  m94: `Случайная выборка позволяет распространить результат на взрослых жителей города. Но в опросе людей только наблюдали: никого не назначали заводить собаку. Поэтому опрос показывает связь, но не причину — ни в одну, ни в другую сторону.`,
  m95: `Только случайная выборка из всех учеников даёт каждому ученику одинаковый шанс попасть в опрос. Ученики в библиотеке или в математической команде, вероятно, тратят на домашние задания больше времени, чем в среднем, а те, кто приходит рано, тоже могут отличаться от остальных.`,
  m96: `Смежные углы, образованные двумя пересекающимися прямыми, лежат на одной прямой, поэтому в сумме дают 180°: 180 − 65 = 115.`,
  m97: `Односторонние углы при параллельных прямых в сумме дают 180°: (3<i>x</i> + 10) + (2<i>x</i> + 20) = 180 → 5<i>x</i> + 30 = 180 → <i>x</i> = 30.`,
  m98: `Сумма углов равна 180°, она делится на 2 + 3 + 4 = 9 частей по 20°. Наибольший угол: 4 × 20 = 80°.`,
  m99: `Каждый внешний угол равен 180 − 150 = 30°. Сумма внешних углов любого многоугольника — 360°, поэтому сторон 360 : 30 = 12.`,
  m100: `По теореме Пифагора 6<sup>2</sup> + 8<sup>2</sup> = 36 + 64 = 100, и √100 = 10.`,
  m101: `Лестница — это гипотенуза: 5<sup>2</sup> + <i>h</i><sup>2</sup> = 13<sup>2</sup> → 25 + <i>h</i><sup>2</sup> = 169 → <i>h</i><sup>2</sup> = 144 → <i>h</i> = 12.`,
  m102: `В треугольнике с углами 45°-45°-90° гипотенуза равна катету, умноженному на √2, поэтому каждый катет равен 8. Площадь: (1/2)(8)(8) = 32.`,
  m103: `Стороны треугольника с углами 30°-60°-90° относятся как 1 : √3 : 2, то есть равны 5, 5√3 и 10. Периметр: 5 + 10 + 5√3 = 15 + 5√3.`,
  m104: `Синус — это отношение противолежащего катета к гипотенузе. Против угла <i>A</i> лежит <i>BC</i> = 4, гипотенуза <i>AB</i> = 5, поэтому sin <i>A</i> = 4/5.`,
  m105: `Синус угла равен косинусу дополнительного угла: sin(<i>x</i>°) = cos(90° − <i>x</i>°). Значит, 90 − <i>x</i> = 40 и <i>x</i> = 50.`,
  m106: `Тангенс — это отношение противолежащего катета к прилежащему, так что возьмите катеты 5 и 12. Гипотенуза равна √(25 + 144) = 13. Косинус — прилежащий катет, делённый на гипотенузу: 12/13 (примерно 0,923).`,
  m107: `sin <i>A</i> = <i>BC</i>/<i>AB</i>, поэтому <i>BC</i> = 0,6 × 20 = 12. Тогда <i>AC</i><sup>2</sup> + 12<sup>2</sup> = 20<sup>2</sup> → <i>AC</i><sup>2</sup> = 256 → <i>AC</i> = 16.`,
  m108: `Коэффициент подобия: 9 : 3 = 3. Наибольшая сторона: 5 × 3 = 15.`,
  m109: `Солнечные лучи образуют подобные треугольники, поэтому высота пропорциональна длине тени: 6/4 = <i>h</i>/30 → <i>h</i> = 30 × 1,5 = 45 футов.`,
  m110: `Так как <i>DE</i> ∥ <i>BC</i>, треугольник <i>ADE</i> подобен треугольнику <i>ABC</i>. <i>AB</i> = 4 + 6 = 10, так что отношение равно <i>AD</i>/<i>AB</i> = 4/10. Тогда 5/<i>BC</i> = 4/10 → <i>BC</i> = 12,5. Частая ошибка — взять отношение 4/6 вместо 4/10.`,
  m111: `Площади относятся как квадрат отношения сторон: (5/2)<sup>2</sup> = 25/4. Площадь большего треугольника: 12 × 25/4 = 75.`,
  m112: `Объём = длина × ширина × высота = 5 × 4 × 3 = 60 кубических дюймов.`,
  m113: `Объём цилиндра равен π<i>r</i><sup>2</sup><i>h</i> = π(3)<sup>2</sup>(10) = 90π.`,
  m114: `У куба 6 одинаковых квадратных граней, поэтому площадь одной грани 150 : 6 = 25, а ребро равно 5. Объём: 5<sup>3</sup> = 125.`,
  m115: `π<i>r</i><sup>2</sup> = 49π, значит, <i>r</i> = 7. Длина окружности: 2π<i>r</i> = 14π.`,
  m116: `Радиус — это расстояние от (2, −3) до (5, 1): √(3<sup>2</sup> + 4<sup>2</sup>) = 5, поэтому <i>r</i><sup>2</sup> = 25. Центр (<i>h</i>, <i>k</i>) = (2, −3), и уравнение имеет вид (<i>x</i> − 2)<sup>2</sup> + (<i>y</i> + 3)<sup>2</sup> = 25. Справа стоит <i>r</i><sup>2</sup>, а не <i>r</i>.`,
  rw84: `Утверждение касается периода с февраля по апрель, поэтому нужно показать рост в каждом из этих месяцев. Только первый вариант приводит все три значения по возрастанию. Остальные варианты говорят о январе, который в утверждение не входит.`,
  m117: `Прибавьте 5 к обеим частям: 3<i>x</i> &gt; 15, то есть <i>x</i> &gt; 5. Больше 5 только 6. При <i>x</i> = 5 обе части равны, а строгое неравенство это не допускает.`,
  m118: `Угловой коэффициент: (20 − 11) : (5 − 2) = 3. При переходе от <i>x</i> = 2 к <i>x</i> = 0 значение уменьшается на 2 × 3 = 6, поэтому <i>f</i>(0) = 11 − 6 = 5.`,
  m119: `Раскройте скобки: 3<i>x</i> + 12 = 5<i>x</i> − 6. Вычтите 3<i>x</i> и прибавьте 6: 18 = 2<i>x</i>, значит, <i>x</i> = 9.`,
  m120: `Поездки различаются на 10 − 4 = 6 миль, и каждая миля добавляет к прогнозу $2,10: 6 × 2,1 = 12,6. Слагаемое 3,5 одинаково для обеих поездок и сокращается.`,
  m121: `Вершина параболы находится при <i>t</i> = −<i>b</i> : 2<i>a</i> = −20 : (−10) = 2. Тогда <i>h</i>(2) = −5(4) + 20(2) + 1 = −20 + 40 + 1 = 21 метр.`,
  m122: `В выборке повреждено 3 : 50 = 6% коробок. Переносим эту долю на весь день: 0,06 × 4 000 = 240 коробок.`,
  m123: `Погрешность задаёт правдоподобный диапазон для среднего по всей совокупности, из которой взята выборка: 6,8 ± 0,3, то есть от 6,5 до 7,1 часа. Это ничего не говорит об отдельных студентах, а выборка взята только из университета X, а не из всех университетов.`,
  m124: `Люди, которые сами решили ответить на опрос на сайте, — это самоотобранная выборка, и их мнение может быть сильнее, чем у других покупателей. 2 000 человек — большая выборка, так что проблема не в размере, а в способе отбора.`,
  m125: `Случайное назначение удобрения позволяет сделать вывод о причине и следствии, так что это больше, чем просто связь. Фермы выбраны случайно из этого региона, поэтому вывод относится к региону, но не ко всем фермам в мире.`
};

const EX_UZ = {
  rw1: `Ikki nuqta undan keyingi qism boʻsh joyni tushuntirishini bildiradi. “Committing to a single design”dan qochadigan va oʻzgarishlarga joy qoldiradigan eskizlar provisional, yaʼni vaqtinchalik, qayta koʻrib chiqilishi mumkin boʻlgan eskizlardir.`,
  rw2: `“Although” u oʻz kasbi haqida “at length” (batafsil) yozgan maktublar bilan qarama-qarshilik hosil qiladi. “Brief and guarded answers” (qisqa va ehtiyotkor javoblar) berish uning reticent, yaʼni kamgap va sir saqlovchi boʻlganini bildiradi.`,
  rw3: `Barcha muammolarni atigi toʻrt sahifada qamrab olish concision, yaʼni koʻp narsani oz soʻz bilan aytish qobiliyatini koʻrsatadi. Redundancy (ortiqchalik) buning aksi.`,
  rw4: `Birinchi gap tardigradalar suvsizlikka bardosh berishini aytadi. Ikkinchi gap buning mexanizmini tasvirlaydi (ular “tun” holatiga oʻralib, moddalar almashinuvini sekinlashtiradi). U hech narsani rad etmaydi, qayta tirilish esa uchinchi gapda tasvirlangan.`,
  rw5: `Matn shahar asalari uyalarining koʻpayishidan ogohlantirishga oʻtadi: gullar kam joyda gullar uchun raqobat yovvoyi asalarilarga zarar berishi mumkin. Matn taqiqlashga chaqirmaydi va qaysi asalari qaysi gullarni afzal koʻrishini solishtirmaydi.`,
  rw6: `Hosil umuman oʻsgan (42 dan 55 gacha), faqat 2018 (51) dan 2019 (47) gacha bir marta kamaygan. Qolgan variantlar jadvalni notoʻgʻri oʻqiydi: eng yuqori natija 2020-yilda 55 boʻlgan va 2020-yil eng past emas, eng yuqori yil.`,
  rw7: `Odatiy saqlash quritish va muzlatishni anglatadi. Agar avokado va kakao urugʻlari bunday sharoitda nobud boʻlsa, odatiy usullar ularni saqlay olmaydi. Matnda boshqa variantlarni tasdiqlovchi hech narsa yoʻq.`,
  rw8: `Eng qadimgi qatlamlarda dehqonchilik qurollari bor, baliq ovlash anjomlari esa yoʻq — bu dastlabki turmush tarzi dehqonchilik boʻlganini koʻrsatadi. Baliqchilar u yerda “never” (hech qachon) yashamagan deyish haddan oshiqcha, chunki qazishma faqat eng qadimgi qatlamlarni qamragan.`,
  rw9: `Ikkala qism ham mustaqil gap. Ularni nuqtali vergul bilan bogʻlash mumkin. Faqat vergul qoʻyilsa comma splice xatosi, tinish belgisi boʻlmasa run-on xatosi chiqadi, “which the oldest” esa grammatik jihatdan notoʻgʻri.`,
  rw10: `Ega — “collection”, u birlikda. “Of letters written by the expedition's crew members” predlogli birikma boʻlib, egani oʻzgartirmaydi, shuning uchun feʼl “is” boʻladi.`,
  rw11: `“Both” ikki nafar meʼmor borligini bildiradi va takliflar ularga tegishli, shuning uchun koʻplikdagi qaratqich shakli kerak: architects'.`,
  rw12: `“A nineteenth-century mathematician” — ajratilgan izohlovchi (nonessential appositive). U ikki tomondan vergul bilan ajratilishi kerak. Boshqa variantlarda vergul tushib qolgan yoki nuqtali vergul ishlatilgan, nuqtali vergul esa egani kesimdan ajrata olmaydi.`,
  rw13: `Xavfli sizib chiqishlar zaharli sovutgichlardan foydalanish natijasidir, shuning uchun sabab-natija bogʻlovchisi mos keladi: “Consequently”.`,
  rw14: `Ikkinchi natija (12 foizga oʻsish) birinchisiga (taʼsir yoʻq) qarama-qarshi. “However” shu qarama-qarshilikni bildiradi.`,
  rw15: `Faqat “Stretching about 2,300 kilometers” varianti hajm haqida gapiradi va uzunlikni (2 300 km) ham, “world's largest” faktini ham ishlatadi. Boshqalari joylashuv yoki biologik xilma-xillikka qaratilgan.`,
  m1: `Ikkala tomonga 7 ni qoʻshing: 3<i>x</i> = 18. 3 ga boʻling: <i>x</i> = 6.`,
  m2: `Oylik toʻlov <i>m</i> ga koʻpaytiriladi (25<i>m</i>), roʻyxatdan oʻtish toʻlovi esa bir marta qoʻshiladi (+40).`,
  m3: `Tenglamalarni qoʻshing: 2<i>x</i> = 14, demak <i>x</i> = 7. (Unda <i>y</i> = 3.)`,
  m4: `Burchak koeffitsiyenti = (13 − 5) ÷ (6 − 2) = 8 ÷ 4 = 2.`,
  m5: `Koʻpaytuvchilarga ajrating: (<i>x</i> − 2)(<i>x</i> − 3) = 0, demak <i>x</i> = 2 yoki 3. Yigʻindi 5 ga teng. (Qisqa yoʻl: <i>x</i><sup>2</sup> + <i>bx</i> + <i>c</i> uchun ildizlar yigʻindisi −<i>b</i> ga teng.)`,
  m6: `(−2)<sup>2</sup> = 4, demak <i>f</i>(−2) = 2(4) − 3 = 5. Koʻp uchraydigan xato — avval koʻpaytirib, keyin kvadratga oshirish, bu −11 ni beradi.`,
  m7: `<i>t</i> soat ichida son <i>t</i>/3 marta ikki baravar ortadi, shuning uchun bakteriyalar soni 500 × 2<sup><i>t</i>/3</sup>. Tekshiring: <i>t</i> = 3 da 1 000 chiqadi.`,
  m8: `(<i>x</i> + 3)(<i>x</i> + 3) = <i>x</i><sup>2</sup> + 3<i>x</i> + 3<i>x</i> + 9 = <i>x</i><sup>2</sup> + 6<i>x</i> + 9. Oʻrta hadni unutmang.`,
  m9: `32 = 2<sup>5</sup>, demak <i>x</i> + 1 = 5 va <i>x</i> = 4.`,
  m10: `Oʻrta arifmetigi 9 boʻlgan beshta sonning yigʻindisi 45 ga teng. 4 + 8 + 10 + 14 = 36, demak <i>x</i> = 45 − 36 = 9.`,
  m11: `Chegirmali narx: 80 × 0,75 = 60. Soliq bilan: 60 × 1,08 = 64,80.`,
  m12: `Jami 6 + 4 + 10 = 20 ta shar bor, ulardan 4 tasi koʻk: 4/20 = 1/5.`,
  m13: `6<sup>2</sup> + 8<sup>2</sup> = 36 + 64 = 100, va √100 = 10. (Bu 2 marta kattalashtirilgan 3-4-5 uchburchak.)`,
  m14: `Tenglama (<i>x</i> − <i>h</i>)<sup>2</sup> + (<i>y</i> − <i>k</i>)<sup>2</sup> = <i>r</i><sup>2</sup> koʻrinishida, markazi (<i>h</i>, <i>k</i>). Bu yerda <i>h</i> = 3, <i>y</i> + 2 = <i>y</i> − (−2), demak <i>k</i> = −2. Radius 7 ga teng.`,
  m15: `sin <i>A</i> = qarshi katet / gipotenuza = 3/5, demak yopishgan katet 4 ga teng (3-4-5 uchburchak). cos <i>A</i> = yopishgan katet / gipotenuza = 4/5.`,
  m16: `Aylana uzunligi = 2π<i>r</i> = 10π, demak <i>r</i> = 5. Yuza = π<i>r</i><sup>2</sup> = 25π.`,
  rw16: `Qonun chiqaruvchilar oldida guvohlik berish va tabiatni muhofaza qilish guruhlarini tashkil etish — biror gʻoyani ochiq qoʻllab-quvvatlash usullari, advocating aynan shuni anglatadi.`,
  rw17: `Muhandislar jiddiy kamchilik topdi va shahar oldingi rejaga qaytdi. Demak, loyiha rad etilgan (rejected).`,
  rw18: `“Ranging from friendship to astronomy” mavzulardagi esselar koʻplab turli manba va mavzularga tayanadi, eclectic aynan shuni anglatadi. “Systematic” esa kitob qochadigan yagona nazariyaga mos keladi.`,
  rw19: `Janrlar orasida bemalol oʻtish u oʻz uslubini yangi sharoitga moslashtira olganini koʻrsatadi, adapt aynan shuni anglatadi.`,
  rw20: `Ishtirokchilar savollarni oʻtkazib yuborgani maʼlumotlarda boʻshliqlar qoldirgan, demak maʼlumotlar toʻliq emas edi (incomplete). Maʼlumotlar toʻqib chiqarilgani (fabricated) haqida hech narsa aytilmagan.`,
  rw21: `“But” va “grew more enthusiastic” birinchi taqrizlar unchalik iliq boʻlmaganini bildiradi. Lukewarm — eng yaxshi holatda biroz ijobiy degani.`,
  rw22: `Matn bir taxminni (choʻllar jonsiz) aytadi, soʻng uni Sonora choʻli haqidagi raqamlar bilan rad etadi. Unda yogʻingarchilik, boshqa choʻllar yoki xavflar haqida gap yoʻq.`,
  rw23: `1-gap — yutuq (1933-yilgi simfoniya), 2-gap — unutilish (“went unplayed”), 3-gap — burilish (qiziqishni qayta uygʻotgan 2009-yilgi topilma).`,
  rw24: `Dastlabki ikki gap har bir tomon nima yutishini koʻrsatadi (odamlar asal, qushlar mum oladi). Uchinchi gap buni “benefits both species” hamkorlik sifatida umumlashtiradi.`,
  rw25: `1-matn ish haqi oshirilgandan keyin ish oʻrinlari kamayishini bashorat qiladi. 2-matn bandlik “did not fall” ekanini aniqlagan, bu bashoratga bevosita zid. 2-matn ish haqini kadrlar qoʻnimsizligi bilan ham bogʻlaydi, shuning uchun ular bogʻliq emas demaydi.`,
  rw26: `2-matn “slow, cold-blooded, tail-dragging” tasavvuriga zid boʻlgan ikki xil qazilma dalilni keltiradi (dum izlari yoʻq, tez oʻsish), shuning uchun muallif bu tasavvurni eskirgan deb hisoblaydi.`,
  rw27: `Matn toʻsiqlar tizimini tasvirlaydi va u bir nechta katta suv toshqinining oldini olganini aytadi. U “all flooding”ni toʻxtatgan deyish mubolagʻa, MOSEdan voz kechish haqida hech qayerda gap yoʻq, 2020-yil esa “for centuries”ga zid.`,
  rw28: `Oxirgi gapda muskullar “stretch it open to display its color” deyilgan. Boshqa variantlar matnda tilga olinmagan.`,
  rw29: `Qishloq chetida qayta-qayta orqaga qaytish ketishni istamaslikni koʻrsatadi. Boshqa iqtiboslar qishloq yoki boshqa odamlarni tasvirlaydi, Maraning ikkilanishini emas.`,
  rw30: `Daʼvo velosipedni avtomobil bilan solishtiradi, shuning uchun dalil ikkalasini ham oʻz ichiga olishi kerak: velosipedda 19 daqiqa, avtomobilda 27 daqiqa. Boshqa variantlar toʻgʻri, lekin bu ikki usulni solishtirmaydi.`,
  rw31: `14% − 2% = 12 foiz punkt. Ulush yetti baravar oshgan, demak shunchaki ikki baravar emas, 14 punkt esa 2% lik boshlangʻich qiymatni hisobga olmaydi.`,
  rw32: `Pufakchalarda eski havo saqlanadi, chuqurlik esa yoshga mos keladi. Demak, chuqurliklarni solishtirish turli davrlardagi atmosferani solishtirishdir.`,
  rw33: `Jumboq bir xil edi, faqat uning tavsifi oʻzgardi. Xatti-harakat farq qilgani uchun tavsif qiziqishga taʼsir qilgan.`,
  rw34: `Agar tukli arilar olib tashlanganda urugʻ hosil boʻlishi toʻxtasa, oʻsimlik ularga bogʻliq. Boshqa hasharotlar kelishi bu gʻoyani zaiflashtiradi, gullash vaqti yoki rang afzalligi esa bu oʻsimlikning bogʻliqligi haqida hech narsa demaydi.`,
  rw35: `Matn sekin qoʻlda koʻchirishni tez bosib chiqarish bilan solishtiradi va oqibatlarini aytadi: arzonroq narx va gʻoyalarning kengroq tarqalishi.`,
  rw36: `Qunduzlar kamaysa, dengiz tipratikanlari koʻpayadi, tipratikanlar koʻpaysa, ular koʻproq laminariya yeydi. Demak, qunduzlar tipratikanlarni jilovlab, laminariyani himoya qiladi.`,
  rw37: `“By the time” va oʻtgan zamondagi voqea (“arrived”) past perfect zamonni talab qiladi: sayyohlar guruh kelguniga qadar boshpana topib boʻlgan edi.`,
  rw38: `“Orchestra” — birlikdagi jamlovchi ot, shuning uchun olmosh “it” boʻladi. “Them” ega uchun kelishik jihatidan ham notoʻgʻri.`,
  rw39: `Ikki nuqta toʻliq gapdan keyin roʻyxatni kiritadi. Nuqtali vergul ikki mustaqil gapni bogʻlashi kerak, “flour, water, and salt” esa mustaqil gap emas.`,
  rw40: `Ikki mustaqil gapni vergul va bogʻlovchi (“, and”) bilan bogʻlash mumkin. Faqat vergul qoʻyilsa, comma splice xatosi boʻladi.`,
  rw41: `Ega — “Each”, u birlikda. “Of the paintings” buni oʻzgartirmaydi, shuning uchun feʼl “shows” boʻladi.`,
  rw42: `Kirish iborasi qoʻlyozmalarni oʻrgangan kishini tasvirlaydi, shuning uchun aynan shu kishi verguldan keyin kelishi kerak. Faqat bitta variant u yerga “the linguist”ni qoʻyadi. Qolganlari dangling modifier xatosini keltirib chiqaradi.`,
  rw43: `Qushlar bitta mintaqaga tegishli (region's), uya qurish odatlari esa koʻplab qushlarga tegishli (birds'). Demak, ikkala soʻz ham qaratqich shaklida boʻlishi kerak: region's birds'.`,
  rw44: `“Which” bilan boshlangan qism qoʻshimcha maʼlumot beradi, shuning uchun undan oldin ham, keyin ham vergul kerak. Faqat bitta variantda ikkalasi bor.`,
  rw45: `Vergullar orasidagi ibora “walls”ni aniqlaydi va oʻtgan zamon sifatdoshini talab qiladi: “built from local limestone”. “Were built” va “they were built” ikkinchi asosiy feʼl yoki gap qoʻshib, gapni buzadi.`,
  rw46: `“Its” — “company” kabi birlikdagi otning qaratqich shakli. “It's” “it is” degani, “its'” esa hech qachon toʻgʻri emas.`,
  rw47: `Uzoq ekspozitsiya odamlarni qimirlamay turishga majbur qilgan — bu sabab-natija munosabati: “As a result”.`,
  rw48: `Qahva tor sharoitni talab qiladi, choy esa keng sharoitga chidaydi. Bu qarama-qarshilik.`,
  rw49: `Kichik tanlanma natijalarni tasdiqlash zarurligining sababi. Bu xulosa, shuning uchun “Therefore” mos keladi.`,
  rw50: `Ikkinchi gap mangrlar tuz bilan kurashishining yana bir usulini qoʻshadi, shuning uchun bogʻlovchi qoʻshimchani bildirishi kerak.`,
  rw51: `Biznesni rivojlantirish xavfsizlikka qoʻshimcha foyda. Bu qarama-qarshilik ham, xavfsizlikning aniq misoli ham emas.`,
  rw52: `Kirish qismi uning kimligini va nega muhimligini aytishi kerak. Faqat uni Amerikaning birinchi yirik prima-balerinasi deb ataydigan variant ikkalasini ham bajaradi. Boshqalari uning kimligini aytmaydi yoki u haqda emas.`,
  rw53: `Faqat “whereas” varianti ikkala vulqonning otilishini tasvirlaydi va ularni “whereas” bilan bir-biriga qarama-qarshi qoʻyadi.`,
  rw54: `Topilma — velosipedchilar va haydovchilar stressini solishtirish. Faqat bitta variant buni aytadi. Qolganlari tadqiqot qanday tashkil etilganini yoki shaharni tasvirlaydi.`,
  m17: `Qavslarni oching: 5<i>x</i> − 10 = 3<i>x</i> + 4. 3<i>x</i> ni ayiring va 10 ni qoʻshing: 2<i>x</i> = 14, demak <i>x</i> = 7.`,
  m18: `Grafik <i>y</i> oʻqini <i>x</i> = 0 da kesadi: <i>y</i> = −3(0) + 6 = 6, yaʼni (0, 6). (2, 0) esa <i>x</i> oʻqi bilan kesishish nuqtasi.`,
  m19: `Parallel toʻgʻri chiziqlarning burchak koeffitsiyentlari teng. Faqat <i>y</i> = 4<i>x</i> + 7 ning koeffitsiyenti 4. <i>y</i> = −¼<i>x</i> + 2 ning koeffitsiyenti teskari va qarama-qarshi ishorali, demak u perpendikulyar.`,
  m20: `Umumiy ogʻirlik 600 + 35<i>b</i>, “koʻpi bilan” esa ≤ 2 000 degani.`,
  m21: `600 + 35<i>b</i> ≤ 2 000 → 35<i>b</i> ≤ 1 400 → <i>b</i> ≤ 40.`,
  m22: `Oʻrniga qoʻying: 2<i>x</i> + 3(<i>x</i> − 1) = 12 → 5<i>x</i> − 3 = 12 → <i>x</i> = 3. Unda <i>y</i> = 3 − 1 = 2.`,
  m23: `Yechim yoʻqligi toʻgʻri chiziqlar parallel va ustma-ust tushmasligini bildiradi. Koeffitsiyentlar proporsional boʻlishi kerak: 3/6 = <i>k</i>/4, demak <i>k</i> = 2. Ozod hadlar shu nisbatda emasligini tekshiring: 8/5 ≠ 1/2, demak toʻgʻri chiziqlar ustma-ust tushmaydi.`,
  m24: `<i>a</i> + <i>c</i> = 50 va 12<i>a</i> + 8<i>c</i> = 520. <i>c</i> = 50 − <i>a</i> ni qoʻying: 12<i>a</i> + 400 − 8<i>a</i> = 520 → 4<i>a</i> = 120 → <i>a</i> = 30.`,
  m25: `Burchak koeffitsiyenti = (16 − 7) ÷ (4 − 1) = 3. <i>x</i> = 1 dan <i>x</i> = 0 ga qaytsak, qiymat 3 ga kamayadi: <i>f</i>(0) = 7 − 3 = 4.`,
  m26: `15 soni <i>h</i> ga koʻpaytiriladi, demak har bir qoʻshimcha soat narxni $15 ga oshiradi. 50 — belgilangan toʻlov, bir soatlik chaqiruv esa $65 turadi.`,
  m27: `<i>x</i> − 4 = 9 yoki <i>x</i> − 4 = −9, demak <i>x</i> = 13 yoki <i>x</i> = −5. Variantlarda faqat −5 bor.`,
  m28: `Kvadratlar ayirmasi: <i>a</i><sup>2</sup> − <i>b</i><sup>2</sup> = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>). <i>b</i> = 3 boʻlganda (<i>x</i> − 3)(<i>x</i> + 3) chiqadi.`,
  m29: `<i>y</i> = (<i>x</i> − <i>h</i>)<sup>2</sup> + <i>k</i> koʻrinishidagi parabolaning uchi (<i>h</i>, <i>k</i>) = (2, 5).`,
  m30: `Bir tomonga oʻtkazing: <i>x</i><sup>2</sup> − 4<i>x</i> − 12 = 0 → (<i>x</i> − 6)(<i>x</i> + 2) = 0. Yechimlar 6 va −2, musbati 6.`,
  m31: `3<sup>4</sup> = 3 × 3 × 3 × 3 = 81.`,
  m32: `Ichkaridan tashqariga hisoblang: <i>h</i>(2) = 2(2) − 3 = 1. Keyin <i>g</i>(1) = 1<sup>2</sup> + 1 = 2.`,
  m33: `Har yili 15% yoʻqotilsa, qiymatning 85% i qoladi, shuning uchun har yili 0,85 ga koʻpaytiriladi: 24 000(0,85)<sup><i>t</i></sup>. 0,15 ishlatilsa, faqat 15% qolgan boʻlardi.`,
  m34: `Minus ishorasini har bir hadga tarqating: 2<i>x</i><sup>2</sup> + 3<i>x</i> − <i>x</i><sup>2</sup> + 5<i>x</i> − 4 = <i>x</i><sup>2</sup> + 8<i>x</i> − 4.`,
  m35: `Har bir hadni <i>x</i> ga boʻling: <i>x</i><sup>2</sup>/<i>x</i> + 6<i>x</i>/<i>x</i> = <i>x</i> + 6.`,
  m36: `Bitta haqiqiy yechim diskriminant nolga teng ekanini bildiradi: 6<sup>2</sup> − 4(1)(<i>c</i>) = 0 → 36 = 4<i>c</i> → <i>c</i> = 9. Unda tenglama (<i>x</i> + 3)<sup>2</sup> = 0 koʻrinishini oladi.`,
  m37: `Ikkala tomonni kvadratga oshiring: <i>x</i> + 3 = 25, demak <i>x</i> = 22. Tekshiring: √25 = 5.`,
  m38: `18 ÷ 45 = soniyasiga 0,4 sahifa. 5 daqiqa = 300 soniya, va 0,4 × 300 = 120.`,
  m39: `Qiymatlar oltita boʻlganda mediana ikki oʻrta qiymatning oʻrta arifmetigi: (7 + 9) ÷ 2 = 8.`,
  m40: `Savol faqat 12-sinf oʻquvchilari (80 nafar) bilan cheklanadi. Ulardan 50 nafari sanʼatni afzal koʻradi: 50/80 = 5/8. 5/14 barcha 140 oʻquvchini hisobga oladi — bu keng tarqalgan tuzoq.`,
  m41: `12 stakan un — bu 3 ning 4 barobari, shuning uchun 4 × 2 = 8 stakan shakar ishlating.`,
  m42: `Yigʻindisi 180° boʻlgan burchaklar: <i>x</i> + 4<i>x</i> = 180 → 5<i>x</i> = 180 → <i>x</i> = 36.`,
  m43: `V = π<i>r</i><sup>2</sup><i>h</i> = π(9)(10) = 90π.`,
  m44: `Oʻxshashlik koeffitsiyenti 10/4 = 2,5. <i>EF</i> = 6 × 2,5 = 15.`,
  rw55: `Butun xizmatni bitta oilaga berish oʻnlab savdogarlar ishtirok etgan voqeani haddan tashqari soddalashtiradi. Reductive — murakkab narsani haddan tashqari soddalashtirish degani.`,
  rw56: `Tanqidchilarning eʼtirozi asarda oldingi motivlar qayta ishlatilgani bilan bogʻliq. Derivative — oldingi asarlardan olingan yoki ularga asoslangan degani; muallifning fikricha, bu baho asarlar motivlarni qanday oʻzgartirishini eʼtibordan chetda qoldiradi.`,
  rw57: `Koʻp shartlar bilan berilgan rozilik cheklangan yoki qisman boʻladi, qualified aynan shuni anglatadi. Unequivocal (soʻzsiz) — buning aksi.`,
  rw58: `Tadqiqotchilar “don't dispute the warning function”, shuning uchun eski tushuntirish rad etilmaydi. Ular ikkinchi omil sifatida juft tanlashni qoʻshadi. Bu “disproves it entirely” variantini istisno qiladi.`,
  rw59: `2-matn Marlouning oʻzini puxta rejalashtiruvchi qilib koʻrsatishga sababi (olgan avanslari) borligini taxmin qiladi, shuning uchun maktublar xolis manba boʻlmasligi mumkin. Biroq matn u umuman rejalashtirmagan degan darajaga bormaydi.`,
  rw60: `Ikkinchi gap taʼsirni tasvirlaydi (qoʻshimcha yoʻl qatorlari koʻproq haydovchilarni jalb qiladi). Uchinchi gap esa unga shunchaki nom beradi: induced demand.`,
  rw61: `Bir xil usullar bir xil mahalliy kulollarni koʻrsatadi. Uzoqdan keltirilgan loy xomashyo uzoqdan kelganini bildiradi. Birgalikda: mahalliy kulollar olib kelingan loy bilan ishlagan. Yangi koʻchmanchilar yoki tashqi ustaxonalar boshqacha usullarni olib kelgan boʻlardi.`,
  rw62: `Hasharotlarni emas, yoʻllarni sabab deb bilish uchun hasharotlarni istisno qiladigan (ular barqaror) va kamayishni yoʻllar bilan bogʻlaydigan (yoʻllar yaqinida eng keskin) dalil kerak. Birinchi variant ikkalasini ham bajaradi. Ikkinchisi esa aksincha hasharotlarga ishora qiladi.`,
  rw63: `Agar yangi kutubxona boʻlmagan shaharlarda ham roʻyxatdan oʻtish xuddi shunchaki oshgan boʻlsa, oʻsish ortida boshqa narsa turgan boʻlishi ehtimoli bor. Qolgan topilmalar daʼvoga mos keladi.`,
  rw64: `Natijani umumiy omilga emas, dasturga bogʻlash uchun dasturdan oʻtgan guruhdagi oʻzgarishni oʻtmagan guruhdagi oʻzgarish bilan solishtirish kerak. Faqat birinchi variant shu solishtirishni qiladi (2,1 va 0,2 soat). Oxirgi variant esa aslida umumiy omilga ishora qiladi.`,
  rw65: `Katta yoʻl yaqinida ikki narsa farq qilgan (iliqlik va azot), shuning uchun erta gullashni ikkalasidan biri ham tushuntirishi mumkin. Shuning uchun tadqiqotchilar buni faqat haroratga bogʻlay olmaydi. Harorat “no effect” deyish esa haddan oshiqcha.`,
  rw66: `Matn muvaffaqiyatsizlikni, tanqidchilar fikrini, soʻng iqtisodchining himoyasini keltiradi va soʻnggi soʻz iqtisodchida qoladi. Ikkinchi variant faqat tanqidchilar fikri, matn esa tanqidchilar barqaror oʻsish haqida rozi ekanini hech qayerda aytmaydi.`,
  rw67: `U taomni ovoz chiqarib maqtaydi, lekin uni yashirincha tuzatadi. Bu uning taʼmga ahamiyat berishini, ammo xushmuomalalik uchun fikrini ichida saqlashini koʻrsatadi — yaʼni u tactful.`,
  rw68: `Roʻyxat elementlari ichida allaqachon vergul boʻlsa (shahar, shtat), elementlar nuqtali vergul bilan ajratiladi. Boshqa elementlar nuqtali vergul bilan ajratilgan, shuning uchun “Texas;” roʻyxatni bir xil saqlaydi.`,
  rw69: `Qoʻshimcha maʼlumot tire bilan boshlangan, demak tire bilan yopilishi kerak. Vergul yoki nuqtali vergul tire juftini yopa olmaydi, ochiq qoldirish esa gapni grammatik jihatdan notoʻgʻri qiladi.`,
  rw70: `Gap inversiyada: ega kesimdan keyin keladi. Ega — “an instrument and several jars”, u koʻplikda, shuning uchun feʼl “were”. “Artifacts” predlogli birikma ichida, u ega emas.`,
  rw71: `Bu qism qaysi roman nazarda tutilganini aniqlaydi, demak u zarur va vergul olmaydi. “That” zarur ergash gapni boshlaydi. “, which” 1998 dan keyin yopuvchi vergulni talab qilardi.`,
  rw72: `“Chien-Shiung Wu” egasiga asosiy feʼl kerak. Vergullar orasidagi uzun “whose” qismi chalgʻitadi xolos. “Being”, “having been” va “to be” asosiy feʼl emas.`,
  rw73: `“Neither...nor” bilan feʼl yaqinroq turgan ega — “the actors” bilan moslashadi, u koʻplikda. Gap oʻtgan zamonda (“would be cut”), shuning uchun “were”.`,
  rw74: `Bu yerda “However” ikki mustaqil gapni bogʻlaydi, shuning uchun undan oldin nuqtali vergul, keyin vergul kerak. Undan oldin vergul qoʻyilsa, comma splice xatosi chiqadi.`,
  rw75: `Baʼzi shaharlardagi tanazzul boshqa shaharlardagi gullab-yashnayotgan bizneslarga qarama-qarshi qoʻyilgan. Bu qarama-qarshilik.`,
  rw76: `Qamrov uchun maqtovdan keyin aniqlik tanqid qilinadi (“another matter”), shuning uchun bogʻlovchi qarama-qarshilikni bildirishi kerak.`,
  rw77: `Birinchi gap kamchilikni aytadi, ikkinchisi shu kamchilikka qaramay kuchli tomonga oʻtadi. “Still” aynan shu yon berishni bildiradi.`,
  rw78: `Haqiqiy natija kutilgan natija oʻrnini egalladi, buni “Instead” bildiradi. “Accordingly” natija kutilgan narsadan kelib chiqqanini anglatgan boʻlardi.`,
  rw79: `Faqat birinchi variant ikkala tolaga xos umumiy xususiyatni aytadi. Ikki variant farqlarni tasvirlaydi, oxirgisi esa faqat oʻrgimchak ipi haqida.`,
  rw80: `Maqsad ikki qismdan iborat: tadqiqot maqsadini aytish va yangi tinglovchilarga oqarishni tushuntirish. Faqat birinchi variant ikkalasini ham bajaradi. Ikkinchisi maqsadni emas, natijani beradi.`,
  rw81: `Qarama-qarshilik uchun ikkala shakl — ilk va keyingi — bir-biriga qarshi qoʻyilishi kerak. Buni faqat “Whereas” varianti bajaradi.`,
  m45: `Qavslarni oching: 4<i>x</i> − 4<i>a</i> + 2 = 4<i>x</i> − 10. <i>x</i> li hadlar bir xil, shuning uchun cheksiz koʻp yechim boʻlishi uchun −4<i>a</i> + 2 = −10 boʻlishi kerak, bundan <i>a</i> = 3.`,
  m46: `10 = −2<i>k</i> + 4 → <i>k</i> = −3. <i>y</i> = 0 deb oling: 0 = −3<i>x</i> + 4 → <i>x</i> = 4/3. (1,333 ham qabul qilinadi.)`,
  m47: `<i>n</i> + <i>b</i> = 10 va 3<i>n</i> + 7<i>b</i> = 50. <i>n</i> = 10 − <i>b</i> ni qoʻying: 30 + 4<i>b</i> = 50 → <i>b</i> = 5.`,
  m48: `Cheksiz koʻp yechim bir tenglama ikkinchisining karralisi ekanini bildiradi. −5<i>y</i> dan 15<i>y</i> ga oʻtish −3 ga koʻpaytirishdir, 7 × (−3) = −21 ham mos keladi. Demak, <i>a</i> = 2 × (−3) = −6.`,
  m49: `(1, 4) ni tekshiring: 4 &gt; 2(1) − 3 = −1 ✓ va 4 &lt; −1 + 6 = 5 ✓. (4, 4) birinchi tengsizlikni qanoatlantirmaydi (4 &gt; 5 notoʻgʻri), (3, 2) ham (2 &gt; 3), (−1, 8) esa ikkinchisini (8 &lt; 7).`,
  m50: `Bak 8 daqiqada 160 litr, yaʼni daqiqasiga 20 litr yoʻqotadi. 500 ÷ 20 = 25 daqiqa.`,
  m51: `Tenglamalarni qoʻshing: <i>y</i> li hadlar yoʻqoladi va 4<i>x</i> = 12. Avval <i>x</i> ni topish shart emas.`,
  m52: `Berilgan toʻgʻri chiziqning burchak koeffitsiyenti −2/3, demak ℓ niki 3/2. <i>y</i> − 1 = (3/2)(<i>x</i> − 4) → <i>y</i> = 1,5<i>x</i> − 5. <i>y</i> oʻqi bilan kesishish nuqtasi −5.`,
  m53: `$300 000 — bu 300 ming. 12<i>t</i> + 150 &gt; 300 → <i>t</i> &gt; 12,5. Undan keyingi birinchi butun yil <i>t</i> = 13, yaʼni 2015 + 13 = 2028.`,
  m54: `<i>x</i><sup>2</sup> + <i>bx</i> + <i>c</i> uchun yechimlar koʻpaytmasi <i>c</i> = 16 ga teng. Demak, 2 × <i>r</i> = 16 va <i>r</i> = 8. (Unda <i>b</i> = −10.)`,
  m55: `Parabolaning uchi uning nollari oʻrtasida yotadi. Nollar 3 va −5, (3 + (−5)) ÷ 2 = −1.`,
  m56: `−5 = <i>a</i>(4 − 2)<sup>2</sup> + 7 → −5 = 4<i>a</i> + 7 → 4<i>a</i> = −12 → <i>a</i> = −3.`,
  m57: `Ikkala tomonni 3 ning darajasi sifatida yozing: 3<sup>2<i>x</i></sup> = 3<sup>3</sup>, demak 2<i>x</i> = 3 va <i>x</i> = 3/2 (yoki 1,5).`,
  m58: `Koʻpaytuvchilarga ajrating: (<i>x</i> − 2)(<i>x</i> + 2) ÷ (<i>x</i> + 2)<sup>2</sup>. Bitta (<i>x</i> + 2) koʻpaytuvchini qisqartirsangiz (<i>x</i> − 2) ÷ (<i>x</i> + 2) chiqadi. <i>x</i><sup>2</sup> li hadlarni toʻgʻridan-toʻgʻri qisqartirib boʻlmaydi.`,
  m59: `Diskriminant <i>b</i><sup>2</sup> − 4<i>ac</i> = 16 − 40 = −24. Diskriminant manfiy boʻlsa, haqiqiy yechimlar yoʻq.`,
  m60: `1,05 oʻsish koeffitsiyenti har yilgi aholi oldingi yilnikining 105% i ekanini, yaʼni 5% ga oʻsishni bildiradi. “Har yili 60 kishi” chiziqli oʻsishni tasvirlaydi, <i>t</i> = 0 da esa aholi 1 200 kishi.`,
  m61: `Tenglashtiring: <i>x</i><sup>2</sup> − 4<i>x</i> + 7 = 2<i>x</i> − 2 → <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = 0 → (<i>x</i> − 3)<sup>2</sup> = 0, demak <i>x</i> = 3. Toʻgʻri chiziq parabolaga urinma.`,
  m62: `(<i>x</i> − <i>r</i>) aynan <i>p</i>(<i>r</i>) = 0 boʻlganda koʻpaytuvchi boʻladi. <i>p</i>(2) = 8 − 8 − 18 + 18 = 0. Guruhlash buni tasdiqlaydi: <i>x</i><sup>2</sup>(<i>x</i> − 2) − 9(<i>x</i> − 2) = (<i>x</i> − 2)(<i>x</i> − 3)(<i>x</i> + 3).`,
  m63: `1,20 × 0,80 = 0,96, demak oxirgi narx dastlabkining 96% i. Oʻzgarishlar bir-birini yoʻqqa chiqarmaydi, chunki 20% lik kamayish kattaroq summaga qoʻllanadi.`,
  m64: `Dastlabki yigʻindi 10 × 12 = 120. 30 ni olib tashlasak, 9 ta qiymatga 90 qoladi: 90 ÷ 9 = 10.`,
  m65: `Toʻla kvadratlarni ajrating: (<i>x</i><sup>2</sup> − 6<i>x</i> + 9) + (<i>y</i><sup>2</sup> + 8<i>y</i> + 16) = 25, yaʼni (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 25 va radius 5 ga teng.`,
  m66: `120° — bu 360° ning 1/3 qismi. Aylana uzunligi 2π(6) = 12π, uning 1/3 qismi esa 4π.`,
  rw82: `1-matn bosmaxona tufayli tez oʻzgarish boʻlgan deydi. 2-matn “for nearly two centuries” davomida sekin oʻsishni koʻrsatadi va boshqa sabablarni (maktablar, qogʻoz) qoʻshadi. 2-matn bosmaxona hech taʼsir qilmagan demaydi, faqat boshqa omillar ham “at least as much” muhim boʻlganini aytadi.`,
  rw83: `Rejalashtiruvchilar “the same number of cars” koʻproq joyga ega boʻladi deb hisoblaydi. 2-matn bu taxmin notoʻgʻriligini koʻrsatadi: yurish osonlashsa, koʻproq haydovchi jalb qilinadi va tirbandlik qaytadi. 2-matn yoʻl kengligi xatti-harakatni oʻzgartiradi deydi, shuning uchun oxirgi ikki variant unga zid.`,
  m67: `<i>y</i> = 9 ni qoʻying: <i>x</i><sup>2</sup> = 9, demak <i>x</i> = 3 yoki <i>x</i> = −3. Savol musbat qiymatni soʻraydi — 3.`,
  m68: `Oʻng tomonlarni tenglashtiring: <i>x</i><sup>2</sup> + 1 = <i>x</i> + 3 → <i>x</i><sup>2</sup> − <i>x</i> − 2 = 0 → (<i>x</i> − 2)(<i>x</i> + 1) = 0. <i>x</i> qiymatlari 2 va −1, yigʻindisi 1.`,
  m69: `(<i>x</i> − 1)<sup>2</sup> = 4 boʻlsa, <i>x</i> − 1 = 2 yoki <i>x</i> − 1 = −2, demak <i>x</i> = 3 yoki <i>x</i> = −1. Bu ikkita nuqta beradi, (3, 4) va (−1, 4): gorizontal toʻgʻri chiziq parabolani ikki marta kesadi.`,
  m70: `Oʻrniga qoʻying: <i>x</i><sup>2</sup> + (<i>x</i> + 1)<sup>2</sup> = 25 → 2<i>x</i><sup>2</sup> + 2<i>x</i> − 24 = 0 → <i>x</i><sup>2</sup> + <i>x</i> − 12 = 0 → (<i>x</i> + 4)(<i>x</i> − 3) = 0. Musbat yechim <i>a</i> = 3, demak <i>b</i> = 3 + 1 = 4.`,
  m71: `8 stakan shakar — bu 2 stakanning 4 barobari, shuning uchun unni ham 4 ga koʻpaytiring: 3 × 4 = 12 stakan.`,
  m72: `Xaritadagi masofani masshtabga koʻpaytiring: 3,5 × 25 = 87,5 milya.`,
  m73: `Nisbatda 4 + 5 = 9 qism bor, demak bir qism 36 ÷ 9 = 4 oʻquvchi. Qizlar 5 qismni tashkil qiladi: 5 × 4 = 20.`,
  m74: `<i>y</i> qisqarishi uchun nisbatlarni koʻpaytiring: (<i>x</i>/<i>y</i>)(<i>y</i>/<i>z</i>) = <i>x</i>/<i>z</i> = (3/4)(2/5) = 6/20 = 3/10 (yoki 0,3).`,
  m75: `Oʻrtacha tezlik — masofa ÷ vaqt: 150 ÷ 2,5 = soatiga 60 milya.`,
  m76: `Chop etish tezligi 45 ÷ 3 = daqiqasiga 15 sahifa. 240 ÷ 15 = 16 daqiqa.`,
  m77: `Ikkala birlikni ham oʻgiring: soniyasiga 3 fut × futiga 12 dyuym = soniyasiga 36 dyuym, va 36 × daqiqadagi 60 soniya = daqiqasiga 2 160 dyuym.`,
  m78: `27 000 ÷ 2,5 = 10 800 soniya. Bir soatda 3 600 soniya bor, demak 10 800 ÷ 3 600 = 3 soat.`,
  m79: `30% — bu 0,30, va 0,30 × 250 = 75.`,
  m80: `20% chegirmadan keyin dastlabki narxning 80% ini toʻlaysiz: 0,8<i>p</i> = 80, demak <i>p</i> = 100. $80 ga 20% qoʻshsangiz $96 chiqadi — bu koʻp uchraydigan xato.`,
  m81: `Oʻsish 2 000 − 1 600 = 400. Dastlabki qiymatga boʻling: 400 ÷ 1 600 = 0,25, yaʼni 25%.`,
  m82: `Jami 4 + 6 + 10 = 20 ta shar bor, ulardan 6 tasi koʻk. 6/20 = 3/10.`,
  m83: `Faqat cholgʻu chaladigan 80 nafar oʻquvchi hisobga olinadi. Ulardan 45 nafari sport bilan shugʻullanadi: 45/80 = 9/16 (yoki 0,5625). 45/200 boshqa savolga javob boʻlardi.`,
  m84: `3 ga karralilar: 3, 6, 9, 12, 15, 18 (6 ta son). 5 ga karralilar: 5, 10, 15, 20 (4 ta son). 15 ikki marta sanalgan, demak 6 + 4 − 1 = 9 ta son. 9/20 = 0,45.`,
  m85: `Qiymatlarni tartiblang: 3, 4, 7, 9, 12. Oʻrtadagi qiymat 7.`,
  m86: `Dastlabki yigʻindi 5 × 8 = 40. Yangi yigʻindi 6 × 9 = 54. Qoʻshilgan qiymat 54 − 40 = 14.`,
  m87: `<i>x</i> = 6 ni qoʻying: 2,5(6) + 10 = 15 + 10 = 25 santimetr.`,
  m88: `Burchak koeffitsiyenti — <i>x</i> (televizor soatlari) bir birlikka oshganda <i>y</i> (ball) ning oʻzgarishi. U −0,8 ga teng, demak taxminiy ball har bir soatga 0,8 ga kamayadi. 92 — <i>y</i> oʻqi bilan kesishish nuqtasi, yaʼni televizor koʻrmaganda taxminiy ball.`,
  m89: `Har bir qiymat oldingisidan 3 marta katta — bu koeffitsiyenti 3 boʻlgan eksponensial oʻsish. <i>t</i> = 0 dagi boshlangʻich qiymat 5, demak <i>f</i>(<i>t</i>) = 5(3)<sup><i>t</i></sup>. Chiziqli variant faqat dastlabki ikki nuqtaga mos keladi, 5<i>t</i><sup>3</sup> esa <i>t</i> = 0 da 0 beradi.`,
  m90: `Tanlanmada 120 ÷ 400 = 30% bogʻni qoʻllab-quvvatlaydi. Tasodifiy tanlanma bu ulushni butun shaharga qoʻllash imkonini beradi: 0,30 × 20 000 = 6 000.`,
  m91: `Xatolik chegarasi 54 − 3 = 51% dan 54 + 3 = 57% gacha boʻlgan ehtimolga yaqin oraliqni beradi. Bu oraliqqa faqat 52% tushadi.`,
  m92: `Kattaroq tasodifiy tanlanmalar aniqroq baho beradi, shuning uchun tanlanma hajmi oshgani sari xatolik chegarasi kichrayadi. B tanlanma kattaroq, demak uning xatolik chegarasi kichikroq boʻlishi ehtimoli yuqori.`,
  m93: `Guruhlarga tasodifiy taqsimlash sabab-natija haqida xulosa chiqarish imkonini beradi. Biroq koʻngillilar barcha kattalardan olingan tasodifiy tanlanma emas edi, shuning uchun natija hammaga emas, faqat ularga oʻxshash odamlarga tegishli.`,
  m94: `Tasodifiy tanlanma natijani shahardagi kattalarga umumlashtirish imkonini beradi. Biroq soʻrovda odamlar faqat kuzatilgan: hech kimga it boqish belgilanmagan. Shuning uchun u sababni emas, faqat bogʻliqlikni koʻrsatadi — hech bir yoʻnalishda sabab emas.`,
  m95: `Faqat barcha oʻquvchilardan olingan tasodifiy tanlanma har bir oʻquvchiga tanlanish uchun bir xil imkon beradi. Kutubxonadagi yoki matematika jamoasidagi oʻquvchilar, ehtimol, oʻrtachadan koʻproq uy vazifasi qiladi, erta keladiganlar ham boshqalardan farq qilishi mumkin.`,
  m96: `Ikki kesishuvchi toʻgʻri chiziq hosil qilgan qoʻshni burchaklar bir toʻgʻri chiziqda yotadi, shuning uchun ularning yigʻindisi 180°: 180 − 65 = 115.`,
  m97: `Parallel toʻgʻri chiziqlardagi bir tomonli ichki burchaklar yigʻindisi 180°: (3<i>x</i> + 10) + (2<i>x</i> + 20) = 180 → 5<i>x</i> + 30 = 180 → <i>x</i> = 30.`,
  m98: `Burchaklar yigʻindisi 180°, u har biri 20° dan boʻlgan 2 + 3 + 4 = 9 qismga boʻlinadi. Eng katta burchak 4 × 20 = 80°.`,
  m99: `Har bir tashqi burchak 180 − 150 = 30°. Har qanday koʻpburchakning tashqi burchaklari yigʻindisi 360°, demak tomonlar soni 360 ÷ 30 = 12.`,
  m100: `Pifagor teoremasiga koʻra 6<sup>2</sup> + 8<sup>2</sup> = 36 + 64 = 100, va √100 = 10.`,
  m101: `Narvon — gipotenuza: 5<sup>2</sup> + <i>h</i><sup>2</sup> = 13<sup>2</sup> → 25 + <i>h</i><sup>2</sup> = 169 → <i>h</i><sup>2</sup> = 144 → <i>h</i> = 12.`,
  m102: `Burchaklari 45°-45°-90° boʻlgan uchburchakda gipotenuza katetning √2 barobariga teng, demak har bir katet 8. Yuza (1/2)(8)(8) = 32.`,
  m103: `Burchaklari 30°-60°-90° boʻlgan uchburchak tomonlari 1 : √3 : 2 nisbatda, yaʼni 5, 5√3 va 10. Perimetr 5 + 10 + 5√3 = 15 + 5√3.`,
  m104: `Sinus — qarshi katetning gipotenuzaga nisbati. <i>A</i> burchak qarshisidagi tomon <i>BC</i> = 4, gipotenuza <i>AB</i> = 5, demak sin <i>A</i> = 4/5.`,
  m105: `Burchakning sinusi uni 90° gacha toʻldiruvchi burchakning kosinusiga teng: sin(<i>x</i>°) = cos(90° − <i>x</i>°). Demak, 90 − <i>x</i> = 40 va <i>x</i> = 50.`,
  m106: `Tangens — qarshi katetning yopishgan katetga nisbati, demak katetlar 5 va 12. Gipotenuza √(25 + 144) = 13. Kosinus — yopishgan katetning gipotenuzaga nisbati: 12/13 (taxminan 0,923).`,
  m107: `sin <i>A</i> = <i>BC</i>/<i>AB</i>, demak <i>BC</i> = 0,6 × 20 = 12. Unda <i>AC</i><sup>2</sup> + 12<sup>2</sup> = 20<sup>2</sup> → <i>AC</i><sup>2</sup> = 256 → <i>AC</i> = 16.`,
  m108: `Oʻxshashlik koeffitsiyenti 9 ÷ 3 = 3. Eng katta tomon 5 × 3 = 15.`,
  m109: `Quyosh nurlari oʻxshash uchburchaklar hosil qiladi, shuning uchun balandlik soya uzunligiga proporsional: 6/4 = <i>h</i>/30 → <i>h</i> = 30 × 1,5 = 45 fut.`,
  m110: `<i>DE</i> ∥ <i>BC</i> boʻlgani uchun <i>ADE</i> uchburchak <i>ABC</i> uchburchakka oʻxshash. <i>AB</i> = 4 + 6 = 10, demak nisbat <i>AD</i>/<i>AB</i> = 4/10. Unda 5/<i>BC</i> = 4/10 → <i>BC</i> = 12,5. Koʻp uchraydigan xato — 4/10 oʻrniga 4/6 ni olish.`,
  m111: `Yuzalar tomonlar nisbatining kvadrati boʻyicha oʻzgaradi: (5/2)<sup>2</sup> = 25/4. Demak, katta uchburchakning yuzi 12 × 25/4 = 75.`,
  m112: `Hajm = uzunlik × eni × balandlik = 5 × 4 × 3 = 60 kub dyuym.`,
  m113: `Silindr hajmi π<i>r</i><sup>2</sup><i>h</i> = π(3)<sup>2</sup>(10) = 90π.`,
  m114: `Kubning 6 ta bir xil kvadrat yoqi bor, demak har bir yoqning yuzi 150 ÷ 6 = 25, qirrasi esa 5. Hajm 5<sup>3</sup> = 125.`,
  m115: `π<i>r</i><sup>2</sup> = 49π, demak <i>r</i> = 7. Aylana uzunligi 2π<i>r</i> = 14π.`,
  m116: `Radius — (2, −3) dan (5, 1) gacha boʻlgan masofa: √(3<sup>2</sup> + 4<sup>2</sup>) = 5, demak <i>r</i><sup>2</sup> = 25. Markaz (<i>h</i>, <i>k</i>) = (2, −3) boʻlganda tenglama (<i>x</i> − 2)<sup>2</sup> + (<i>y</i> + 3)<sup>2</sup> = 25. Oʻng tomonda <i>r</i> emas, <i>r</i><sup>2</sup> turadi.`,
  rw84: `Daʼvo fevraldan aprelgacha boʻlgan davrni qamraydi, shuning uchun dalil har bir oyda oʻsishni koʻrsatishi kerak. Faqat birinchi variant uchala qiymatni oʻsish tartibida beradi. Boshqa variantlar daʼvoga kirmaydigan yanvar haqida.`,
  m117: `Ikkala tomonga 5 ni qoʻshing: 3<i>x</i> &gt; 15, demak <i>x</i> &gt; 5. 5 dan katta faqat 6. 5 ning oʻzi ikkala tomonni tenglashtiradi, shuning uchun qatʼiy tengsizlikni qanoatlantirmaydi.`,
  m118: `Burchak koeffitsiyenti (20 − 11) ÷ (5 − 2) = 3. <i>x</i> = 2 dan <i>x</i> = 0 ga qaytilganda qiymat 2 × 3 = 6 ga kamayadi, demak <i>f</i>(0) = 11 − 6 = 5.`,
  m119: `Qavslarni oching: 3<i>x</i> + 12 = 5<i>x</i> − 6. 3<i>x</i> ni ayiring va 6 ni qoʻshing: 18 = 2<i>x</i>, demak <i>x</i> = 9.`,
  m120: `Safarlar 10 − 4 = 6 milyaga farq qiladi, har bir milya taxminiy narxga $2,10 qoʻshadi: 6 × 2,1 = 12,6. 3,5 ikkala safar uchun bir xil, shuning uchun u qisqaradi.`,
  m121: `Parabolaning uchi <i>t</i> = −<i>b</i> ÷ 2<i>a</i> = −20 ÷ (−10) = 2 da. Unda <i>h</i>(2) = −5(4) + 20(2) + 1 = −20 + 40 + 1 = 21 metr.`,
  m122: `Tanlanmada qutilarning 3 ÷ 50 = 6% i shikastlangan. Bu ulushni butun kunga qoʻllaymiz: 0,06 × 4 000 = 240 ta quti.`,
  m123: `Xatolik chegarasi tanlanma olingan butun bosh toʻplamning oʻrtacha qiymati uchun ehtimolga yaqin oraliqni beradi: 6,8 ± 0,3, yaʼni 6,5 dan 7,1 soatgacha. U alohida talabalar haqida hech narsa demaydi, tanlanma esa barcha universitetlardan emas, faqat X universitetidan olingan.`,
  m124: `Sayt soʻrovnomasiga oʻz xohishi bilan javob berganlar — oʻzini oʻzi tanlagan tanlanma, ularning fikri boshqa mijozlarnikidan kuchliroq boʻlishi mumkin. 2 000 — katta tanlanma, demak muammo hajmda emas, balki qanday tanlanganida.`,
  m125: `Oʻgʻitning tasodifiy belgilanishi sabab-natija xulosasini qoʻllab-quvvatlaydi, demak bu shunchaki bogʻliqlikdan koʻproq. Fermer xoʻjaliklari hududdan tasodifiy tanlangani uchun xulosa shu hududga tegishli, lekin dunyodagi barcha xoʻjaliklarga emas.`
};

// LANG: 'en' | 'ru' | 'uz' = page language (Uzbek in Latin script);
// 'mix' / 'mixuz' = English page with Russian / Uzbek explanations.
// Questions and passages stay in English in every mode: the SAT itself is in English.
const LKEY = 'scorebound-lang';
let LANG = 'en';
try { const v = localStorage.getItem(LKEY); if (['en', 'ru', 'uz', 'mix', 'mixuz'].includes(v)) LANG = v; } catch (e) {}
const uiL = () => LANG === 'ru' || LANG === 'uz' ? LANG : 'en';
const EXKEY = 'scorebound-exlang';
let exPref = null;   // 'en' | 'ru' | 'uz' chosen inside an explanation; null = follow the language menu
try { const v = localStorage.getItem(EXKEY); if (['en', 'ru', 'uz'].includes(v)) exPref = v; } catch (e) {}
const EX_DEFAULT = { en: 'en', ru: 'ru', uz: 'uz', mix: 'ru', mixuz: 'uz' };
const exL = () => exPref || EX_DEFAULT[LANG];
const ruPl = (n, f) => { const a = n % 10, b = n % 100; return f[(a === 1 && b !== 11) ? 0 : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 1 : 2]; };

const Q_RU = {
  m1: `Если 3<i>x</i> − 7 = 11, чему равно <i>x</i>?`,
  m2: `Спортзал берёт единоразовый вступительный взнос $40 и $25 в месяц. Какая функция задаёт общую стоимость <i>C</i> (в долларах) абонемента на <i>m</i> месяцев?`,

  m4: `Прямая на плоскости <i>xy</i> проходит через точки (2, 5) и (6, 13). Чему равен угловой коэффициент прямой?`,

  m7: `Колония из 500 бактерий удваивается каждые 3 часа. Какое выражение задаёт число бактерий через <i>t</i> часов?`,
  m8: `Какое выражение равносильно (<i>x</i> + 3)<sup>2</sup>?`,
  m9: `Если 2<sup><i>x</i> + 1</sup> = 32, чему равно <i>x</i>?`,

  m11: `Куртка обычной стоимостью $80 продаётся со скидкой 25%. К цене со скидкой добавляется налог с продаж 8%. Сколько всего стоит куртка?`,
  m12: `В мешке 6 красных, 4 синих и 10 зелёных шариков. Какова вероятность, что случайно вытянутый шарик окажется синим?`,
  m13: `Катеты прямоугольного треугольника равны 6 и 8. Чему равна гипотенуза?`,

  m15: `В прямоугольном треугольнике <i>ABC</i> угол <i>C</i> прямой и sin <i>A</i> = 3/5. Чему равен cos <i>A</i>?`,
  m16: `Длина окружности равна 10π. Чему равна площадь круга?`,
  m17: `Если 5(<i>x</i> − 2) = 3<i>x</i> + 4, чему равно <i>x</i>?`,
  m18: `В какой точке график <i>y</i> = −3<i>x</i> + 6 пересекает ось <i>y</i>?`,
  m19: `Какое уравнение задаёт прямую, параллельную прямой <i>y</i> = 4<i>x</i> − 1?`,
  m20: `Грузовик может перевезти не более 2 000 фунтов. В нём уже 600 фунтов оборудования, а каждая коробка весит 35 фунтов. Какое неравенство описывает число коробок <i>b</i>, которые может взять грузовик?`,
  m21: `Грузовик может перевезти не более 2 000 фунтов. В нём уже 600 фунтов оборудования, а каждая коробка весит 35 фунтов. Какое наибольшее число коробок может взять грузовик?`,
  m22: `2<i>x</i> + 3<i>y</i> = 12<br><i>y</i> = <i>x</i> − 1<br><br>Если (<i>x</i>, <i>y</i>) — решение системы выше, чему равно <i>y</i>?`,
  m23: `3<i>x</i> + <i>ky</i> = 8<br>6<i>x</i> + 4<i>y</i> = 5<br><br>В системе выше <i>k</i> — константа. Если у системы нет решений, чему равно <i>k</i>?`,
  m24: `Театр продаёт взрослые билеты по $12 и детские по $8. За один вечер продано 50 билетов на общую сумму $520. Сколько продано взрослых билетов?`,

  m26: `Уравнение <i>C</i> = 15<i>h</i> + 50 задаёт стоимость <i>C</i> (в долларах) вызова сантехника продолжительностью <i>h</i> часов. Как лучше всего понимать число 15 в этом контексте?`,
  m27: `Какое из чисел является решением уравнения |<i>x</i> − 4| = 9?`,
  m28: `Какое выражение равносильно <i>x</i><sup>2</sup> − 9?`,
  m29: `Какова вершина графика <i>y</i> = (<i>x</i> − 2)<sup>2</sup> + 5 на плоскости <i>xy</i>?`,
  m30: `Чему равно положительное решение уравнения <i>x</i><sup>2</sup> = 4<i>x</i> + 12?`,
  m31: `Функция <i>f</i> задана формулой <i>f</i>(<i>x</i>) = 3<sup><i>x</i></sup>. Чему равно <i>f</i>(4)?`,
  m32: `Функции <i>g</i> и <i>h</i> заданы формулами <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 1 и <i>h</i>(<i>x</i>) = 2<i>x</i> − 3. Чему равно <i>g</i>(<i>h</i>(2))?`,
  m33: `Автомобиль стоимостью $24 000 каждый год теряет 15% стоимости. Какая функция задаёт стоимость автомобиля <i>V</i> (в долларах) через <i>t</i> лет?`,
  m34: `Какое выражение равносильно (2<i>x</i><sup>2</sup> + 3<i>x</i>) − (<i>x</i><sup>2</sup> − 5<i>x</i> + 4)?`,
  m35: `Какое выражение при <i>x</i> ≠ 0 равносильно (<i>x</i><sup>2</sup> + 6<i>x</i>) ÷ <i>x</i>?`,
  m36: `При каком значении константы <i>c</i> уравнение <i>x</i><sup>2</sup> + 6<i>x</i> + <i>c</i> = 0 имеет ровно одно действительное решение?`,
  m37: `Если √(<i>x</i> + 3) = 5, чему равно <i>x</i>?`,
  m38: `Принтер печатает 18 страниц за 45 секунд. Сколько страниц он напечатает за 5 минут с той же скоростью?`,
  m39: `Чему равна медиана набора данных 3, 7, 7, 9, 12, 15?`,
  m40: `В опросе 140 учеников 11-х и 12-х классов спросили, что они предпочитают: спорт или искусство. Результаты приведены ниже.<div class="tablescroll"><table><thead><tr><th></th><th>Спорт</th><th>Искусство</th><th>Всего</th></tr></thead><tbody><tr><td>11 класс</td><td>40</td><td>20</td><td>60</td></tr><tr><td>12 класс</td><td>30</td><td>50</td><td>80</td></tr></tbody></table></div>Какова вероятность, что случайно выбранный из участников опроса ученик 12-го класса предпочитает искусство?`,
  m41: `В рецепте на каждые 3 стакана муки приходится 2 стакана сахара. Сколько стаканов сахара нужно, если пекарь берёт 12 стаканов муки?`,
  m42: `Два угла в сумме дают 180°. Один из них в 4 раза больше другого. Чему равна градусная мера меньшего угла?`,
  m43: `Радиус прямого кругового цилиндра равен 3, высота — 10. Чему равен его объём?`,

  m45: `В уравнении 4(<i>x</i> − <i>a</i>) + 2 = 4<i>x</i> − 10 число <i>a</i> — константа. Если у уравнения бесконечно много решений, чему равно <i>a</i>?`,
  m46: `Прямая <i>y</i> = <i>kx</i> + 4, где <i>k</i> — константа, проходит через точку (−2, 10). Чему равна абсцисса точки пересечения этой прямой с осью <i>x</i>?`,
  m47: `Тетрадь стоит $3, папка — $7. Мия купила 10 предметов и потратила ровно $50. Сколько папок она купила?`,
  m48: `2<i>x</i> − 5<i>y</i> = 7<br><i>ax</i> + 15<i>y</i> = −21<br><br>В системе выше <i>a</i> — константа. Если у системы бесконечно много решений, чему равно <i>a</i>?`,
  m49: `Какая точка (<i>x</i>, <i>y</i>) является решением системы неравенств <i>y</i> &gt; 2<i>x</i> − 3 и <i>y</i> &lt; −<i>x</i> + 6?`,
  m50: `В баке 500 литров воды, и вода вытекает с постоянной скоростью. Через 8 минут в баке осталось 340 литров. Через сколько минут после начала бак опустеет?`,
  m51: `3<i>x</i> + 2<i>y</i> = 11<br><i>x</i> − 2<i>y</i> = 1<br><br>Если (<i>x</i>, <i>y</i>) удовлетворяет системе выше, чему равно 4<i>x</i>?`,
  m52: `Прямая ℓ перпендикулярна прямой 2<i>x</i> + 3<i>y</i> = 6 и проходит через точку (4, 1). Чему равна ордината точки пересечения прямой ℓ с осью <i>y</i>?`,
  m53: `Годовая выручка компании <i>R</i> (в тысячах долларов) описывается моделью <i>R</i> = 12<i>t</i> + 150, где <i>t</i> — число лет после 2015 года. Согласно модели, в каком году выручка впервые превысит $300 000?`,
  m54: `Уравнение <i>x</i><sup>2</sup> + <i>bx</i> + 16 = 0, где <i>b</i> — константа, имеет решение 2. Чему равно другое решение?`,
  m55: `Функция <i>f</i> задана формулой <i>f</i>(<i>x</i>) = (<i>x</i> − 3)(<i>x</i> + 5). При каком значении <i>x</i> функция <i>f</i>(<i>x</i>) достигает минимума?`,
  m56: `График функции <i>g</i>(<i>x</i>) = <i>a</i>(<i>x</i> − 2)<sup>2</sup> + 7, где <i>a</i> — константа, проходит через точку (4, −5). Чему равно <i>a</i>?`,
  m57: `Если 9<sup><i>x</i></sup> = 27, чему равно <i>x</i>?`,
  m58: `Какое выражение равносильно (<i>x</i><sup>2</sup> − 4) ÷ (<i>x</i><sup>2</sup> + 4<i>x</i> + 4) при <i>x</i> ≠ −2?`,
  m59: `Сколько действительных решений у уравнения 2<i>x</i><sup>2</sup> − 4<i>x</i> + 5 = 0?`,
  m60: `Функция <i>P</i>(<i>t</i>) = 1 200(1,05)<sup><i>t</i></sup> описывает население города через <i>t</i> лет после 2020 года. Какое утверждение верно согласно модели?`,
  m61: `<i>y</i> = <i>x</i><sup>2</sup> − 4<i>x</i> + 7<br><i>y</i> = 2<i>x</i> − 2<br><br>Если (<i>x</i>, <i>y</i>) — решение системы выше, чему равно <i>x</i>?`,
  m62: `Многочлен <i>p</i> задан формулой <i>p</i>(<i>x</i>) = <i>x</i><sup>3</sup> − 2<i>x</i><sup>2</sup> − 9<i>x</i> + 18. Какое из выражений является множителем <i>p</i>(<i>x</i>)?`,
  m63: `Цену велосипеда повысили на 20%, а затем новую цену снизили на 20%. Сколько процентов от исходной цены составляет итоговая цена?`,
  m64: `Среднее арифметическое набора из 10 значений равно 12. Из набора убрали значение 30. Чему равно среднее оставшихся значений?`,
  m65: `На плоскости <i>xy</i> график уравнения <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> − 6<i>x</i> + 8<i>y</i> = 0 — окружность. Чему равен её радиус?`,
  m66: `Радиус окружности равен 6. Чему равна длина дуги с центральным углом 120°?`,
  m67: `<i>y</i> = <i>x</i><sup>2</sup><br><i>y</i> = 9<br><br>Если (<i>x</i>, <i>y</i>) — решение системы выше и <i>x</i> &gt; 0, чему равно <i>x</i>?`,
  m68: `<i>y</i> = <i>x</i><sup>2</sup> + 1<br><i>y</i> = <i>x</i> + 3<br><br>Система выше имеет два решения. Чему равна сумма координат <i>x</i> этих решений?`,
  m69: `<i>y</i> = (<i>x</i> − 1)<sup>2</sup><br><i>y</i> = 4<br><br>Сколько решений имеет система выше?`,
  m70: `<i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> = 25<br><i>y</i> = <i>x</i> + 1<br><br>Если (<i>a</i>, <i>b</i>) — решение системы выше и <i>a</i> &gt; 0, чему равно <i>b</i>?`,
  m71: `В рецепте на каждые 2 стакана сахара приходится 3 стакана муки. Сколько стаканов муки нужно, если взять 8 стаканов сахара?`,
  m72: `На карте 1 дюйм соответствует 25 милям. Расстояние между двумя городами на карте — 3,5 дюйма. Каково настоящее расстояние между городами в милях?`,
  m73: `В классе 36 учеников, мальчиков и девочек в нём в отношении 4 к 5. Сколько в классе девочек?`,
  m74: `Если <i>x</i>/<i>y</i> = 3/4 и <i>y</i>/<i>z</i> = 2/5, чему равно <i>x</i>/<i>z</i>?`,
  m75: `Автомобиль проезжает 150 миль за 2,5 часа. Какова его средняя скорость в милях в час?`,
  m76: `Принтер печатает 45 страниц за 3 минуты. За сколько минут он напечатает 240 страниц с той же скоростью?`,
  m77: `Предмет движется с постоянной скоростью 3 фута в секунду. Чему равна эта скорость в дюймах в минуту? (1 фут = 12 дюймов)`,
  m78: `Вода поступает в пустой бак с постоянной скоростью 2,5 литра в секунду. Вместимость бака — 27 000 литров. За сколько часов бак наполнится?`,
  m79: `Чему равны 30% от 250?`,
  m80: `После скидки 20% куртка стоит $80. Какой была исходная цена куртки в долларах?`,
  m81: `Население города выросло с 1 600 до 2 000 человек. На сколько процентов выросло население?`,
  m82: `В мешке 4 красных, 6 синих и 10 зелёных шариков. Какова вероятность, что случайно вынутый шарик окажется синим?`,
  m83: `<div class="tablescroll"><table><caption>Опрос 200 учеников</caption>
