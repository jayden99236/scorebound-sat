<body>
<main id="app"></main>

<script>
const SECTIONS = {
  rw:   { name: 'Reading and Writing', short: 'R&W', perQ: 71,
          doms: ['Craft and Structure', 'Information and Ideas', 'Standard English Conventions', 'Expression of Ideas'] },
  math: { name: 'Math', short: 'Math', perQ: 95,
          doms: ['Algebra', 'Advanced Math', 'Problem-Solving and Data Analysis', 'Geometry and Trigonometry'] }
};
const WIC = 'Which choice completes the text with the most logical and precise word or phrase?';
const CONV = 'Which choice completes the text so that it conforms to the conventions of Standard English?';
const LOGIC = 'Which choice most logically completes the text?';
const TRANS = 'Which choice completes the text with the most logical transition?';
const B = '<span class="blank" aria-label="blank"></span>';

const BANK = [
  // ---------- Reading and Writing ----------
  { id: 'rw1', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>The architect's early sketches for the plaza were deliberately ${B}: rather than committing to a single design, she left room for the city's planners and residents to reshape the space.</p>`,
    q: WIC, ch: ['provisional', 'ornate', 'derivative', 'meticulous'], a: 0,
    ex: 'The colon signals that what follows explains the blank. Sketches that avoid "committing to a single design" and leave room for change are provisional, meaning temporary or open to revision.' },
  { id: 'rw2', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>Although the novelist was famously ${B} in interviews, offering only brief and guarded answers, her letters reveal a writer eager to discuss her craft at length.</p>`,
    q: WIC, ch: ['candid', 'reticent', 'verbose', 'hostile'], a: 1,
    ex: '"Although" sets up a contrast with letters where she discusses her craft "at length." Giving "brief and guarded answers" means she was reticent: reserved and unwilling to say much.' },
  { id: 'rw3', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>The committee's report was praised for its ${B}: in only four pages, it addressed every concern that residents had raised at the public hearings.</p>`,
    q: WIC, ch: ['concision', 'ambiguity', 'redundancy', 'whimsy'], a: 0,
    ex: 'Covering every concern in only four pages shows concision, the quality of saying a lot in few words. Redundancy is the opposite.' },
  { id: 'rw4', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose',
    passage: `<p>Tardigrades, microscopic animals often called water bears, can survive near-total dehydration. When their surroundings dry out, they retract their legs and curl into a state called a tun, in which their metabolism drops to less than 0.01 percent of its normal rate. Researchers have revived tardigrades from this state after years of dormancy.</p>`,
    q: 'Which choice best describes the function of the second sentence in the overall structure of the text?',
    ch: ['It explains how tardigrades survive the condition described in the first sentence.',
         'It challenges a common assumption about how tardigrades respond to drying out.',
         'It presents an exception to the claim made in the first sentence.',
         'It describes the method researchers used to revive dormant tardigrades.'], a: 0,
    ex: 'Sentence one states that tardigrades survive dehydration. Sentence two describes the mechanism (curling into a tun and slowing metabolism). It does not challenge anything, and the revival is described in sentence three.' },
  { id: 'rw5', sec: 'rw', dom: 'Information and Ideas', skill: 'Central Ideas and Details',
    passage: `<p>Many cities have relaxed their rules on rooftop beehives, and the number of urban hives has grown quickly. However, ecologists caution that honeybees compete with wild bees for nectar and pollen from the same flowers. In neighborhoods where flowering plants are scarce, adding more hives may reduce the food available to native bee species.</p>`,
    q: 'Which choice best states the main idea of the text?',
    ch: ['Urban beekeeping may harm native bees in places where flowers are limited.',
         'Cities should ban rooftop beehives to protect wild bee populations.',
         'Honeybees produce more honey in cities than in rural areas.',
         'Native bees prefer different flowers than honeybees do.'], a: 0,
    ex: 'The text moves from the growth of urban hives to a caution: competition for flowers can hurt native bees where flowers are scarce. The text never calls for a ban, and it never compares which flowers each kind of bee prefers.' },
  { id: 'rw6', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Quantitative)',
    passage: `<div class="tablescroll"><table><caption>Apple harvest at Hollins Orchard</caption>
      <thead><tr><th>Year</th><th>Harvest (tons)</th></tr></thead>
      <tbody><tr><td>2017</td><td class="n">42</td></tr><tr><td>2018</td><td class="n">51</td></tr><tr><td>2019</td><td class="n">47</td></tr><tr><td>2020</td><td class="n">55</td></tr></tbody></table></div>
      <p>A student is writing about Hollins Orchard. She notes that the orchard's apple harvest generally increased from 2017 to 2020, though it ${B}</p>`,
    q: 'Which choice most effectively uses data from the table to complete the statement?',
    ch: ['dipped from 51 tons in 2018 to 47 tons in 2019.', 'peaked at 47 tons in 2019.',
         'fell every year after 2017.', 'was lowest in 2020, at 55 tons.'], a: 0,
    ex: 'The harvest rose overall (42 to 55), with one decrease from 2018 (51) to 2019 (47). The other choices misread the table: the peak was 55 in 2020, and 2020 was the highest year, not the lowest.' },
  { id: 'rw7', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences',
    passage: `<p>Seed banks preserve plant species by drying seeds and storing them at very low temperatures so they can be planted decades later. But some seeds, including those of avocado and cacao, die when they are dried and frozen. As a result, ${B}</p>`,
    q: LOGIC,
    ch: ['seed banks cannot preserve these species using their standard storage methods.',
         'avocado and cacao are not at risk of disappearing.',
         'most seed banks store only crops grown for food.',
         'freezing improves the germination rate of most seeds.'], a: 0,
    ex: 'Standard storage means drying and freezing. If avocado and cacao seeds die under those conditions, standard methods cannot preserve them. Nothing in the text supports the other choices.' },
  { id: 'rw8', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences',
    passage: `<p>Historians long believed that the coastal town of Marren was founded by fishermen, pointing to its natural harbor as evidence. Recent excavations of the settlement's oldest layers, however, uncovered plows and grain-grinding stones but no nets, hooks, or boat remains. These findings suggest that ${B}</p>`,
    q: LOGIC,
    ch: ['Marren\'s earliest residents may have relied on farming rather than fishing.',
         'the harbor at Marren was built before the town was settled.',
         'fishermen never lived in Marren at any point in its history.',
         'the plows and grinding stones were imported from inland towns.'], a: 0,
    ex: 'The oldest layers show farming tools and no fishing gear, which points to farming as the early way of life. Saying fishermen "never" lived there goes too far, since the dig covered only the oldest layers.' },
  { id: 'rw9', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries',
    passage: `<p>The museum's newest exhibit features more than 200 hand-drawn ${B} the oldest dates to the fourteenth century.</p>`,
    q: CONV, ch: ['maps, the oldest', 'maps; the oldest', 'maps the oldest', 'maps, which the oldest'], a: 1,
    ex: 'Both parts are independent clauses. A semicolon can join them. A comma alone creates a comma splice, no punctuation creates a run-on, and "which the oldest" is ungrammatical.' },
  { id: 'rw10', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>The collection of letters written by the expedition's crew members ${B} held at a university archive in Oslo.</p>`,
    q: CONV, ch: ['are', 'were', 'is', 'have been'], a: 2,
    ex: 'The subject is "collection," which is singular. "Of letters written by the expedition\'s crew members" is a prepositional phrase that does not change the subject, so the verb is "is."' },
  { id: 'rw11', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>Both ${B} proposals for the new library emphasized natural light and open reading rooms.</p>`,
    q: CONV, ch: ['architects', 'architect\'s', 'architects\'', 'architects\'s'], a: 2,
    ex: '"Both" tells you there are two architects, and the proposals belong to them, so you need the plural possessive: architects\'.' },
  { id: 'rw12', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries',
    passage: `<p>Ada ${B} wrote what many historians consider the first published computer program.</p>`,
    q: CONV,
    ch: ['Lovelace, a nineteenth-century mathematician,', 'Lovelace a nineteenth-century mathematician,',
         'Lovelace, a nineteenth-century mathematician', 'Lovelace; a nineteenth-century mathematician'], a: 0,
    ex: '"A nineteenth-century mathematician" is a nonessential appositive. It needs a comma on both sides. The other choices drop a comma or use a semicolon, which cannot separate a subject from its verb.' },
  { id: 'rw13', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>Early refrigerators used toxic gases such as ammonia and sulfur dioxide as coolants. ${B} a leak could be deadly, which pushed engineers to search for safer alternatives.</p>`,
    q: TRANS, ch: ['Consequently,', 'Nevertheless,', 'For example,', 'In contrast,'], a: 0,
    ex: 'Deadly leaks are a result of using toxic coolants, so a cause-and-effect transition fits: "Consequently."' },
  { id: 'rw14', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>The first trial of the new fertilizer showed no measurable effect on corn yield. ${B} a second trial, conducted on richer soil, produced a 12 percent increase.</p>`,
    q: TRANS, ch: ['Similarly,', 'However,', 'Therefore,', 'In addition,'], a: 1,
    ex: 'The second result (a 12 percent increase) contrasts with the first (no effect). "However" signals that contrast.' },
  { id: 'rw15', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>The Great Barrier Reef is the world's largest coral reef system.</li>
      <li>It stretches about 2,300 kilometers.</li>
      <li>It is located off the coast of Queensland, Australia.</li>
      <li>It is home to more than 1,500 species of fish.</li></ul>`,
    q: 'The student wants to emphasize the size of the Great Barrier Reef. Which choice most effectively uses relevant information from the notes to accomplish this goal?',
    ch: ['Stretching about 2,300 kilometers, the Great Barrier Reef is the world\'s largest coral reef system.',
         'The Great Barrier Reef is located off the coast of Queensland, Australia.',
         'More than 1,500 species of fish live on the Great Barrier Reef.',
         'Queensland, Australia, is home to a coral reef system called the Great Barrier Reef.'], a: 0,
    ex: 'Only the "Stretching about 2,300 kilometers" choice mentions size, using both the length (2,300 km) and the "world\'s largest" fact. The others focus on location or biodiversity.' },

  // ---------- Math ----------
  { id: 'm1', sec: 'math', dom: 'Algebra', skill: 'Linear equations in one variable',
    q: 'If 3<i>x</i> − 7 = 11, what is the value of <i>x</i>?', ch: ['4/3', '4', '6', '18'], a: 2,
    ex: 'Add 7 to both sides: 3<i>x</i> = 18. Divide by 3: <i>x</i> = 6.' },
  { id: 'm2', sec: 'math', dom: 'Algebra', skill: 'Linear functions',
    q: 'A gym charges a one-time sign-up fee of $40 plus $25 per month. Which function gives the total cost <i>C</i>, in dollars, of a membership for <i>m</i> months?',
    ch: ['<i>C</i> = 40<i>m</i> + 25', '<i>C</i> = 25<i>m</i> + 40', '<i>C</i> = 65<i>m</i>', '<i>C</i> = 25(<i>m</i> + 40)'], a: 1,
    ex: 'The monthly charge multiplies by <i>m</i> (25<i>m</i>), and the fee is added once (+40).' },
  { id: 'm3', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations',
    q: '<i>x</i> + <i>y</i> = 10<br><i>x</i> − <i>y</i> = 4<br><br>If (<i>x</i>, <i>y</i>) is the solution to the system of equations above, what is the value of <i>x</i>?',
    spr: 7, ex: 'Add the equations: 2<i>x</i> = 14, so <i>x</i> = 7. (Then <i>y</i> = 3.)' },
  { id: 'm4', sec: 'math', dom: 'Algebra', skill: 'Linear equations in two variables',
    q: 'A line in the <i>xy</i>-plane passes through the points (2, 5) and (6, 13). What is the slope of the line?',
    spr: 2, ex: 'Slope = (13 − 5) ÷ (6 − 2) = 8 ÷ 4 = 2.' },
  { id: 'm5', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'What is the sum of the solutions to <i>x</i><sup>2</sup> − 5<i>x</i> + 6 = 0?', ch: ['−5', '1', '5', '6'], a: 2,
    ex: 'Factor: (<i>x</i> − 2)(<i>x</i> − 3) = 0, so <i>x</i> = 2 or 3. The sum is 5. (Shortcut: for <i>x</i><sup>2</sup> + <i>bx</i> + <i>c</i>, the sum of the roots is −<i>b</i>.)' },
  { id: 'm6', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> − 3. What is the value of <i>f</i>(−2)?', ch: ['−11', '−5', '5', '11'], a: 2,
    ex: '(−2)<sup>2</sup> = 4, so <i>f</i>(−2) = 2(4) − 3 = 5. A common mistake is squaring after multiplying, which gives −11.' },
  { id: 'm7', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'A colony of 500 bacteria doubles in size every 3 hours. Which expression gives the number of bacteria after <i>t</i> hours?',
    ch: ['500(2)<sup><i>t</i>/3</sup>', '500(2)<sup>3<i>t</i></sup>', '500(3)<sup><i>t</i>/2</sup>', '1,000<i>t</i> / 3'], a: 0,
    ex: 'The number of doublings after <i>t</i> hours is <i>t</i>/3, so the population is 500 × 2<sup><i>t</i>/3</sup>. Check: at <i>t</i> = 3 you get 1,000.' },
  { id: 'm8', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions',
    q: 'Which expression is equivalent to (<i>x</i> + 3)<sup>2</sup>?',
    ch: ['<i>x</i><sup>2</sup> + 9', '<i>x</i><sup>2</sup> + 3<i>x</i> + 9', '<i>x</i><sup>2</sup> + 6<i>x</i> + 9', '2<i>x</i> + 6'], a: 2,
    ex: '(<i>x</i> + 3)(<i>x</i> + 3) = <i>x</i><sup>2</sup> + 3<i>x</i> + 3<i>x</i> + 9 = <i>x</i><sup>2</sup> + 6<i>x</i> + 9. Don\'t forget the middle term.' },
  { id: 'm9', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'If 2<sup><i>x</i> + 1</sup> = 32, what is the value of <i>x</i>?',
    spr: 4, ex: '32 = 2<sup>5</sup>, so <i>x</i> + 1 = 5 and <i>x</i> = 4.' },
  { id: 'm10', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'One-variable data',
    q: 'The mean of the five numbers 4, 8, 10, 14, and <i>x</i> is 9. What is the value of <i>x</i>?',
    spr: 9, ex: 'Five numbers with a mean of 9 add to 45. 4 + 8 + 10 + 14 = 36, so <i>x</i> = 45 − 36 = 9.' },
  { id: 'm11', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Percentages',
    q: 'A jacket regularly priced at $80 is on sale for 25% off. An 8% sales tax is applied to the sale price. What is the total cost of the jacket?',
    ch: ['$60.00', '$64.80', '$66.40', '$86.40'], a: 1,
    ex: 'Sale price: 80 × 0.75 = 60. With tax: 60 × 1.08 = 64.80.' },
  { id: 'm12', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Probability',
    q: 'A bag contains 6 red marbles, 4 blue marbles, and 10 green marbles. If one marble is chosen at random, what is the probability that it is blue?',
    ch: ['1/10', '1/5', '1/4', '2/5'], a: 1,
    ex: 'There are 6 + 4 + 10 = 20 marbles, and 4 are blue: 4/20 = 1/5.' },
  { id: 'm13', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangles',
    q: 'A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?',
    spr: 10, ex: '6<sup>2</sup> + 8<sup>2</sup> = 36 + 64 = 100, and √100 = 10. (This is a 3-4-5 triangle scaled by 2.)' },
  { id: 'm14', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Circles',
    q: 'In the <i>xy</i>-plane, a circle has the equation (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 2)<sup>2</sup> = 49. What are the coordinates of the center of the circle?',
    ch: ['(3, −2)', '(−3, 2)', '(3, 2)', '(−3, −2)'], a: 0,
    ex: 'The form is (<i>x</i> − <i>h</i>)<sup>2</sup> + (<i>y</i> − <i>k</i>)<sup>2</sup> = <i>r</i><sup>2</sup> with center (<i>h</i>, <i>k</i>). Here <i>h</i> = 3 and <i>y</i> + 2 = <i>y</i> − (−2), so <i>k</i> = −2. The radius is 7.' },
  { id: 'm15', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangle trigonometry',
    q: 'In right triangle <i>ABC</i>, angle <i>C</i> is the right angle and sin <i>A</i> = 3/5. What is cos <i>A</i>?',
    ch: ['3/4', '4/5', '5/3', '5/4'], a: 1,
    ex: 'sin <i>A</i> = opposite/hypotenuse = 3/5, so the adjacent side is 4 (a 3-4-5 triangle). cos <i>A</i> = adjacent/hypotenuse = 4/5.' },
  { id: 'm16', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Area and volume',
    q: 'A circle has a circumference of 10π. What is the area of the circle?',
    ch: ['5π', '10π', '25π', '100π'], a: 2,
    ex: 'Circumference = 2π<i>r</i> = 10π, so <i>r</i> = 5. Area = π<i>r</i><sup>2</sup> = 25π.' },

  // ---------- Reading and Writing: Craft and Structure (added) ----------
  { id: 'rw16', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>Marine biologist Sylvia Earle has spent decades ${B} for ocean conservation, testifying before lawmakers and founding organizations dedicated to protecting marine habitats.</p>`,
    q: WIC, ch: ['advocating', 'apologizing', 'substituting', 'competing'], a: 0,
    ex: "Testifying before lawmakers and founding conservation groups are ways of publicly supporting a cause, which is what advocating means." },
  { id: 'rw17', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>The new bridge design was ${B} by engineers, who found that its cables could not withstand the region's strong winds; the city returned to an earlier plan.</p>`,
    q: WIC, ch: ['endorsed', 'rejected', 'imitated', 'celebrated'], a: 1,
    ex: "The engineers found a serious flaw, and the city went back to an earlier plan. That means the design was rejected." },
  { id: 'rw18', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>Rather than presenting a single unified theory, the philosopher's final book is ${B}: a collection of short essays on topics ranging from friendship to astronomy.</p>`,
    q: WIC, ch: ['systematic', 'eclectic', 'repetitive', 'abbreviated'], a: 1,
    ex: "Essays on topics \"ranging from friendship to astronomy\" draw on many different sources and subjects, which is what eclectic means. \"Systematic\" fits the unified theory the book avoids." },
  { id: 'rw19', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>Jazz pianist Mary Lou Williams was known for her ability to ${B} her style: over a long career, she moved comfortably from swing to bebop to sacred music.</p>`,
    q: WIC, ch: ['adapt', 'conceal', 'restrict', 'abandon'], a: 0,
    ex: "Moving comfortably between genres shows that she could change her style to fit new settings, which is what adapt means." },
  { id: 'rw20', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>Because the data from the first survey were ${B}, with many participants skipping questions, the researchers designed a second, shorter survey.</p>`,
    q: WIC, ch: ['comprehensive', 'incomplete', 'fabricated', 'consistent'], a: 1,
    ex: "Participants skipping questions leaves gaps in the data, so the data were incomplete. Nothing suggests the data were made up (fabricated)." },
  { id: 'rw21', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context',
    passage: `<p>Initial reviews of the film were ${B}, but critics grew more enthusiastic as audiences embraced it, and it is now considered a classic.</p>`,
    q: WIC, ch: ['lukewarm', 'ecstatic', 'unanimous', 'lengthy'], a: 0,
    ex: "\"But\" and \"grew more enthusiastic\" tell you the first reviews were not very enthusiastic. Lukewarm means mildly positive at best." },
  { id: 'rw22', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose',
    passage: `<p>Many people assume that deserts are nearly lifeless. In fact, the Sonoran Desert in North America supports more than 2,000 species of plants, along with hundreds of species of birds and reptiles.</p>`,
    q: 'Which choice best states the main purpose of the text?',
    ch: ['To challenge a common assumption by describing the variety of life in one desert',
         'To explain why deserts receive so little rainfall',
         'To compare the Sonoran Desert with other deserts around the world',
         'To argue that desert species are in danger of disappearing'], a: 0,
    ex: "The text names an assumption (deserts are lifeless) and then counters it with figures about the Sonoran Desert. It doesn't discuss rainfall, other deserts, or threats." },
  { id: 'rw23', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose',
    passage: `<p>In 1933, Florence Price became the first Black woman to have a symphony performed by a major American orchestra. Yet for decades after her death, much of her music went unplayed. Then, in 2009, a large collection of her manuscripts was found in an abandoned house in Illinois, sparking new interest in her work.</p>`,
    q: 'Which choice best describes the overall structure of the text?',
    ch: ['It identifies an achievement, notes a period of neglect, and then describes an event that reversed that neglect.',
         'It presents a claim about a composer and then gives evidence that disproves it.',
         'It explains a musical technique and then shows how one composer used it.',
         'It compares the careers of two composers who worked in the same period.'], a: 0,
    ex: "Sentence 1 is the achievement (the 1933 symphony), sentence 2 is the neglect (\"went unplayed\"), and sentence 3 is the reversal (the 2009 discovery that sparked new interest)." },
  { id: 'rw24', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose',
    passage: `<p>Honeyguides are African birds that lead people to wild beehives. The birds cannot easily break into the hives themselves, but after people open a hive to collect honey, the honeyguides eat the leftover wax. This partnership benefits both species.</p>`,
    q: 'Which choice best describes the function of the third sentence in the overall structure of the text?',
    ch: ['It sums up the relationship described in the previous sentences.',
         'It introduces a counterargument to the first sentence.',
         'It gives a new example of a similar partnership.',
         'It questions whether the earlier observations are accurate.'], a: 0,
    ex: "The first two sentences show how each side gains (people get honey, birds get wax). The third sentence sums that up as a partnership that \"benefits both species.\"" },
  { id: 'rw25', sec: 'rw', dom: 'Craft and Structure', skill: 'Cross-Text Connections',
    passage: `<p><b>Text 1</b><br>Some economists argue that raising the minimum wage causes businesses to hire fewer workers, since each worker becomes more expensive to employ.</p>
      <p><b>Text 2</b><br>Researchers compared restaurants in neighboring counties and found that employment did not fall in counties that raised their minimum wage relative to counties that did not. The researchers suggest that higher wages reduced costly employee turnover.</p>`,
    q: 'Based on the texts, how would the researchers in Text 2 most likely respond to the economists in Text 1?',
    ch: ['By noting that their study did not find the drop in employment that the economists predict',
         'By agreeing that higher labor costs always reduce hiring',
         'By arguing that restaurants should not raise wages',
         'By claiming that employee turnover has nothing to do with wages'], a: 0,
    ex: "Text 1 predicts fewer jobs after a raise. Text 2 found employment \"did not fall,\" which directly contradicts that prediction. Text 2 also links wages to turnover, so it would not say turnover is unrelated." },
  { id: 'rw26', sec: 'rw', dom: 'Craft and Structure', skill: 'Cross-Text Connections',
    passage: `<p><b>Text 1</b><br>For much of the twentieth century, paleontologists pictured dinosaurs as slow, cold-blooded reptiles that dragged their tails along the ground.</p>
      <p><b>Text 2</b><br>Fossilized dinosaur trackways rarely show tail-drag marks. In addition, growth rings in dinosaur bones suggest that many species grew quickly, the way warm-blooded animals do.</p>`,
    q: 'Based on the texts, how would the author of Text 2 most likely view the picture of dinosaurs described in Text 1?',
    ch: ['As outdated, because fossil evidence contradicts it',
         'As accurate for most dinosaur species',
         'As impossible to test with fossil evidence',
         'As based mainly on the study of trackways'], a: 0,
    ex: "Text 2 cites two kinds of fossil evidence (no tail-drag marks, fast growth) that go against the \"slow, cold-blooded, tail-dragging\" picture, so the author would see it as outdated." },

  // ---------- Reading and Writing: Information and Ideas (added) ----------
  { id: 'rw27', sec: 'rw', dom: 'Information and Ideas', skill: 'Central Ideas and Details',
    passage: `<p>For centuries, Venice has struggled with flooding. In 2020, the city began operating MOSE, a system of 78 movable barriers that rise from the seafloor to keep high tides out of the lagoon. Although the project was costly and long delayed, the barriers have prevented several major floods since they began operating.</p>`,
    q: 'Which choice best states the main idea of the text?',
    ch: ['Venice now uses a barrier system that has helped protect it from flooding.',
         'The MOSE barriers have ended all flooding in Venice.',
         'Venice should abandon MOSE because of its high cost.',
         'Flooding in Venice first became a problem in 2020.'], a: 0,
    ex: "The text describes the barrier system and says it has prevented several major floods. Saying it ended \"all flooding\" overstates, abandoning MOSE is never argued, and 2020 contradicts \"for centuries.\"" },
  { id: 'rw28', sec: 'rw', dom: 'Information and Ideas', skill: 'Central Ideas and Details',
    passage: `<p>Octopuses can change color in a fraction of a second. They do this with thousands of skin cells called chromatophores, each containing a small sac of pigment. Muscles around each sac stretch it open to display its color or squeeze it closed to hide it.</p>`,
    q: 'According to the text, how do octopuses display color?',
    ch: ['Muscles stretch open sacs of pigment inside chromatophores.',
         'They absorb light from their surroundings.',
         'They shed their outer layer of skin.',
         'Chemical reactions in their blood change their color.'], a: 0,
    ex: "The last sentence says muscles \"stretch it open to display its color.\" The other choices aren't mentioned." },
  { id: 'rw29', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)',
    passage: `<p>In a short story, a young woman named Mara lives in a small mountain village. A student claims that Mara is reluctant to leave the village, even though she says she wants to see the world.</p>`,
    q: "Which quotation from the story would most directly support the student's claim?",
    ch: ['"Each time she reached the edge of the village road, Mara found a reason to turn back."',
         '"Mara laughed with the travelers who passed through the square."',
         '"The village had three wells and a single bakery."',
         '"Mara\'s brother had left for the city years before."'], a: 0,
    ex: "Repeatedly turning back at the edge of the village shows reluctance to leave. The other quotations describe the village or other people, not Mara's hesitation." },
  { id: 'rw30', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Quantitative)',
    passage: `<div class="tablescroll"><table><caption>Average one-way commute in Linden City, by travel mode</caption>
      <thead><tr><th>Mode</th><th>Minutes</th></tr></thead>
      <tbody><tr><td>Car</td><td class="n">27</td></tr><tr><td>Bus</td><td class="n">41</td></tr><tr><td>Bicycle</td><td class="n">19</td></tr><tr><td>Walking</td><td class="n">15</td></tr></tbody></table></div>
      <p>A city planner claims that, on average, Linden City residents who bike to work have shorter commutes than those who drive.</p>`,
    q: "Which choice best describes data from the table that support the planner's claim?",
    ch: ['The average bicycle commute is 19 minutes, while the average car commute is 27 minutes.',
         'The average bus commute, at 41 minutes, is the longest of the four modes.',
         'The average walking commute, at 15 minutes, is the shortest of the four modes.',
         'The average car commute is 14 minutes shorter than the average bus commute.'], a: 0,
    ex: "The claim compares biking with driving, so the evidence must include both: 19 minutes by bicycle versus 27 by car. The other choices are true but don't compare those two modes." },
  { id: 'rw31', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Quantitative)',
    passage: `<div class="tablescroll"><table><caption>Share of Country X's electricity generated by solar power</caption>
      <thead><tr><th>Year</th><th>Share</th></tr></thead>
      <tbody><tr><td>2015</td><td class="n">2%</td></tr><tr><td>2018</td><td class="n">5%</td></tr><tr><td>2021</td><td class="n">9%</td></tr><tr><td>2024</td><td class="n">14%</td></tr></tbody></table></div>
      <p>Between 2015 and 2024, the share of Country X's electricity that came from solar power ${B}</p>`,
    q: 'Which choice most effectively uses data from the table to complete the statement?',
    ch: ['increased by 12 percentage points.', 'exactly doubled.', 'decreased each year.', 'increased by 14 percentage points.'], a: 0,
    ex: "14% − 2% = 12 percentage points. It grew sevenfold, so it did not just double, and 14 points ignores the 2% starting value." },
  { id: 'rw32', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences',
    passage: `<p>Ice cores drilled from glaciers contain tiny bubbles of air that were trapped as the ice formed. Because deeper layers of ice formed earlier than shallower layers, scientists can analyze bubbles from different depths to ${B}</p>`,
    q: LOGIC,
    ch: ['learn how the makeup of the atmosphere has changed over time.',
         'predict what the weather will be in the coming week.',
         'measure how quickly glaciers move across land.',
         'determine the depth of the nearest ocean.'], a: 0,
    ex: "Bubbles hold old air, and depth corresponds to age. Comparing depths therefore compares the atmosphere at different times." },
  { id: 'rw33', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences',
    passage: `<p>In a study, one group of participants was told that a puzzle measured intelligence, while another group was told that the same puzzle was a game. Participants in the second group spent more time on the puzzle and reported enjoying it more. This finding suggests that ${B}</p>`,
    q: LOGIC,
    ch: ['the way a task is described can affect how people engage with it.',
         'games are generally more difficult than intelligence tests.',
         'people who are more intelligent prefer games to tests.',
         'puzzles are rarely enjoyable for adults.'], a: 0,
    ex: "The puzzle was identical, and only its description changed. Since behavior differed, the description affected engagement." },
  { id: 'rw34', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)',
    passage: `<p>A botanist hypothesizes that a certain mountain wildflower depends on bumblebees for pollination.</p>`,
    q: "Which finding, if true, would most directly support the botanist's hypothesis?",
    ch: ['When netting kept bumblebees away from the flowers, the plants produced almost no seeds.',
         'The wildflower blooms earlier in the spring than most nearby plants.',
         'Butterflies and beetles also visit the wildflower.',
         'Bumblebees generally prefer blue flowers to yellow ones.'], a: 0,
    ex: "If removing bumblebees stops seed production, the plant depends on them. Other insects visiting would weaken the idea, and bloom timing or general color preference says nothing about this plant's dependence." },
  { id: 'rw35', sec: 'rw', dom: 'Information and Ideas', skill: 'Central Ideas and Details',
    passage: `<p>Before the printing press, books in Europe were copied by hand, a process that could take months for a single volume. Printing allowed hundreds of identical copies to be produced quickly, which lowered the cost of books and helped ideas spread across the continent.</p>`,
    q: 'Which choice best states the main idea of the text?',
    ch: ['The printing press made books cheaper and faster to produce, helping ideas spread.',
         'Hand-copied books were more accurate than printed books.',
         'The printing press was invented outside of Europe.',
         'Books became harder to find after the printing press appeared.'], a: 0,
    ex: "The text contrasts slow hand copying with fast printing and states the effects: lower cost and wider spread of ideas." },
  { id: 'rw36', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences',
    passage: `<p>Sea otters eat sea urchins, and sea urchins feed on kelp. When sea otter populations declined along parts of the Pacific coast, the kelp forests in those areas shrank dramatically. This pattern suggests that ${B}</p>`,
    q: LOGIC,
    ch: ['sea otters help protect kelp forests by limiting the number of sea urchins.',
         'kelp is the main food source for sea otters.',
         'sea urchins avoid areas where kelp grows.',
         'sea otters damage kelp forests when their numbers rise.'], a: 0,
    ex: "Fewer otters means more urchins, and more urchins eat more kelp. So otters keep urchins in check, which protects the kelp." },

  // ---------- Reading and Writing: Standard English Conventions (added) ----------
  { id: 'rw37', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>By the time the rescue team arrived, the hikers ${B} shelter in a nearby cave.</p>`,
    q: CONV, ch: ['find', 'will find', 'had found', 'are finding'], a: 2,
    ex: "\"By the time\" plus a past event (\"arrived\") calls for the past perfect: the hikers had found shelter before the team arrived." },
  { id: 'rw38', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>The city orchestra announced that ${B} would perform a free concert in Riverside Park next month.</p>`,
    q: CONV, ch: ['they', 'it', 'we', 'them'], a: 1,
    ex: "\"Orchestra\" is a singular collective noun, so the pronoun is \"it.\" \"Them\" is also the wrong case for a subject." },
  { id: 'rw39', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries',
    passage: `<p>The traditional bread recipe calls for just three ${B} flour, water, and salt.</p>`,
    q: CONV, ch: ['ingredients:', 'ingredients,', 'ingredients;', 'ingredients'], a: 0,
    ex: "A colon introduces a list after a complete clause. A semicolon must join two independent clauses, and \"flour, water, and salt\" isn't one." },
  { id: 'rw40', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries',
    passage: `<p>Astronomer Henrietta Leavitt studied thousands of variable ${B} her work later helped scientists measure the distances to faraway galaxies.</p>`,
    q: CONV, ch: ['stars, and', 'stars and,', 'stars,', 'stars and'], a: 0,
    ex: "Two independent clauses can be joined with a comma plus a coordinating conjunction (\", and\"). A comma alone is a comma splice." },
  { id: 'rw41', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>Each of the paintings in the gallery's east wing ${B} the river at a different time of day.</p>`,
    q: CONV, ch: ['show', 'shows', 'are showing', 'have shown'], a: 1,
    ex: "The subject is \"Each,\" which is singular. \"Of the paintings\" doesn't change that, so the verb is \"shows.\"" },
  { id: 'rw42', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>Having studied the ancient manuscripts for years, ${B}</p>`,
    q: CONV,
    ch: ["the language's grammar was finally clear to the linguist.",
         "the linguist finally understood the language's grammar.",
         'the grammar of the language finally made sense.',
         'it was finally clear what the grammar of the language was.'], a: 1,
    ex: "The opening phrase describes whoever studied the manuscripts, so that person must come right after the comma. Only one choice puts \"the linguist\" there. The others create dangling modifiers." },
  { id: 'rw43', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>The ${B} nesting habits have shifted as rising temperatures change the timing of spring.</p>`,
    q: CONV, ch: ["region's birds", "regions bird's", "region's birds'", "regions' bird's"], a: 2,
    ex: "The birds belong to one region (region's), and the nesting habits belong to many birds (birds'). So both words need to be possessive: region's birds'." },
  { id: 'rw44', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries',
    passage: `<p>The Atacama ${B} is one of the driest places on Earth.</p>`,
    q: CONV,
    ch: ["Desert, which stretches along Chile's Pacific coast,", "Desert which stretches along Chile's Pacific coast,",
         "Desert, which stretches along Chile's Pacific coast", "Desert; which stretches along Chile's Pacific coast,"], a: 0,
    ex: "The \"which\" clause adds extra information, so it needs a comma before and after it. Only one choice has both." },
  { id: 'rw45', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>The ancient city's walls, ${B} from local limestone, still stand more than 2,000 years after their construction.</p>`,
    q: CONV, ch: ['built', 'building', 'were built', 'they were built'], a: 0,
    ex: "The phrase between the commas modifies \"walls\" and needs a past participle: \"built from local limestone.\" \"Were built\" and \"they were built\" add a second main verb or clause, which breaks the sentence." },
  { id: 'rw46', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense',
    passage: `<p>After customers raised concerns, the company updated ${B} privacy policy to explain how personal data are stored.</p>`,
    q: CONV, ch: ['its', "it's", 'their', "its'"], a: 0,
    ex: "\"Its\" is the possessive for a singular noun like \"company.\" \"It's\" means \"it is,\" and \"its'\" is never correct." },

  // ---------- Reading and Writing: Expression of Ideas (added) ----------
  { id: 'rw47', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>Exposure times for the earliest cameras could last several minutes. ${B} people being photographed had to stay perfectly still, sometimes with the help of hidden head braces.</p>`,
    q: TRANS, ch: ['As a result,', 'In contrast,', 'Nevertheless,', 'For instance,'], a: 0,
    ex: "Long exposures caused people to need to hold still, which is a cause-and-effect relationship: \"As a result.\"" },
  { id: 'rw48', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>Coffee plants grow best at high elevations with steady temperatures. Tea plants, ${B} can tolerate a wider range of climates, from tropical lowlands to cool mountain slopes.</p>`,
    q: TRANS, ch: ['by contrast,', 'for example,', 'as a result,', 'in other words,'], a: 0,
    ex: "Coffee needs narrow conditions, while tea tolerates a wide range. That's a contrast." },
  { id: 'rw49', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>The study's sample was small, including only 40 participants. ${B} its findings should be confirmed by larger studies before they are applied widely.</p>`,
    q: TRANS, ch: ['Therefore,', 'Likewise,', 'Instead,', 'For example,'], a: 0,
    ex: "The small sample is the reason the findings need confirming. That's a conclusion, so \"Therefore\" fits." },
  { id: 'rw50', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>Mangrove trees survive in salty water that would kill most plants. Some species filter salt out at their roots. ${B} some species get rid of excess salt through special glands in their leaves.</p>`,
    q: TRANS, ch: ['Additionally,', 'Therefore,', 'For instance,', 'Nevertheless,'], a: 0,
    ex: "The second sentence adds another way mangroves handle salt, so the transition should signal addition." },
  { id: 'rw51', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions',
    passage: `<p>The city's new protected bike lanes were designed mainly to improve safety. ${B} the lanes appear to have boosted business at nearby shops, according to a recent survey of store owners.</p>`,
    q: TRANS, ch: ['In addition,', 'Instead,', 'Nonetheless,', 'Specifically,'], a: 0,
    ex: "Boosting business is an extra benefit on top of safety. It's not a contrast or a specific example of safety." },
  { id: 'rw52', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Maria Tallchief (1925–2013) was an American ballet dancer.</li>
      <li>She was a member of the Osage Nation.</li>
      <li>She is widely considered America's first major prima ballerina.</li>
      <li>She danced with the New York City Ballet.</li></ul>`,
    q: 'The student wants to introduce Maria Tallchief to an audience unfamiliar with her. Which choice most effectively uses relevant information from the notes to accomplish this goal?',
    ch: ["Maria Tallchief, a member of the Osage Nation, is widely considered America's first major prima ballerina.",
         'Tallchief danced with the New York City Ballet.',
         'The New York City Ballet has featured many talented dancers.',
         'Tallchief was born in 1925 and died in 2013.'], a: 0,
    ex: "An introduction should say who she is and why she matters. Only the choice naming her as America's first major prima ballerina does both. The others leave out who she is or aren't about her." },
  { id: 'rw53', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Mauna Loa, in Hawaii, is a shield volcano with gentle slopes.</li>
      <li>Its eruptions usually produce flowing rivers of lava.</li>
      <li>Mount St. Helens, in Washington State, is a steep stratovolcano.</li>
      <li>It is known for explosive eruptions, including a major one in 1980.</li></ul>`,
    q: 'The student wants to contrast the eruptions of the two volcanoes. Which choice most effectively uses relevant information from the notes to accomplish this goal?',
    ch: ['Mauna Loa\'s eruptions usually produce flowing lava, whereas Mount St. Helens is known for explosive eruptions, such as one in 1980.',
         'Mauna Loa and Mount St. Helens are both volcanoes in the United States.',
         'Mount St. Helens had a major eruption in 1980.',
         'Mauna Loa is a shield volcano with gentle slopes.'], a: 0,
    ex: "Only the \"whereas\" choice describes the eruptions of both volcanoes and sets them against each other with \"whereas.\"" },
  { id: 'rw54', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Researchers surveyed 500 commuters in Copenhagen in 2022.</li>
      <li>Some commuters cycled to work; others drove.</li>
      <li>Cyclists reported lower stress levels than drivers did.</li></ul>`,
    q: "The student wants to present the study's main finding. Which choice most effectively uses relevant information from the notes to accomplish this goal?",
    ch: ['A 2022 survey of Copenhagen commuters found that those who cycled to work reported lower stress than those who drove.',
         'Researchers surveyed 500 commuters in Copenhagen in 2022.',
         'Some Copenhagen commuters cycle to work, while others drive.',
         'Copenhagen is a city where many people commute.'], a: 0,
    ex: "The finding is the stress comparison between cyclists and drivers. Only one choice states it. The others describe how the study was set up or the city." },

  // ---------- Math: Algebra (added) ----------
  { id: 'm17', sec: 'math', dom: 'Algebra', skill: 'Linear equations in one variable',
    q: 'If 5(<i>x</i> − 2) = 3<i>x</i> + 4, what is the value of <i>x</i>?',
    spr: 7, ex: 'Distribute: 5<i>x</i> − 10 = 3<i>x</i> + 4. Subtract 3<i>x</i> and add 10: 2<i>x</i> = 14, so <i>x</i> = 7.' },
  { id: 'm18', sec: 'math', dom: 'Algebra', skill: 'Linear equations in two variables',
    q: 'What is the <i>y</i>-intercept of the graph of <i>y</i> = −3<i>x</i> + 6 in the <i>xy</i>-plane?',
    ch: ['(0, 6)', '(6, 0)', '(0, −3)', '(2, 0)'], a: 0,
    ex: 'The <i>y</i>-intercept is where <i>x</i> = 0: <i>y</i> = −3(0) + 6 = 6, giving (0, 6). (2, 0) is the <i>x</i>-intercept.' },
  { id: 'm19', sec: 'math', dom: 'Algebra', skill: 'Linear equations in two variables',
    q: 'Which equation represents a line that is parallel to the line <i>y</i> = 4<i>x</i> − 1?',
    ch: ['<i>y</i> = 4<i>x</i> + 7', '<i>y</i> = −4<i>x</i> − 1', '<i>y</i> = ¼<i>x</i> − 1', '<i>y</i> = −¼<i>x</i> + 2'], a: 0,
    ex: 'Parallel lines have equal slopes. Only <i>y</i> = 4<i>x</i> + 7 has slope 4. <i>y</i> = −¼<i>x</i> + 2 has the negative reciprocal slope, which makes it perpendicular.' },
  { id: 'm20', sec: 'math', dom: 'Algebra', skill: 'Linear inequalities',
    q: 'A delivery truck can carry at most 2,000 pounds. It already holds 600 pounds of equipment, and each box weighs 35 pounds. Which inequality represents the number of boxes, <i>b</i>, the truck can carry?',
    ch: ['35<i>b</i> + 600 ≤ 2,000', '35<i>b</i> − 600 ≤ 2,000', '600<i>b</i> + 35 ≤ 2,000', '35<i>b</i> + 600 ≥ 2,000'], a: 0,
    ex: 'Total weight is 600 + 35<i>b</i>, and "at most" means ≤ 2,000.' },
  { id: 'm21', sec: 'math', dom: 'Algebra', skill: 'Linear inequalities',
    q: 'A delivery truck can carry at most 2,000 pounds. It already holds 600 pounds of equipment, and each box weighs 35 pounds. What is the greatest number of boxes the truck can carry?',
    spr: 40, ex: '600 + 35<i>b</i> ≤ 2,000 → 35<i>b</i> ≤ 1,400 → <i>b</i> ≤ 40.' },
  { id: 'm22', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations',
    q: '2<i>x</i> + 3<i>y</i> = 12<br><i>y</i> = <i>x</i> − 1<br><br>If (<i>x</i>, <i>y</i>) is the solution to the system above, what is the value of <i>y</i>?',
    spr: 2, ex: 'Substitute: 2<i>x</i> + 3(<i>x</i> − 1) = 12 → 5<i>x</i> − 3 = 12 → <i>x</i> = 3. Then <i>y</i> = 3 − 1 = 2.' },
  { id: 'm23', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations',
    q: '3<i>x</i> + <i>ky</i> = 8<br>6<i>x</i> + 4<i>y</i> = 5<br><br>In the system above, <i>k</i> is a constant. If the system has no solution, what is the value of <i>k</i>?',
    spr: 2, ex: 'No solution means the lines are parallel and distinct. Coefficients must be proportional: 3/6 = <i>k</i>/4, so <i>k</i> = 2. Check that the constants aren\'t in the same ratio: 8/5 ≠ 1/2, so the lines are distinct.' },
  { id: 'm24', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations',
    q: 'A theater sells adult tickets for $12 and child tickets for $8. On one night it sold 50 tickets for a total of $520. How many adult tickets did it sell?',
    spr: 30, ex: '<i>a</i> + <i>c</i> = 50 and 12<i>a</i> + 8<i>c</i> = 520. Substitute <i>c</i> = 50 − <i>a</i>: 12<i>a</i> + 400 − 8<i>a</i> = 520 → 4<i>a</i> = 120 → <i>a</i> = 30.' },
  { id: 'm25', sec: 'math', dom: 'Algebra', skill: 'Linear functions',
    q: 'For the linear function <i>f</i>, <i>f</i>(1) = 7 and <i>f</i>(4) = 16. What is the value of <i>f</i>(0)?',
    spr: 4, ex: 'Slope = (16 − 7) ÷ (4 − 1) = 3. Going from <i>x</i> = 1 back to <i>x</i> = 0 subtracts 3: <i>f</i>(0) = 7 − 3 = 4.' },
  { id: 'm26', sec: 'math', dom: 'Algebra', skill: 'Linear functions',
    q: 'The equation <i>C</i> = 15<i>h</i> + 50 gives the cost <i>C</i>, in dollars, of a plumber\'s visit that lasts <i>h</i> hours. What is the best interpretation of 15 in this context?',
    ch: ['The cost per hour of the plumber\'s work', 'The fixed fee charged for each visit', 'The total cost of a one-hour visit', 'The number of hours the visit lasts'], a: 0,
    ex: '15 multiplies <i>h</i>, so cost goes up $15 for each additional hour. The 50 is the fixed fee, and a one-hour visit costs $65.' },
  { id: 'm27', sec: 'math', dom: 'Algebra', skill: 'Linear equations in one variable',
    q: 'Which of the following is a solution to |<i>x</i> − 4| = 9?',
    ch: ['−13', '−5', '5', '9'], a: 1,
    ex: '<i>x</i> − 4 = 9 or <i>x</i> − 4 = −9, so <i>x</i> = 13 or <i>x</i> = −5. Only −5 is listed.' },

  // ---------- Math: Advanced Math (added) ----------
  { id: 'm28', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions',
    q: 'Which expression is equivalent to <i>x</i><sup>2</sup> − 9?',
    ch: ['(<i>x</i> − 3)<sup>2</sup>', '(<i>x</i> − 3)(<i>x</i> + 3)', '(<i>x</i> − 9)(<i>x</i> + 1)', '(<i>x</i> + 3)<sup>2</sup>'], a: 1,
    ex: 'Difference of squares: <i>a</i><sup>2</sup> − <i>b</i><sup>2</sup> = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>). With <i>b</i> = 3 you get (<i>x</i> − 3)(<i>x</i> + 3).' },
  { id: 'm29', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'What is the vertex of the graph of <i>y</i> = (<i>x</i> − 2)<sup>2</sup> + 5 in the <i>xy</i>-plane?',
    ch: ['(2, 5)', '(−2, 5)', '(2, −5)', '(5, 2)'], a: 0,
    ex: 'Vertex form <i>y</i> = (<i>x</i> − <i>h</i>)<sup>2</sup> + <i>k</i> has vertex (<i>h</i>, <i>k</i>) = (2, 5).' },
  { id: 'm30', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'What is the positive solution to <i>x</i><sup>2</sup> = 4<i>x</i> + 12?',
    spr: 6, ex: 'Rearrange: <i>x</i><sup>2</sup> − 4<i>x</i> − 12 = 0 → (<i>x</i> − 6)(<i>x</i> + 2) = 0. The solutions are 6 and −2, and the positive one is 6.' },
  { id: 'm31', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = 3<sup><i>x</i></sup>. What is the value of <i>f</i>(4)?',
    spr: 81, ex: '3<sup>4</sup> = 3 × 3 × 3 × 3 = 81.' },
  { id: 'm32', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'The functions <i>g</i> and <i>h</i> are defined by <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 1 and <i>h</i>(<i>x</i>) = 2<i>x</i> − 3. What is the value of <i>g</i>(<i>h</i>(2))?',
    spr: 2, ex: 'Work inside out: <i>h</i>(2) = 2(2) − 3 = 1. Then <i>g</i>(1) = 1<sup>2</sup> + 1 = 2.' },
  { id: 'm33', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'A car valued at $24,000 loses 15% of its value each year. Which function gives the car\'s value <i>V</i>, in dollars, <i>t</i> years from now?',
    ch: ['<i>V</i>(<i>t</i>) = 24,000(0.85)<sup><i>t</i></sup>', '<i>V</i>(<i>t</i>) = 24,000(0.15)<sup><i>t</i></sup>', '<i>V</i>(<i>t</i>) = 24,000(1.15)<sup><i>t</i></sup>', '<i>V</i>(<i>t</i>) = 24,000 − 0.15<i>t</i>'], a: 0,
    ex: 'Losing 15% each year leaves 85% of the value, so you multiply by 0.85 once per year: 24,000(0.85)<sup><i>t</i></sup>. Using 0.15 would keep only 15%.' },
  { id: 'm34', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions',
    q: 'Which expression is equivalent to (2<i>x</i><sup>2</sup> + 3<i>x</i>) − (<i>x</i><sup>2</sup> − 5<i>x</i> + 4)?',
    ch: ['<i>x</i><sup>2</sup> + 8<i>x</i> − 4', '<i>x</i><sup>2</sup> − 2<i>x</i> − 4', '<i>x</i><sup>2</sup> + 8<i>x</i> + 4', '3<i>x</i><sup>2</sup> − 2<i>x</i> + 4'], a: 0,
    ex: 'Distribute the minus sign to every term: 2<i>x</i><sup>2</sup> + 3<i>x</i> − <i>x</i><sup>2</sup> + 5<i>x</i> − 4 = <i>x</i><sup>2</sup> + 8<i>x</i> − 4.' },
  { id: 'm35', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions',
    q: 'For <i>x</i> ≠ 0, which expression is equivalent to (<i>x</i><sup>2</sup> + 6<i>x</i>) ÷ <i>x</i>?',
    ch: ['<i>x</i> + 6', '<i>x</i> + 6<i>x</i>', '<i>x</i><sup>2</sup> + 6', '7<i>x</i>'], a: 0,
    ex: 'Divide each term by <i>x</i>: <i>x</i><sup>2</sup>/<i>x</i> + 6<i>x</i>/<i>x</i> = <i>x</i> + 6.' },
  { id: 'm36', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'For what value of the constant <i>c</i> does the equation <i>x</i><sup>2</sup> + 6<i>x</i> + <i>c</i> = 0 have exactly one real solution?',
    spr: 9, ex: 'One real solution means the discriminant is zero: 6<sup>2</sup> − 4(1)(<i>c</i>) = 0 → 36 = 4<i>c</i> → <i>c</i> = 9. Then the equation is (<i>x</i> + 3)<sup>2</sup> = 0.' },
  { id: 'm37', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'If √(<i>x</i> + 3) = 5, what is the value of <i>x</i>?',
    spr: 22, ex: 'Square both sides: <i>x</i> + 3 = 25, so <i>x</i> = 22. Check: √25 = 5.' },

  // ---------- Math: Problem-Solving and Data Analysis (added) ----------
  { id: 'm38', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Rates and units',
    q: 'A printer prints 18 pages in 45 seconds. At this rate, how many pages can it print in 5 minutes?',
    spr: 120, ex: '18 ÷ 45 = 0.4 pages per second. 5 minutes = 300 seconds, and 0.4 × 300 = 120.' },
  { id: 'm39', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'One-variable data',
    q: 'What is the median of the data set 3, 7, 7, 9, 12, 15?',
    spr: 8, ex: 'With six values, the median is the mean of the two middle values: (7 + 9) ÷ 2 = 8.' },
  { id: 'm40', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Probability',
    q: 'A survey asked 140 students in grades 11 and 12 whether they prefer sports or arts activities. The results are shown below.<div class="tablescroll"><table><thead><tr><th></th><th>Sports</th><th>Arts</th><th>Total</th></tr></thead><tbody><tr><td>Grade 11</td><td>40</td><td>20</td><td>60</td></tr><tr><td>Grade 12</td><td>30</td><td>50</td><td>80</td></tr></tbody></table></div>If a grade 12 student from the survey is selected at random, what is the probability that the student prefers arts?',
    ch: ['5/14', '3/8', '5/8', '5/7'], a: 2,
    ex: 'The question limits you to grade 12 students (80 of them). 50 of those prefer arts: 50/80 = 5/8. 5/14 uses all 140 students, which is a common trap.' },
  { id: 'm41', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Ratios and proportions',
    q: 'A recipe uses 3 cups of flour for every 2 cups of sugar. If a baker uses 12 cups of flour, how many cups of sugar should be used?',
    spr: 8, ex: '12 cups of flour is 4 times 3, so use 4 × 2 = 8 cups of sugar.' },

  // ---------- Math: Geometry and Trigonometry (added) ----------
  { id: 'm42', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Lines and angles',
    q: 'Two angles are supplementary. The measure of one angle is 4 times the measure of the other. What is the measure, in degrees, of the smaller angle?',
    spr: 36, ex: 'Supplementary angles add to 180°: <i>x</i> + 4<i>x</i> = 180 → 5<i>x</i> = 180 → <i>x</i> = 36.' },
  { id: 'm43', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Area and volume',
    q: 'A right circular cylinder has a radius of 3 and a height of 10. What is its volume?',
    ch: ['30π', '60π', '90π', '900π'], a: 2,
    ex: 'V = π<i>r</i><sup>2</sup><i>h</i> = π(9)(10) = 90π.' },
  { id: 'm44', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Similar triangles',
    q: 'Triangle <i>ABC</i> is similar to triangle <i>DEF</i>, with <i>A</i>, <i>B</i>, and <i>C</i> corresponding to <i>D</i>, <i>E</i>, and <i>F</i>. If <i>AB</i> = 4, <i>DE</i> = 10, and <i>BC</i> = 6, what is <i>EF</i>?',
    spr: 15, ex: 'The scale factor is 10/4 = 2.5. <i>EF</i> = 6 × 2.5 = 15.' },

  // ====== Harder questions (feed the adaptive Module 2) ======
  // ---------- R&W: Craft and Structure ----------
  { id: 'rw55', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context', d: 'H',
    passage: `<p>In her study of nineteenth-century trade networks, the historian resists the ${B} impulse to credit a single merchant family with the region's prosperity, instead tracing how dozens of small traders contributed to it.</p>`,
    q: WIC, ch: ['reductive', 'meticulous', 'altruistic', 'contrarian'], a: 0,
    ex: "Giving one family all the credit oversimplifies a story that involved dozens of traders. Reductive means oversimplifying something complex." },
  { id: 'rw56', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context', d: 'H',
    passage: `<p>Critics who dismissed the sculptor's late work as merely ${B} overlooked its formal daring: although the pieces reuse motifs from her earlier career, they recombine those motifs in ways that upend their original meanings.</p>`,
    q: WIC, ch: ['derivative', 'inscrutable', 'ephemeral', 'austere'], a: 0,
    ex: "The critics' complaint is tied to the work reusing earlier motifs. Derivative means copied from or based on earlier work, which the author argues misses how the pieces transform those motifs." },
  { id: 'rw57', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context', d: 'H',
    passage: `<p>The committee's endorsement of the proposal was ${B} at best: members approved it only after attaching so many conditions that its original goals were nearly unrecognizable.</p>`,
    q: WIC, ch: ['qualified', 'unequivocal', 'premature', 'clandestine'], a: 0,
    ex: "Approval that comes with many conditions is limited or partial, which is what qualified means. Unequivocal (without reservation) is the opposite." },
  { id: 'rw58', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose', d: 'H',
    passage: `<p>Biologists have long assumed that the bright coloring of poison dart frogs evolved only as a warning to predators. Yet a recent study of one species found that females consistently chose brighter males as mates, even when duller males were equally healthy. The researchers don't dispute the warning function; rather, they suggest that mate choice may have reinforced it.</p>`,
    q: 'Which choice best describes the overall structure of the text?',
    ch: ['It presents a long-held explanation, describes a finding that complicates it, and proposes that a second factor also played a role.',
         'It presents a long-held explanation and then describes evidence that disproves it entirely.',
         'It describes two competing studies and argues that one of them is flawed.',
         'It explains a behavior and then lists several exceptions to it.'], a: 0,
    ex: "The researchers \"don't dispute the warning function,\" so the old explanation isn't thrown out. They add mate choice as a second factor. That rules out the \"disproves it entirely\" choice." },
  { id: 'rw59', sec: 'rw', dom: 'Craft and Structure', skill: 'Cross-Text Connections', d: 'H',
    passage: `<p><b>Text 1</b><br>Many scholars treat the letters of the novelist Edith Marlowe as a reliable guide to her intentions, citing her detailed descriptions of how she planned each book.</p>
      <p><b>Text 2</b><br>Marlowe's letters were written to her publisher, who controlled her advances. It would be naive to assume she never shaped her account of her methods to reassure him that each manuscript was carefully planned, and therefore marketable.</p>`,
    q: 'Based on the texts, how would the author of Text 2 most likely respond to the scholars in Text 1?',
    ch: ["By cautioning that the letters may reflect Marlowe's practical motives rather than simply her actual methods",
         'By arguing that Marlowe never planned any of her novels',
         'By agreeing that the letters are the most reliable source on her intentions',
         "By claiming that Marlowe's publisher wrote the letters himself"], a: 0,
    ex: "Text 2 suggests Marlowe had a reason (her advances) to present herself as a careful planner, so the letters may not be a neutral record. It never goes as far as saying she didn't plan at all." },
  { id: 'rw60', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose', d: 'M',
    passage: `<p>Some city officials argue that widening highways reduces traffic. However, studies in several cities have found that within a few years of widening, traffic returns to its earlier levels, because the added space encourages more people to drive. Economists call this effect induced demand.</p>`,
    q: 'Which choice best describes the function of the third sentence in the overall structure of the text?',
    ch: ['It names the effect described in the previous sentence.',
         'It offers a counterargument to the studies just mentioned.',
         'It proposes a solution to the traffic problem.',
         'It questions how the studies were carried out.'], a: 0,
    ex: "The second sentence describes the effect (extra lanes attract more drivers). The third sentence just gives it a name: induced demand." },

  // ---------- R&W: Information and Ideas ----------
  { id: 'rw61', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences', d: 'H',
    passage: `<p>Archaeologists excavating a Bronze Age settlement found that pottery in the oldest layers was made from local clay, while pottery in later layers was made from clay found only 300 kilometers away. Because the later pottery shows the same shaping and firing techniques as the earlier pottery, the researchers argue that ${B}</p>`,
    q: LOGIC,
    ch: ["the settlement's potters likely obtained distant clay and shaped it themselves using familiar methods.",
         'the settlement was abandoned and later resettled by people from 300 kilometers away.',
         'the local clay had become unusable by the time the later layers formed.',
         'the later pots were made in distant workshops and traded to the settlement as finished goods.'], a: 0,
    ex: "Same techniques suggest the same local potters. Distant clay suggests the raw material came from far away. Together, local potters were working imported clay. New settlers or outside workshops would likely bring different techniques." },
  { id: 'rw62', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)', d: 'H',
    passage: `<p>An ecologist hypothesizes that the decline of a songbird species in a forest is caused mainly by new roads that break up its habitat, rather than by a decline in the insects it eats.</p>`,
    q: "Which finding, if true, would most directly support the ecologist's hypothesis?",
    ch: ['Insect populations in the forest have stayed stable, while the songbird has declined most sharply in areas near new roads.',
         'The songbird has declined equally across the forest, and insect populations have also fallen.',
         'Several other bird species in the forest also feed on insects.',
         'Most of the roads in the forest were built within the past decade.'], a: 0,
    ex: "To favor roads over insects, you need evidence that rules out insects (they're stable) and links the decline to roads (sharpest near them). The first choice does both. The second points toward insects instead." },
  { id: 'rw63', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)', d: 'H',
    passage: `<p>A researcher claims that the opening of a new public library in Hartwell caused an increase in reading among the city's teenagers, pointing to a 30 percent rise in teen library card sign-ups since the library opened.</p>`,
    q: "Which finding, if true, would most directly weaken the researcher's claim?",
    ch: ['Teen library card sign-ups rose by about 30 percent over the same period in nearby cities that did not open new libraries.',
         'The new library has a large section of books written for teenagers.',
         'Teen visits to the library rose steadily after it opened.',
         'Teenagers surveyed said they enjoy the events held at the new library.'], a: 0,
    ex: "If sign-ups rose just as much in cities without a new library, something else is likely behind the rise. The other findings are consistent with the claim." },
  { id: 'rw64', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Quantitative)', d: 'H',
    passage: `<div class="tablescroll"><table><caption>Average daily screen time (hours)</caption>
      <thead><tr><th>Group</th><th>Before</th><th>After 4 weeks</th></tr></thead>
      <tbody><tr><td>A (took the program)</td><td class="n">6.2</td><td class="n">4.1</td></tr><tr><td>B (did not)</td><td class="n">6.0</td><td class="n">5.8</td></tr></tbody></table></div>
      <p>Researchers concluded that the program itself, rather than some other factor affecting all participants, reduced screen time.</p>`,
    q: "Which choice most effectively uses data from the table to support the researchers' conclusion?",
    ch: ["Group A's screen time fell by about 2.1 hours, while Group B's fell by only about 0.2 hours.",
         'Both groups started with similar screen time, about 6 hours per day.',
         "Group B's screen time after four weeks was 5.8 hours per day.",
         'Screen time decreased in both groups over the four weeks.'], a: 0,
    ex: "To credit the program rather than a shared factor, you need to compare the change in the group that took it with the change in the group that didn't. Only the first choice makes that comparison (2.1 vs 0.2 hours). The last choice actually suggests a shared factor." },
  { id: 'rw65', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences', d: 'H',
    passage: `<p>Plants grown beside a highway flowered about a week earlier than identical plants grown in a field 2 kilometers away. The air near the highway was about 2°C warmer, but it also contained higher levels of nitrogen compounds from vehicle exhaust, which can act as fertilizer. The researchers therefore caution that ${B}</p>`,
    q: LOGIC,
    ch: ['the earlier flowering cannot yet be attributed to temperature alone.',
         'highways should be moved away from areas where plants grow.',
         'nitrogen compounds are known to delay flowering in most plants.',
         'temperature has no effect on when plants flower.'], a: 0,
    ex: "Two things differed near the highway (warmth and nitrogen), so either could explain early flowering. That's why the researchers can't credit temperature alone. Saying temperature has \"no effect\" goes too far." },
  { id: 'rw66', sec: 'rw', dom: 'Information and Ideas', skill: 'Central Ideas and Details', d: 'H',
    passage: `<p>The economist's model accurately predicted consumer spending during periods of steady growth, but it failed to anticipate the sharp drop in spending that followed the 2008 financial crisis. Her critics see this failure as proof that the model is fundamentally flawed. She counters that no model built on decades of ordinary economic behavior could be expected to capture a rare shock, and that the model remains useful for the conditions it was designed to describe.</p>`,
    q: 'Which choice best states the main idea of the text?',
    ch: ["An economist defends her model's usefulness despite its failure to predict an unusual event.",
         "The economist's model is fundamentally flawed and should no longer be used.",
         'Consumer spending is impossible to predict with any economic model.',
         'Critics agree that the model works well during periods of steady growth.'], a: 0,
    ex: "The text presents a failure, the critics' view, and then the economist's defense, which gets the final word. The second choice is only the critics' view, and the text never says the critics agree about steady growth." },
  { id: 'rw67', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)', d: 'M',
    passage: `<p>In a novel, the narrator describes her grandmother this way: "She praised every meal she was served, then quietly added salt when she thought no one was watching."</p>`,
    q: "Based on the text, which choice best describes the narrator's grandmother?",
    ch: ['Tactful about her preferences', 'Openly critical of other people', 'Indifferent to the taste of food', 'Unable to cook for herself'], a: 0,
    ex: "She praises the food out loud but fixes it privately. That shows she cares about taste but keeps her opinion to herself to be polite, which is tactful." },

  // ---------- R&W: Standard English Conventions ----------
  { id: 'rw68', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The festival's lineup included bands from Austin, ${B} Portland, Oregon; and Asheville, North Carolina.</p>`,
    q: CONV, ch: ['Texas;', 'Texas,', 'Texas:', 'Texas'], a: 0,
    ex: "When list items already contain commas (city, state), semicolons separate the items. The other items are separated by semicolons, so \"Texas;\" keeps the list consistent." },
  { id: 'rw69', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The expedition's most valuable find—a nearly complete fossil skeleton of an early ${B} was discovered by a graduate student during her first field season.</p>`,
    q: CONV, ch: ['whale—', 'whale,', 'whale;', 'whale'], a: 0,
    ex: "The extra information opens with a dash, so it must close with a dash. A comma or semicolon can't close a dash pair, and leaving it open makes the sentence ungrammatical." },
  { id: 'rw70', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense', d: 'H',
    passage: `<p>Among the artifacts recovered from the shipwreck ${B} a brass navigational instrument and several sealed jars of olive oil.</p>`,
    q: CONV, ch: ['was', 'is', 'were', 'has been'], a: 2,
    ex: "The sentence is inverted: the subject comes after the verb. The subject is \"an instrument and several jars,\" which is plural, so the verb is \"were.\" \"Artifacts\" is inside a prepositional phrase, not the subject." },
  { id: 'rw71', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The novel ${B} won the prize in 1998 has since been translated into more than 40 languages.</p>`,
    q: CONV, ch: ['that', ', which', ', that', 'which,'], a: 0,
    ex: "The clause identifies which novel is meant, so it's essential and takes no commas. \"That\" introduces an essential clause. \", which\" would need a closing comma after 1998." },
  { id: 'rw72', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense', d: 'H',
    passage: `<p>Physicist Chien-Shiung Wu, whose experiments in the 1950s overturned a long-accepted principle of physics, ${B} widely regarded as one of the most important experimental physicists of the twentieth century.</p>`,
    q: CONV, ch: ['being', 'is', 'having been', 'to be'], a: 1,
    ex: "The subject \"Chien-Shiung Wu\" needs a main verb. The long \"whose\" clause between the commas is a distraction. \"Being,\" \"having been,\" and \"to be\" aren't main verbs." },
  { id: 'rw73', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense', d: 'H',
    passage: `<p>Neither the director nor the actors ${B} aware that the final scene would be cut from the film.</p>`,
    q: CONV, ch: ['was', 'were', 'is', 'has been'], a: 1,
    ex: "With \"neither...nor,\" the verb agrees with the closer subject, \"the actors,\" which is plural. The sentence is in the past (\"would be cut\"), so \"were.\"" },
  { id: 'rw74', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The trial produced promising ${B} the researchers cautioned that a larger study was needed before the treatment could be recommended.</p>`,
    q: CONV, ch: ['results; however,', 'results, however,', 'results however,', 'results; however'], a: 0,
    ex: "\"However\" here connects two independent clauses, so it needs a semicolon before it and a comma after. A comma before it creates a comma splice." },

  // ---------- R&W: Expression of Ideas ----------
  { id: 'rw75', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>Many economists predicted that remote work would cause downtown businesses to collapse, and in some cities this has largely happened. ${B} downtown restaurants and shops in other cities have adapted by serving residents rather than office workers, and many are thriving.</p>`,
    q: TRANS, ch: ['By contrast,', 'Consequently,', 'Similarly,', 'In other words,'], a: 0,
    ex: "Collapse in some cities is set against thriving businesses in other cities. That's a contrast." },
  { id: 'rw76', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>The first edition of the encyclopedia was widely praised for its scope. Its accuracy, ${B} was another matter: reviewers found hundreds of errors in its geography entries alone.</p>`,
    q: TRANS, ch: ['however,', 'therefore,', 'for example,', 'similarly,'], a: 0,
    ex: "Praise for scope is followed by criticism of accuracy (\"another matter\"), so the transition must signal contrast." },
  { id: 'rw77', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>The new vaccine must be kept refrigerated, which makes it difficult to distribute in remote areas. ${B} it is highly effective, and health officials are working to develop portable cooling units so that more communities can receive it.</p>`,
    q: TRANS, ch: ['Still,', 'Thus,', 'Likewise,', 'For instance,'], a: 0,
    ex: "The first sentence gives a drawback, and the second turns to a strength despite that drawback. \"Still\" signals that concession." },
  { id: 'rw78', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>Researchers had expected the drug to lower blood pressure in all participants. ${B} it lowered blood pressure only in participants who also exercised regularly.</p>`,
    q: TRANS, ch: ['Instead,', 'Moreover,', 'Similarly,', 'Accordingly,'], a: 0,
    ex: "The actual result replaced the expected one, which \"Instead\" signals. \"Accordingly\" would mean the result followed from the expectation." },
  { id: 'rw79', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis', d: 'H',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Spider silk is a natural fiber produced by spiders.</li>
      <li>Kevlar is a synthetic fiber developed in 1965.</li>
      <li>By weight, spider silk is stronger than steel.</li>
      <li>By weight, Kevlar is also stronger than steel.</li>
      <li>Spider silk can stretch much farther than Kevlar before breaking.</li></ul>`,

(function tagDifficulty() {

       'm1 m2 m3 m4 m17 m18 m19 m26 m5 m6 m8 m28 m29 m31 m35 m10 m12 m39 m41 m13 m42 m43',
    M: 'rw1 rw2 rw18 rw23 rw25 rw6 rw8 rw30 rw31 rw33 rw34 rw36 rw9 rw10 rw11 rw12 rw37 rw40 rw42 rw44 rw45 rw50 rw51 rw52 rw53 ' +
       'm20 m21 m22 m24 m25 m27 m7 m9 m30 m32 m33 m34 m37 m11 m38 m40 m14 m15 m16 m44',
    H: 'rw43 m23 m36'
  };
  const map = {};
  Object.entries(T).forEach(([d, s]) => s.split(' ').forEach(id => map[id] = d));

const DNAME = { E: 'Easy', M: 'Medium', H: 'Hard' };
// Spread correct answers across A–D with a fixed per-question order (same every visit).
// Purely numeric math choices stay in ascending order, as on the real test.
(function spreadAnswers() {
  const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  BANK.forEach(q => {
    if (!q.ch || q.fixed) return;
    const plain = q.ch.map(c => c.replace(/<[^>]+>/g, '').replace(/[$,π]/g, '').replace('−', '-'));
    if (q.sec === 'math' && plain.every(c => /^-?[\d.\/]+$/.test(c))) return;
    let seed = hash(q.id + 'x');
    const order = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; const j = (seed >>> 8) % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }
    q.ch = order.map(k => q.ch[k]);
    q.a = order.indexOf(q.a);
    q.order = order;
  });
})();
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));
