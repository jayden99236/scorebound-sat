  { id: 'm30', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'What is the positive solution to <i>x</i><sup>2</sup> = 4<i>x</i> + 12?',
    spr: 6, ex: 'Rearrange: <i>x</i><sup>2</sup> − 4<i>x</i> − 12 = 0 → (<i>x</i> − 6)(<i>x</i> + 2) = 0. The solutions are 6 and −2, and the positive one is 6.' },
  { id: 'm31', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = 3<sup><i>x</i></sup>. What is the value of <i>f</i>(4)?',
    spr: 81, ex: '3<sup>4</sup> = 3 × 3 × 3 × 3 = 81.' },
  { id: 'm32', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'The functions <i>g</i> and <i>h</i> are defined by <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 1 and <i>h</i>(<i>x</i>) = 2<i>x</i> − 3. What is the value of <i>g</i>(<i>h</i>(2))?',
    spr: 2, ex: 'Work inside out: <i>h</i>(2) = 2(2) − 3 = 1. Then <i>g</i>(1) = 1<sup>2</sup> + 1 = 2.' },
  { id: 'm33', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions',
    q: 'A car valued at $24,000 loses 15% of its value each year. Which function gives the car\'s value <i>V</i>, in dollars, <i>t</i> years from now?',
    ch: ['<i>V</i>(<i>t</i>) = 24,000(0.85)<sup><i>t</i></sup>', '<i>V</i>(<i>t</i>) = 24,000(0.15)<sup><i>t</i></sup>', '<i>V</i>(<i>t</i>) = 24,000(1.15)<sup><i>t</i></sup>', '<i>V</i>(<i>t</i>) = 24,000 − 0.15<i>t</i>'], a: 0,
    ex: 'Losing 15% each year leaves 85% of the value, so you multiply by 0.85 once per year: 24,000(0.85)<sup><i>t</i></sup>. Using 0.15 would keep only 15%.' },
  { id: 'm34', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions',
    q: 'Which expression is equivalent to (2<i>x</i><sup>2</sup> + 3<i>x</i>) − (<i>x</i><sup>2</sup> − 5<i>x</i> + 4)?',
    ch: ['<i>x</i><sup>2</sup> + 8<i>x</i> − 4', '<i>x</i><sup>2</sup> − 2<i>x</i> − 4', '<i>x</i><sup>2</sup> + 8<i>x</i> + 4', '3<i>x</i><sup>2</sup> − 2<i>x</i> + 4'], a: 0,
    ex: 'Distribute the minus sign to every term: 2<i>x</i><sup>2</sup> + 3<i>x</i> − <i>x</i><sup>2</sup> + 5<i>x</i> − 4 = <i>x</i><sup>2</sup> + 8<i>x</i> − 4.' },
  { id: 'm35', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions',
    q: 'For <i>x</i> ≠ 0, which expression is equivalent to (<i>x</i><sup>2</sup> + 6<i>x</i>) ÷ <i>x</i>?',
    ch: ['<i>x</i> + 6', '<i>x</i> + 6<i>x</i>', '<i>x</i><sup>2</sup> + 6', '7<i>x</i>'], a: 0,
    ex: 'Divide each term by <i>x</i>: <i>x</i><sup>2</sup>/<i>x</i> + 6<i>x</i>/<i>x</i> = <i>x</i> + 6.' },
  { id: 'm36', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'For what value of the constant <i>c</i> does the equation <i>x</i><sup>2</sup> + 6<i>x</i> + <i>c</i> = 0 have exactly one real solution?',
    spr: 9, ex: 'One real solution means the discriminant is zero: 6<sup>2</sup> − 4(1)(<i>c</i>) = 0 → 36 = 4<i>c</i> → <i>c</i> = 9. Then the equation is (<i>x</i> + 3)<sup>2</sup> = 0.' },
  { id: 'm37', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations',
    q: 'If √(<i>x</i> + 3) = 5, what is the value of <i>x</i>?',
    spr: 22, ex: 'Square both sides: <i>x</i> + 3 = 25, so <i>x</i> = 22. Check: √25 = 5.' },

  // ---------- Math: Problem-Solving and Data Analysis (added) ----------
  { id: 'm38', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Rates and units',
    q: 'A printer prints 18 pages in 45 seconds. At this rate, how many pages can it print in 5 minutes?',
    spr: 120, ex: '18 ÷ 45 = 0.4 pages per second. 5 minutes = 300 seconds, and 0.4 × 300 = 120.' },
  { id: 'm39', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'One-variable data',
    q: 'What is the median of the data set 3, 7, 7, 9, 12, 15?',
    spr: 8, ex: 'With six values, the median is the mean of the two middle values: (7 + 9) ÷ 2 = 8.' },
  { id: 'm40', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Probability',
    q: 'A survey asked 140 students in grades 11 and 12 whether they prefer sports or arts activities. The results are shown below.<div class="tablescroll"><table><thead><tr><th></th><th>Sports</th><th>Arts</th><th>Total</th></tr></thead><tbody><tr><td>Grade 11</td><td>40</td><td>20</td><td>60</td></tr><tr><td>Grade 12</td><td>30</td><td>50</td><td>80</td></tr></tbody></table></div>If a grade 12 student from the survey is selected at random, what is the probability that the student prefers arts?',
    ch: ['5/14', '3/8', '5/8', '5/7'], a: 2,
    ex: 'The question limits you to grade 12 students (80 of them). 50 of those prefer arts: 50/80 = 5/8. 5/14 uses all 140 students, which is a common trap.' },
  { id: 'm41', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Ratios and proportions',
    q: 'A recipe uses 3 cups of flour for every 2 cups of sugar. If a baker uses 12 cups of flour, how many cups of sugar should be used?',
    spr: 8, ex: '12 cups of flour is 4 times 3, so use 4 × 2 = 8 cups of sugar.' },

  // ---------- Math: Geometry and Trigonometry (added) ----------
  { id: 'm42', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Lines and angles',
    q: 'Two angles are supplementary. The measure of one angle is 4 times the measure of the other. What is the measure, in degrees, of the smaller angle?',
    spr: 36, ex: 'Supplementary angles add to 180°: <i>x</i> + 4<i>x</i> = 180 → 5<i>x</i> = 180 → <i>x</i> = 36.' },
  { id: 'm43', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Area and volume',
    q: 'A right circular cylinder has a radius of 3 and a height of 10. What is its volume?',
    ch: ['30π', '60π', '90π', '900π'], a: 2,
    ex: 'V = π<i>r</i><sup>2</sup><i>h</i> = π(9)(10) = 90π.' },
  { id: 'm44', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Similar triangles',
    q: 'Triangle <i>ABC</i> is similar to triangle <i>DEF</i>, with <i>A</i>, <i>B</i>, and <i>C</i> corresponding to <i>D</i>, <i>E</i>, and <i>F</i>. If <i>AB</i> = 4, <i>DE</i> = 10, and <i>BC</i> = 6, what is <i>EF</i>?',
    spr: 15, ex: 'The scale factor is 10/4 = 2.5. <i>EF</i> = 6 × 2.5 = 15.' },

  // ====== Harder questions (feed the adaptive Module 2) ======
  // ---------- R&W: Craft and Structure ----------
  { id: 'rw55', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context', d: 'H',
    passage: `<p>In her study of nineteenth-century trade networks, the historian resists the ${B} impulse to credit a single merchant family with the region's prosperity, instead tracing how dozens of small traders contributed to it.</p>`,
    q: WIC, ch: ['reductive', 'meticulous', 'altruistic', 'contrarian'], a: 0,
    ex: "Giving one family all the credit oversimplifies a story that involved dozens of traders. Reductive means oversimplifying something complex." },
  { id: 'rw56', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context', d: 'H',
    passage: `<p>Critics who dismissed the sculptor's late work as merely ${B} overlooked its formal daring: although the pieces reuse motifs from her earlier career, they recombine those motifs in ways that upend their original meanings.</p>`,
    q: WIC, ch: ['derivative', 'inscrutable', 'ephemeral', 'austere'], a: 0,
    ex: "The critics' complaint is tied to the work reusing earlier motifs. Derivative means copied from or based on earlier work, which the author argues misses how the pieces transform those motifs." },
  { id: 'rw57', sec: 'rw', dom: 'Craft and Structure', skill: 'Words in Context', d: 'H',
    passage: `<p>The committee's endorsement of the proposal was ${B} at best: members approved it only after attaching so many conditions that its original goals were nearly unrecognizable.</p>`,
    q: WIC, ch: ['qualified', 'unequivocal', 'premature', 'clandestine'], a: 0,
    ex: "Approval that comes with many conditions is limited or partial, which is what qualified means. Unequivocal (without reservation) is the opposite." },
  { id: 'rw58', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose', d: 'H',
    passage: `<p>Biologists have long assumed that the bright coloring of poison dart frogs evolved only as a warning to predators. Yet a recent study of one species found that females consistently chose brighter males as mates, even when duller males were equally healthy. The researchers don't dispute the warning function; rather, they suggest that mate choice may have reinforced it.</p>`,
    q: 'Which choice best describes the overall structure of the text?',
    ch: ['It presents a long-held explanation, describes a finding that complicates it, and proposes that a second factor also played a role.',
         'It presents a long-held explanation and then describes evidence that disproves it entirely.',
         'It describes two competing studies and argues that one of them is flawed.',
         'It explains a behavior and then lists several exceptions to it.'], a: 0,
    ex: "The researchers \"don't dispute the warning function,\" so the old explanation isn't thrown out. They add mate choice as a second factor. That rules out the \"disproves it entirely\" choice." },
  { id: 'rw59', sec: 'rw', dom: 'Craft and Structure', skill: 'Cross-Text Connections', d: 'H',
    passage: `<p><b>Text 1</b><br>Many scholars treat the letters of the novelist Edith Marlowe as a reliable guide to her intentions, citing her detailed descriptions of how she planned each book.</p>
      <p><b>Text 2</b><br>Marlowe's letters were written to her publisher, who controlled her advances. It would be naive to assume she never shaped her account of her methods to reassure him that each manuscript was carefully planned, and therefore marketable.</p>`,
    q: 'Based on the texts, how would the author of Text 2 most likely respond to the scholars in Text 1?',
    ch: ["By cautioning that the letters may reflect Marlowe's practical motives rather than simply her actual methods",
         'By arguing that Marlowe never planned any of her novels',
         'By agreeing that the letters are the most reliable source on her intentions',
         "By claiming that Marlowe's publisher wrote the letters himself"], a: 0,
    ex: "Text 2 suggests Marlowe had a reason (her advances) to present herself as a careful planner, so the letters may not be a neutral record. It never goes as far as saying she didn't plan at all." },
  { id: 'rw60', sec: 'rw', dom: 'Craft and Structure', skill: 'Text Structure and Purpose', d: 'M',
    passage: `<p>Some city officials argue that widening highways reduces traffic. However, studies in several cities have found that within a few years of widening, traffic returns to its earlier levels, because the added space encourages more people to drive. Economists call this effect induced demand.</p>`,
    q: 'Which choice best describes the function of the third sentence in the overall structure of the text?',
    ch: ['It names the effect described in the previous sentence.',
         'It offers a counterargument to the studies just mentioned.',
         'It proposes a solution to the traffic problem.',
         'It questions how the studies were carried out.'], a: 0,
    ex: "The second sentence describes the effect (extra lanes attract more drivers). The third sentence just gives it a name: induced demand." },

  // ---------- R&W: Information and Ideas ----------
  { id: 'rw61', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences', d: 'H',
    passage: `<p>Archaeologists excavating a Bronze Age settlement found that pottery in the oldest layers was made from local clay, while pottery in later layers was made from clay found only 300 kilometers away. Because the later pottery shows the same shaping and firing techniques as the earlier pottery, the researchers argue that ${B}</p>`,
    q: LOGIC,
    ch: ["the settlement's potters likely obtained distant clay and shaped it themselves using familiar methods.",
         'the settlement was abandoned and later resettled by people from 300 kilometers away.',
         'the local clay had become unusable by the time the later layers formed.',
         'the later pots were made in distant workshops and traded to the settlement as finished goods.'], a: 0,
    ex: "Same techniques suggest the same local potters. Distant clay suggests the raw material came from far away. Together, local potters were working imported clay. New settlers or outside workshops would likely bring different techniques." },
  { id: 'rw62', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)', d: 'H',
    passage: `<p>An ecologist hypothesizes that the decline of a songbird species in a forest is caused mainly by new roads that break up its habitat, rather than by a decline in the insects it eats.</p>`,
    q: "Which finding, if true, would most directly support the ecologist's hypothesis?",
    ch: ['Insect populations in the forest have stayed stable, while the songbird has declined most sharply in areas near new roads.',
         'The songbird has declined equally across the forest, and insect populations have also fallen.',
         'Several other bird species in the forest also feed on insects.',
         'Most of the roads in the forest were built within the past decade.'], a: 0,
    ex: "To favor roads over insects, you need evidence that rules out insects (they're stable) and links the decline to roads (sharpest near them). The first choice does both. The second points toward insects instead." },
  { id: 'rw63', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)', d: 'H',
    passage: `<p>A researcher claims that the opening of a new public library in Hartwell caused an increase in reading among the city's teenagers, pointing to a 30 percent rise in teen library card sign-ups since the library opened.</p>`,
    q: "Which finding, if true, would most directly weaken the researcher's claim?",
    ch: ['Teen library card sign-ups rose by about 30 percent over the same period in nearby cities that did not open new libraries.',
         'The new library has a large section of books written for teenagers.',
         'Teen visits to the library rose steadily after it opened.',
         'Teenagers surveyed said they enjoy the events held at the new library.'], a: 0,
    ex: "If sign-ups rose just as much in cities without a new library, something else is likely behind the rise. The other findings are consistent with the claim." },
  { id: 'rw64', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Quantitative)', d: 'H',
    passage: `<div class="tablescroll"><table><caption>Average daily screen time (hours)</caption>
      <thead><tr><th>Group</th><th>Before</th><th>After 4 weeks</th></tr></thead>
      <tbody><tr><td>A (took the program)</td><td class="n">6.2</td><td class="n">4.1</td></tr><tr><td>B (did not)</td><td class="n">6.0</td><td class="n">5.8</td></tr></tbody></table></div>
      <p>Researchers concluded that the program itself, rather than some other factor affecting all participants, reduced screen time.</p>`,
    q: "Which choice most effectively uses data from the table to support the researchers' conclusion?",
    ch: ["Group A's screen time fell by about 2.1 hours, while Group B's fell by only about 0.2 hours.",
         'Both groups started with similar screen time, about 6 hours per day.',
         "Group B's screen time after four weeks was 5.8 hours per day.",
         'Screen time decreased in both groups over the four weeks.'], a: 0,
    ex: "To credit the program rather than a shared factor, you need to compare the change in the group that took it with the change in the group that didn't. Only the first choice makes that comparison (2.1 vs 0.2 hours). The last choice actually suggests a shared factor." },
  { id: 'rw65', sec: 'rw', dom: 'Information and Ideas', skill: 'Inferences', d: 'H',
    passage: `<p>Plants grown beside a highway flowered about a week earlier than identical plants grown in a field 2 kilometers away. The air near the highway was about 2°C warmer, but it also contained higher levels of nitrogen compounds from vehicle exhaust, which can act as fertilizer. The researchers therefore caution that ${B}</p>`,
    q: LOGIC,
    ch: ['the earlier flowering cannot yet be attributed to temperature alone.',
         'highways should be moved away from areas where plants grow.',
         'nitrogen compounds are known to delay flowering in most plants.',
         'temperature has no effect on when plants flower.'], a: 0,
    ex: "Two things differed near the highway (warmth and nitrogen), so either could explain early flowering. That's why the researchers can't credit temperature alone. Saying temperature has \"no effect\" goes too far." },
  { id: 'rw66', sec: 'rw', dom: 'Information and Ideas', skill: 'Central Ideas and Details', d: 'H',
    passage: `<p>The economist's model accurately predicted consumer spending during periods of steady growth, but it failed to anticipate the sharp drop in spending that followed the 2008 financial crisis. Her critics see this failure as proof that the model is fundamentally flawed. She counters that no model built on decades of ordinary economic behavior could be expected to capture a rare shock, and that the model remains useful for the conditions it was designed to describe.</p>`,
    q: 'Which choice best states the main idea of the text?',
    ch: ["An economist defends her model's usefulness despite its failure to predict an unusual event.",
         "The economist's model is fundamentally flawed and should no longer be used.",
         'Consumer spending is impossible to predict with any economic model.',
         'Critics agree that the model works well during periods of steady growth.'], a: 0,
    ex: "The text presents a failure, the critics' view, and then the economist's defense, which gets the final word. The second choice is only the critics' view, and the text never says the critics agree about steady growth." },
  { id: 'rw67', sec: 'rw', dom: 'Information and Ideas', skill: 'Command of Evidence (Textual)', d: 'M',
    passage: `<p>In a novel, the narrator describes her grandmother this way: "She praised every meal she was served, then quietly added salt when she thought no one was watching."</p>`,
    q: "Based on the text, which choice best describes the narrator's grandmother?",
    ch: ['Tactful about her preferences', 'Openly critical of other people', 'Indifferent to the taste of food', 'Unable to cook for herself'], a: 0,
    ex: "She praises the food out loud but fixes it privately. That shows she cares about taste but keeps her opinion to herself to be polite, which is tactful." },

  // ---------- R&W: Standard English Conventions ----------
  { id: 'rw68', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The festival's lineup included bands from Austin, ${B} Portland, Oregon; and Asheville, North Carolina.</p>`,
    q: CONV, ch: ['Texas;', 'Texas,', 'Texas:', 'Texas'], a: 0,
    ex: "When list items already contain commas (city, state), semicolons separate the items. The other items are separated by semicolons, so \"Texas;\" keeps the list consistent." },
  { id: 'rw69', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The expedition's most valuable find—a nearly complete fossil skeleton of an early ${B} was discovered by a graduate student during her first field season.</p>`,
    q: CONV, ch: ['whale—', 'whale,', 'whale;', 'whale'], a: 0,
    ex: "The extra information opens with a dash, so it must close with a dash. A comma or semicolon can't close a dash pair, and leaving it open makes the sentence ungrammatical." },
  { id: 'rw70', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense', d: 'H',
    passage: `<p>Among the artifacts recovered from the shipwreck ${B} a brass navigational instrument and several sealed jars of olive oil.</p>`,
    q: CONV, ch: ['was', 'is', 'were', 'has been'], a: 2,
    ex: "The sentence is inverted: the subject comes after the verb. The subject is \"an instrument and several jars,\" which is plural, so the verb is \"were.\" \"Artifacts\" is inside a prepositional phrase, not the subject." },
  { id: 'rw71', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The novel ${B} won the prize in 1998 has since been translated into more than 40 languages.</p>`,
    q: CONV, ch: ['that', ', which', ', that', 'which,'], a: 0,
    ex: "The clause identifies which novel is meant, so it's essential and takes no commas. \"That\" introduces an essential clause. \", which\" would need a closing comma after 1998." },
  { id: 'rw72', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense', d: 'H',
    passage: `<p>Physicist Chien-Shiung Wu, whose experiments in the 1950s overturned a long-accepted principle of physics, ${B} widely regarded as one of the most important experimental physicists of the twentieth century.</p>`,
    q: CONV, ch: ['being', 'is', 'having been', 'to be'], a: 1,
    ex: "The subject \"Chien-Shiung Wu\" needs a main verb. The long \"whose\" clause between the commas is a distraction. \"Being,\" \"having been,\" and \"to be\" aren't main verbs." },
  { id: 'rw73', sec: 'rw', dom: 'Standard English Conventions', skill: 'Form, Structure, and Sense', d: 'H',
    passage: `<p>Neither the director nor the actors ${B} aware that the final scene would be cut from the film.</p>`,
    q: CONV, ch: ['was', 'were', 'is', 'has been'], a: 1,
    ex: "With \"neither...nor,\" the verb agrees with the closer subject, \"the actors,\" which is plural. The sentence is in the past (\"would be cut\"), so \"were.\"" },
  { id: 'rw74', sec: 'rw', dom: 'Standard English Conventions', skill: 'Boundaries', d: 'H',
    passage: `<p>The trial produced promising ${B} the researchers cautioned that a larger study was needed before the treatment could be recommended.</p>`,
    q: CONV, ch: ['results; however,', 'results, however,', 'results however,', 'results; however'], a: 0,
    ex: "\"However\" here connects two independent clauses, so it needs a semicolon before it and a comma after. A comma before it creates a comma splice." },

  // ---------- R&W: Expression of Ideas ----------
  { id: 'rw75', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>Many economists predicted that remote work would cause downtown businesses to collapse, and in some cities this has largely happened. ${B} downtown restaurants and shops in other cities have adapted by serving residents rather than office workers, and many are thriving.</p>`,
    q: TRANS, ch: ['By contrast,', 'Consequently,', 'Similarly,', 'In other words,'], a: 0,
    ex: "Collapse in some cities is set against thriving businesses in other cities. That's a contrast." },
  { id: 'rw76', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>The first edition of the encyclopedia was widely praised for its scope. Its accuracy, ${B} was another matter: reviewers found hundreds of errors in its geography entries alone.</p>`,
    q: TRANS, ch: ['however,', 'therefore,', 'for example,', 'similarly,'], a: 0,
    ex: "Praise for scope is followed by criticism of accuracy (\"another matter\"), so the transition must signal contrast." },
  { id: 'rw77', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>The new vaccine must be kept refrigerated, which makes it difficult to distribute in remote areas. ${B} it is highly effective, and health officials are working to develop portable cooling units so that more communities can receive it.</p>`,
    q: TRANS, ch: ['Still,', 'Thus,', 'Likewise,', 'For instance,'], a: 0,
    ex: "The first sentence gives a drawback, and the second turns to a strength despite that drawback. \"Still\" signals that concession." },
  { id: 'rw78', sec: 'rw', dom: 'Expression of Ideas', skill: 'Transitions', d: 'H',
    passage: `<p>Researchers had expected the drug to lower blood pressure in all participants. ${B} it lowered blood pressure only in participants who also exercised regularly.</p>`,
    q: TRANS, ch: ['Instead,', 'Moreover,', 'Similarly,', 'Accordingly,'], a: 0,
    ex: "The actual result replaced the expected one, which \"Instead\" signals. \"Accordingly\" would mean the result followed from the expectation." },
  { id: 'rw79', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis', d: 'H',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Spider silk is a natural fiber produced by spiders.</li>
      <li>Kevlar is a synthetic fiber developed in 1965.</li>
      <li>By weight, spider silk is stronger than steel.</li>
      <li>By weight, Kevlar is also stronger than steel.</li>
      <li>Spider silk can stretch much farther than Kevlar before breaking.</li></ul>`,
    q: 'The student wants to emphasize a similarity between spider silk and Kevlar. Which choice most effectively uses relevant information from the notes to accomplish this goal?',
    ch: ['By weight, both spider silk and Kevlar are stronger than steel.',
         'Spider silk can stretch much farther than Kevlar before breaking.',
         'Unlike spider silk, Kevlar is a synthetic fiber, first developed in 1965.',
         'Spider silk, a natural fiber produced by spiders, is stronger than steel by weight.'], a: 0,
    ex: "Only the first choice states something both fibers share. Two choices describe differences, and the last one mentions only spider silk." },
  { id: 'rw80', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis', d: 'H',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Coral bleaching occurs when corals expel the algae living in their tissues.</li>
      <li>Bleaching is often triggered by high water temperatures.</li>
      <li>A team of researchers tested whether heat-tolerant algae could help corals resist bleaching.</li>
      <li>Corals hosting heat-tolerant algae bleached less during a simulated heat wave.</li></ul>`,
    q: "The student wants to explain the aim of the research to an audience unfamiliar with coral bleaching. Which choice most effectively uses relevant information from the notes to accomplish this goal?",
    ch: ['Researchers tested whether heat-tolerant algae could help corals resist bleaching, which happens when corals expel the algae in their tissues, often because of high water temperatures.',
         'Corals hosting heat-tolerant algae bleached less during a simulated heat wave.',
         'Coral bleaching is often triggered by high water temperatures.',
         'Researchers studied a process in which corals expel algae.'], a: 0,
    ex: "The goal has two parts: state the aim and explain bleaching for newcomers. Only the first choice does both. The second gives a result, not the aim." },
  { id: 'rw81', sec: 'rw', dom: 'Expression of Ideas', skill: 'Rhetorical Synthesis', d: 'H',
    passage: `<p>While researching a topic, a student has taken the following notes:</p>
      <ul><li>Poet Lena Ortiz published her first collection in 1990.</li>
      <li>Her early poems used strict rhyme and meter.</li>
      <li>Her poems written after 2010 are in free verse.</li>
      <li>She has won two national poetry awards.</li></ul>`,
    q: "The student wants to contrast the form of Ortiz's early and later poems. Which choice most effectively uses relevant information from the notes to accomplish this goal?",
    ch: ["Whereas Ortiz's early poems used strict rhyme and meter, her poems written after 2010 are in free verse.",
         'Ortiz, who published her first collection in 1990, has won two national poetry awards.',
         "Ortiz's poems written after 2010 are in free verse.",
         "Ortiz's early poems used strict rhyme and meter, and she has won two national poetry awards."], a: 0,
    ex: "A contrast needs both forms, early and later, set against each other. Only the \"Whereas\" choice does that." },

  // ---------- Math: Algebra ----------
  { id: 'm45', sec: 'math', dom: 'Algebra', skill: 'Linear equations in one variable', d: 'H',
    q: 'In the equation 4(<i>x</i> − <i>a</i>) + 2 = 4<i>x</i> − 10, <i>a</i> is a constant. If the equation has infinitely many solutions, what is the value of <i>a</i>?',
    spr: 3, ex: 'Expand: 4<i>x</i> − 4<i>a</i> + 2 = 4<i>x</i> − 10. The <i>x</i> terms match, so infinitely many solutions requires −4<i>a</i> + 2 = −10, giving <i>a</i> = 3.' },
  { id: 'm46', sec: 'math', dom: 'Algebra', skill: 'Linear equations in two variables', d: 'H',
    q: 'The line <i>y</i> = <i>kx</i> + 4, where <i>k</i> is a constant, passes through the point (−2, 10). What is the <i>x</i>-coordinate of the line\'s <i>x</i>-intercept?',
    spr: 4 / 3, key: '4/3', ex: '10 = −2<i>k</i> + 4 → <i>k</i> = −3. Set <i>y</i> = 0: 0 = −3<i>x</i> + 4 → <i>x</i> = 4/3. (1.333 is also accepted.)' },
  { id: 'm47', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations', d: 'M',
    q: 'A store sells notebooks for $3 each and binders for $7 each. Mia bought 10 items and spent exactly $50. How many binders did she buy?',
    spr: 5, ex: '<i>n</i> + <i>b</i> = 10 and 3<i>n</i> + 7<i>b</i> = 50. Substitute <i>n</i> = 10 − <i>b</i>: 30 + 4<i>b</i> = 50 → <i>b</i> = 5.' },
  { id: 'm48', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations', d: 'H',
    q: '2<i>x</i> − 5<i>y</i> = 7<br><i>ax</i> + 15<i>y</i> = −21<br><br>In the system above, <i>a</i> is a constant. If the system has infinitely many solutions, what is the value of <i>a</i>?',
    spr: -6, ex: 'Infinitely many solutions means one equation is a multiple of the other. Going from −5<i>y</i> to 15<i>y</i> multiplies by −3, and 7 × (−3) = −21 checks out. So <i>a</i> = 2 × (−3) = −6.' },
  { id: 'm49', sec: 'math', dom: 'Algebra', skill: 'Linear inequalities', d: 'H',
    q: 'Which point (<i>x</i>, <i>y</i>) is a solution to the system of inequalities <i>y</i> &gt; 2<i>x</i> − 3 and <i>y</i> &lt; −<i>x</i> + 6?',
    ch: ['(4, 4)', '(3, 2)', '(1, 4)', '(−1, 8)'], a: 2, fixed: true,
    ex: 'Test (1, 4): 4 &gt; 2(1) − 3 = −1 ✓ and 4 &lt; −1 + 6 = 5 ✓. (4, 4) fails the first inequality (4 &gt; 5 is false), (3, 2) fails it too (2 &gt; 3), and (−1, 8) fails the second (8 &lt; 7).' },
  { id: 'm50', sec: 'math', dom: 'Algebra', skill: 'Linear functions', d: 'H',
    q: 'A tank holds 500 liters of water and drains at a constant rate. After 8 minutes, it holds 340 liters. How many minutes after draining begins will the tank be empty?',
    spr: 25, ex: 'It loses 160 liters in 8 minutes, or 20 liters per minute. 500 ÷ 20 = 25 minutes.' },
  { id: 'm51', sec: 'math', dom: 'Algebra', skill: 'Systems of linear equations', d: 'H',
    q: '3<i>x</i> + 2<i>y</i> = 11<br><i>x</i> − 2<i>y</i> = 1<br><br>If (<i>x</i>, <i>y</i>) satisfies the system above, what is the value of 4<i>x</i>?',
    spr: 12, ex: 'Add the equations: the <i>y</i> terms cancel and 4<i>x</i> = 12. No need to solve for <i>x</i> first.' },
  { id: 'm52', sec: 'math', dom: 'Algebra', skill: 'Linear equations in two variables', d: 'H',
    q: 'Line ℓ is perpendicular to the line 2<i>x</i> + 3<i>y</i> = 6 and passes through the point (4, 1). What is the <i>y</i>-coordinate of the <i>y</i>-intercept of line ℓ?',
    spr: -5, ex: 'The given line has slope −2/3, so ℓ has slope 3/2. <i>y</i> − 1 = (3/2)(<i>x</i> − 4) → <i>y</i> = 1.5<i>x</i> − 5. The <i>y</i>-intercept is −5.' },
  { id: 'm53', sec: 'math', dom: 'Algebra', skill: 'Linear inequalities', d: 'H',
    q: 'A company\'s annual revenue <i>R</i>, in thousands of dollars, is modeled by <i>R</i> = 12<i>t</i> + 150, where <i>t</i> is the number of years since 2015. According to the model, in what year will revenue first exceed $300,000?',
    spr: 2028, ex: '$300,000 is 300 thousand. 12<i>t</i> + 150 &gt; 300 → <i>t</i> &gt; 12.5. The first whole year after that is <i>t</i> = 13, which is 2015 + 13 = 2028.' },

  // ---------- Math: Advanced Math ----------
  { id: 'm54', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations', d: 'H',
    q: 'The equation <i>x</i><sup>2</sup> + <i>bx</i> + 16 = 0, where <i>b</i> is a constant, has 2 as one of its solutions. What is the other solution?',
    spr: 8, ex: 'For <i>x</i><sup>2</sup> + <i>bx</i> + <i>c</i>, the product of the solutions is <i>c</i> = 16. So 2 × <i>r</i> = 16 and <i>r</i> = 8. (Then <i>b</i> = −10.)' },
  { id: 'm55', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions', d: 'H',
    q: 'The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = (<i>x</i> − 3)(<i>x</i> + 5). For what value of <i>x</i> does <i>f</i>(<i>x</i>) reach its minimum?',
    spr: -1, ex: 'A parabola\'s vertex is halfway between its zeros. The zeros are 3 and −5, and (3 + (−5)) ÷ 2 = −1.' },
  { id: 'm56', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions', d: 'H',
    q: 'The graph of <i>g</i>(<i>x</i>) = <i>a</i>(<i>x</i> − 2)<sup>2</sup> + 7, where <i>a</i> is a constant, passes through the point (4, −5). What is the value of <i>a</i>?',
    spr: -3, ex: '−5 = <i>a</i>(4 − 2)<sup>2</sup> + 7 → −5 = 4<i>a</i> + 7 → 4<i>a</i> = −12 → <i>a</i> = −3.' },
  { id: 'm57', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations', d: 'H',
    q: 'If 9<sup><i>x</i></sup> = 27, what is the value of <i>x</i>?',
    spr: 1.5, key: '3/2', ex: 'Write both sides as powers of 3: 3<sup>2<i>x</i></sup> = 3<sup>3</sup>, so 2<i>x</i> = 3 and <i>x</i> = 3/2 (or 1.5).' },
  { id: 'm58', sec: 'math', dom: 'Advanced Math', skill: 'Equivalent expressions', d: 'H',
    q: 'Which expression is equivalent to (<i>x</i><sup>2</sup> − 4) ÷ (<i>x</i><sup>2</sup> + 4<i>x</i> + 4), for <i>x</i> ≠ −2?',
    ch: ['(<i>x</i> − 2) ÷ (<i>x</i> + 2)', '(<i>x</i> + 2) ÷ (<i>x</i> − 2)', '−1', '(<i>x</i> − 4) ÷ (4<i>x</i> + 4)'], a: 0,
    ex: 'Factor: (<i>x</i> − 2)(<i>x</i> + 2) ÷ (<i>x</i> + 2)<sup>2</sup>. Cancel one factor of (<i>x</i> + 2) to get (<i>x</i> − 2) ÷ (<i>x</i> + 2). You can\'t cancel the <i>x</i><sup>2</sup> terms directly.' },
  { id: 'm59', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear equations', d: 'H',
    q: 'How many real solutions does the equation 2<i>x</i><sup>2</sup> − 4<i>x</i> + 5 = 0 have?',
    ch: ['Zero', 'Exactly one', 'Exactly two', 'Infinitely many'], a: 0, fixed: true,
    ex: 'The discriminant is <i>b</i><sup>2</sup> − 4<i>ac</i> = 16 − 40 = −24. A negative discriminant means no real solutions.' },
  { id: 'm60', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions', d: 'H',
    q: 'The function <i>P</i>(<i>t</i>) = 1,200(1.05)<sup><i>t</i></sup> models the population of a town <i>t</i> years after 2020. Which statement is true according to the model?',
    ch: ['The population increases by 5% each year.', 'The population increases by 1.05 people each year.',
         'The population increases by 60 people each year.', 'The population in 2020 was 1,260.'], a: 0,
    ex: 'A growth factor of 1.05 means each year\'s population is 105% of the year before, a 5% increase. "60 people each year" describes linear growth, and at <i>t</i> = 0 the population is 1,200.' },
  { id: 'm61', sec: 'math', dom: 'Advanced Math', skill: 'Systems of nonlinear equations', d: 'H',
    q: '<i>y</i> = <i>x</i><sup>2</sup> − 4<i>x</i> + 7<br><i>y</i> = 2<i>x</i> − 2<br><br>If (<i>x</i>, <i>y</i>) is a solution to the system above, what is the value of <i>x</i>?',
    spr: 3, ex: 'Set equal: <i>x</i><sup>2</sup> − 4<i>x</i> + 7 = 2<i>x</i> − 2 → <i>x</i><sup>2</sup> − 6<i>x</i> + 9 = 0 → (<i>x</i> − 3)<sup>2</sup> = 0, so <i>x</i> = 3. The line is tangent to the parabola.' },
  { id: 'm62', sec: 'math', dom: 'Advanced Math', skill: 'Nonlinear functions', d: 'H',
    q: 'The polynomial <i>p</i> is defined by <i>p</i>(<i>x</i>) = <i>x</i><sup>3</sup> − 2<i>x</i><sup>2</sup> − 9<i>x</i> + 18. Which of the following is a factor of <i>p</i>(<i>x</i>)?',
    ch: ['<i>x</i> + 2', '<i>x</i> − 2', '<i>x</i> + 1', '<i>x</i> − 9'], a: 1,
    ex: '(<i>x</i> − <i>r</i>) is a factor exactly when <i>p</i>(<i>r</i>) = 0. <i>p</i>(2) = 8 − 8 − 18 + 18 = 0. Grouping confirms it: <i>x</i><sup>2</sup>(<i>x</i> − 2) − 9(<i>x</i> − 2) = (<i>x</i> − 2)(<i>x</i> − 3)(<i>x</i> + 3).' },

  // ---------- Math: Problem-Solving and Data Analysis ----------
  { id: 'm63', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Percentages', d: 'H',
    q: 'The price of a bicycle was increased by 20% and then the new price was decreased by 20%. The final price is what percent of the original price?',
    spr: 96, ex: '1.20 × 0.80 = 0.96, so the final price is 96% of the original. The changes don\'t cancel because the 20% decrease applies to a larger amount.' },
  { id: 'm64', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'One-variable data', d: 'H',
    q: 'A data set of 10 values has a mean of 12. When the value 30 is removed from the data set, what is the mean of the remaining values?',
    spr: 10, ex: 'The original sum is 10 × 12 = 120. Removing 30 leaves 90 across 9 values: 90 ÷ 9 = 10.' },

  // ---------- Math: Geometry and Trigonometry ----------
  { id: 'm65', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Circles', d: 'H',
    q: 'In the <i>xy</i>-plane, the graph of <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> − 6<i>x</i> + 8<i>y</i> = 0 is a circle. What is the radius of the circle?',
    spr: 5, ex: 'Complete the square: (<i>x</i><sup>2</sup> − 6<i>x</i> + 9) + (<i>y</i><sup>2</sup> + 8<i>y</i> + 16) = 25, so (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 25 and the radius is 5.' },
  { id: 'm66', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Circles', d: 'H',
    q: 'A circle has a radius of 6. What is the length of an arc of the circle with a central angle of 120°?',
    ch: ['2π', '4π', '6π', '12π'], a: 1,
    ex: '120° is 1/3 of 360°. The circumference is 2π(6) = 12π, and 1/3 of that is 4π.' },
  // ---------- Expansion: thin subtopics ----------
  { id: 'rw82', sec: 'rw', dom: 'Craft and Structure', skill: 'Cross-Text Connections', d: 'M',
    passage: `<p><b>Text 1</b><br>Some historians describe the printing press as a machine that transformed European literacy almost overnight. Once books became cheap to produce, they argue, ordinary people quickly learned to read.</p>
      <p><b>Text 2</b><br>Parish and census records show that literacy rates in most European regions rose slowly for nearly two centuries after the printing press appeared. The spread of local schools and the falling price of paper appear to have mattered at least as much as the press itself.</p>`,
    q: 'Based on the texts, how would the author of Text 2 most likely respond to the historians in Text 1?',
    ch: ['By arguing that the rise in literacy was more gradual and had more causes than the historians suggest',
         'By agreeing that the printing press transformed literacy almost overnight',
         'By claiming that the printing press had no effect on literacy at all',
         'By asserting that schools mattered less than the price of paper'],
    a: 0,
    ex: 'Text 1 claims a fast change driven by the press. Text 2 shows a slow rise "for nearly two centuries" and adds other causes (schools, paper). Text 2 never says the press had no effect, only that other factors mattered "at least as much."' },
  { id: 'rw83', sec: 'rw', dom: 'Craft and Structure', skill: 'Cross-Text Connections', d: 'H',
    passage: `<p><b>Text 1</b><br>City planners often propose widening highways to relieve traffic congestion. Adding lanes, they reason, gives the same number of cars more room and so shortens commutes.</p>
      <p><b>Text 2</b><br>Transportation researchers have documented a pattern called induced demand. When a highway is widened, travel becomes easier for a while, so more people choose to drive and take more trips. Within a few years, traffic on many widened roads returns to its earlier levels.</p>`,
    q: 'Based on the texts, how would the researchers in Text 2 most likely respond to the reasoning of the planners in Text 1?',
    ch: ['By pointing out that the reasoning assumes the number of cars stays the same, even though widening a road tends to attract more drivers',
         'By agreeing that adding lanes is the most reliable way to shorten commutes permanently',
         'By arguing that widening a highway reduces the number of people who choose to drive',
         'By claiming that highway width has no effect on how people decide to travel'],
    a: 0,
    ex: 'The planners assume "the same number of cars" will have more room. Text 2 shows that assumption fails: easier travel draws more drivers, and traffic returns. Text 2 says width does change behavior, so the last two choices contradict it.' },

  // Advanced Math: Systems of nonlinear equations
  { id: 'm67', sec: 'math', dom: 'Advanced Math', skill: 'Systems of nonlinear equations', d: 'E',
    q: '<i>y</i> = <i>x</i><sup>2</sup><br><i>y</i> = 9<br><br>If (<i>x</i>, <i>y</i>) is a solution to the system above and <i>x</i> &gt; 0, what is the value of <i>x</i>?',
    spr: 3, ex: 'Substitute <i>y</i> = 9: <i>x</i><sup>2</sup> = 9, so <i>x</i> = 3 or <i>x</i> = −3. The question asks for the positive value, 3.' },
  { id: 'm68', sec: 'math', dom: 'Advanced Math', skill: 'Systems of nonlinear equations', d: 'M',
    q: '<i>y</i> = <i>x</i><sup>2</sup> + 1<br><i>y</i> = <i>x</i> + 3<br><br>The system above has two solutions. What is the sum of the <i>x</i>-coordinates of the two solutions?',
    spr: 1, ex: 'Set the right sides equal: <i>x</i><sup>2</sup> + 1 = <i>x</i> + 3 → <i>x</i><sup>2</sup> − <i>x</i> − 2 = 0 → (<i>x</i> − 2)(<i>x</i> + 1) = 0. The <i>x</i>-values are 2 and −1, and their sum is 1.' },
  { id: 'm69', sec: 'math', dom: 'Advanced Math', skill: 'Systems of nonlinear equations', d: 'M',
    q: '<i>y</i> = (<i>x</i> − 1)<sup>2</sup><br><i>y</i> = 4<br><br>How many solutions does the system above have?',
    ch: ['Zero', 'Exactly one', 'Exactly two', 'Infinitely many'], a: 2, fixed: true,
    ex: '(<i>x</i> − 1)<sup>2</sup> = 4 means <i>x</i> − 1 = 2 or <i>x</i> − 1 = −2, so <i>x</i> = 3 or <i>x</i> = −1. That gives two points, (3, 4) and (−1, 4): the horizontal line crosses the parabola twice.' },
  { id: 'm70', sec: 'math', dom: 'Advanced Math', skill: 'Systems of nonlinear equations', d: 'H',
    q: '<i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> = 25<br><i>y</i> = <i>x</i> + 1<br><br>If (<i>a</i>, <i>b</i>) is a solution to the system above and <i>a</i> &gt; 0, what is the value of <i>b</i>?',
    spr: 4, ex: 'Substitute: <i>x</i><sup>2</sup> + (<i>x</i> + 1)<sup>2</sup> = 25 → 2<i>x</i><sup>2</sup> + 2<i>x</i> − 24 = 0 → <i>x</i><sup>2</sup> + <i>x</i> − 12 = 0 → (<i>x</i> + 4)(<i>x</i> − 3) = 0. The positive solution is <i>a</i> = 3, so <i>b</i> = 3 + 1 = 4.' },

  // Problem-Solving and Data Analysis: Ratios and proportions
  { id: 'm71', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Ratios and proportions', d: 'E',
    q: 'A recipe uses 3 cups of flour for every 2 cups of sugar. How many cups of flour are needed if 8 cups of sugar are used?',
    spr: 12, ex: '8 cups of sugar is 4 times 2 cups, so multiply the flour by 4 as well: 3 × 4 = 12 cups.' },
  { id: 'm72', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Ratios and proportions', d: 'M',
    q: 'On a map, 1 inch represents 25 miles. Two towns are 3.5 inches apart on the map. What is the actual distance, in miles, between the towns?',
    spr: 87.5, key: '87.5', ex: 'Multiply the map distance by the scale: 3.5 × 25 = 87.5 miles.' },
  { id: 'm73', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Ratios and proportions', d: 'M',
    q: 'The ratio of boys to girls in a class of 36 students is 4 to 5. How many girls are in the class?',
    spr: 20, ex: 'The ratio has 4 + 5 = 9 parts, so each part is 36 ÷ 9 = 4 students. Girls make up 5 parts: 5 × 4 = 20.' },
  { id: 'm74', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Ratios and proportions', d: 'H',
    q: 'If <i>x</i>/<i>y</i> = 3/4 and <i>y</i>/<i>z</i> = 2/5, what is the value of <i>x</i>/<i>z</i>?',
    spr: 0.3, key: '3/10', ex: 'Multiply the ratios so <i>y</i> cancels: (<i>x</i>/<i>y</i>)(<i>y</i>/<i>z</i>) = <i>x</i>/<i>z</i> = (3/4)(2/5) = 6/20 = 3/10 (or 0.3).' },

  // Problem-Solving and Data Analysis: Rates and units
  { id: 'm75', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Rates and units', d: 'E',
    q: 'A car travels 150 miles in 2.5 hours. What is its average speed, in miles per hour?',
    spr: 60, ex: 'Average speed is distance ÷ time: 150 ÷ 2.5 = 60 miles per hour.' },
  { id: 'm76', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Rates and units', d: 'M',
    q: 'A printer prints 45 pages in 3 minutes. At this rate, how many minutes will it take to print 240 pages?',
    spr: 16, ex: 'The rate is 45 ÷ 3 = 15 pages per minute. 240 ÷ 15 = 16 minutes.' },
  { id: 'm77', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Rates and units', d: 'M',
    q: 'An object moves at a constant speed of 3 feet per second. What is this speed in inches per minute? (1 foot = 12 inches)',
    spr: 2160, ex: 'Convert both units: 3 feet per second × 12 inches per foot = 36 inches per second, and 36 × 60 seconds per minute = 2,160 inches per minute.' },
  { id: 'm78', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Rates and units', d: 'H',
    q: 'Water flows into an empty tank at a constant rate of 2.5 liters per second. The tank holds 27,000 liters. How many hours will it take to fill the tank?',
    spr: 3, ex: '27,000 ÷ 2.5 = 10,800 seconds. There are 3,600 seconds in an hour, so 10,800 ÷ 3,600 = 3 hours.' },

  // Problem-Solving and Data Analysis: Percentages
  { id: 'm79', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Percentages', d: 'E',
    q: 'What is 30% of 250?',
    spr: 75, ex: '30% is 0.30, and 0.30 × 250 = 75.' },
  { id: 'm80', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Percentages', d: 'M',
    q: 'After a 20% discount, a jacket costs $80. What was the original price of the jacket, in dollars?',
    spr: 100, ex: 'After a 20% discount you pay 80% of the original price: 0.8<i>p</i> = 80, so <i>p</i> = 100. Adding 20% to $80 would give $96, which is a common mistake.' },
  { id: 'm81', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Percentages', d: 'M',
    q: 'The population of a town grew from 1,600 to 2,000. By what percent did the population increase?',
    spr: 25, ex: 'The increase is 2,000 − 1,600 = 400. Divide by the original amount: 400 ÷ 1,600 = 0.25, or 25%.' },

  // Problem-Solving and Data Analysis: Probability
  { id: 'm82', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Probability', d: 'E',
    q: 'A bag contains 4 red marbles, 6 blue marbles, and 10 green marbles. If one marble is chosen at random, what is the probability that it is blue?',
    ch: ['1/5', '3/10', '1/2', '3/5'], a: 1,
    ex: 'There are 4 + 6 + 10 = 20 marbles, and 6 are blue. 6/20 = 3/10.' },
  { id: 'm83', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Probability', d: 'M',
    q: `<div class="tablescroll"><table><caption>Survey of 200 students</caption>
      <thead><tr><th></th><th>Plays an instrument</th><th>Does not play an instrument</th><th>Total</th></tr></thead>
      <tbody><tr><th>Plays a sport</th><td>45</td><td>75</td><td>120</td></tr>
      <tr><th>Does not play a sport</th><td>35</td><td>45</td><td>80</td></tr>
      <tr><th>Total</th><td>80</td><td>120</td><td>200</td></tr></tbody></table></div>
      If a student who plays an instrument is chosen at random, what is the probability that the student also plays a sport?`,
    spr: 0.5625, key: '9/16', ex: 'Only the 80 students who play an instrument count. Of those, 45 play a sport: 45/80 = 9/16 (or 0.5625). Using 45/200 would answer a different question.' },
  { id: 'm84', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Probability', d: 'H',
    q: 'An integer is chosen at random from the integers 1 through 20. What is the probability that the integer is a multiple of 3 or a multiple of 5?',
    spr: 0.45, key: '9/20', ex: 'Multiples of 3: 3, 6, 9, 12, 15, 18 (6 numbers). Multiples of 5: 5, 10, 15, 20 (4 numbers). 15 is counted twice, so there are 6 + 4 − 1 = 9 numbers. 9/20 = 0.45.' },

  // Problem-Solving and Data Analysis: One-variable data
  { id: 'm85', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'One-variable data', d: 'E',
    q: 'What is the median of the data set 7, 3, 9, 4, 12?',
    spr: 7, ex: 'Put the values in order: 3, 4, 7, 9, 12. The middle value is 7.' },
  { id: 'm86', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'One-variable data', d: 'M',
    q: 'A data set of 5 values has a mean of 8. When a sixth value is added, the mean becomes 9. What is the sixth value?',
    spr: 14, ex: 'The first sum is 5 × 8 = 40. The new sum is 6 × 9 = 54. The added value is 54 − 40 = 14.' },

  // Problem-Solving and Data Analysis: Two-variable data
  { id: 'm87', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Two-variable data: models and scatterplots', d: 'E',
    q: 'A scatterplot shows the height of a plant, in centimeters, <i>x</i> weeks after it was planted. The line of best fit is <i>y</i> = 2.5<i>x</i> + 10. According to the line of best fit, what is the predicted height, in centimeters, of the plant 6 weeks after it was planted?',
    spr: 25, ex: 'Substitute <i>x</i> = 6: 2.5(6) + 10 = 15 + 10 = 25 centimeters.' },
  { id: 'm88', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Two-variable data: models and scatterplots', d: 'M',
    q: 'For a group of students, the line of best fit for test score <i>y</i> versus hours of TV watched per week <i>x</i> is <i>y</i> = −0.8<i>x</i> + 92. Which statement is the best interpretation of the slope of this line?',
    ch: ['For each additional hour of TV watched per week, the predicted test score decreases by 0.8 points.',
         'For each additional point on the test, the predicted TV time decreases by 0.8 hours.',
         'A student who watches no TV is predicted to score 0.8 points.',
         'For each additional hour of TV watched per week, the predicted test score decreases by 92 points.'],
    a: 0,
    ex: 'The slope is the change in <i>y</i> (score) for each one-unit increase in <i>x</i> (hours of TV). It is −0.8, so the predicted score drops 0.8 points per hour. 92 is the <i>y</i>-intercept, the predicted score with no TV.' },
  { id: 'm89', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Two-variable data: models and scatterplots', d: 'H',
    q: `<div class="tablescroll"><table>
      <thead><tr><th><i>t</i></th><th>0</th><th>1</th><th>2</th><th>3</th></tr></thead>
      <tbody><tr><th><i>f</i>(<i>t</i>)</th><td>5</td><td>15</td><td>45</td><td>135</td></tr></tbody></table></div>
      The table shows four values of the function <i>f</i>. Which equation could define <i>f</i>?`,
    ch: ['<i>f</i>(<i>t</i>) = 5(3)<sup><i>t</i></sup>', '<i>f</i>(<i>t</i>) = 3(5)<sup><i>t</i></sup>', '<i>f</i>(<i>t</i>) = 10<i>t</i> + 5', '<i>f</i>(<i>t</i>) = 5<i>t</i><sup>3</sup>'],
    a: 0,
    ex: 'Each value is 3 times the one before, which is exponential growth with factor 3. The starting value at <i>t</i> = 0 is 5, so <i>f</i>(<i>t</i>) = 5(3)<sup><i>t</i></sup>. The linear choice fits only the first two points, and 5<i>t</i><sup>3</sup> gives 0 at <i>t</i> = 0.' },

  // Problem-Solving and Data Analysis: Inference from sample statistics
  { id: 'm90', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Inference from sample statistics and margin of error', d: 'E',
    q: 'A town has 20,000 residents. In a random sample of 400 residents, 120 said they support building a new park. Based on the sample, about how many residents of the town support building the park?',
    spr: 6000, ex: 'In the sample, 120 ÷ 400 = 30% support the park. A random sample lets you apply that share to the whole town: 0.30 × 20,000 = 6,000.' },
  { id: 'm91', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Inference from sample statistics and margin of error', d: 'M',
    q: 'Based on a random sample, a poll estimates that 54% of voters in a city favor a proposal, with a margin of error of 3 percentage points. Which of the following is a plausible value for the actual percent of all voters in the city who favor the proposal?',
    ch: ['49%', '52%', '58%', '60%'], a: 1, fixed: true,
    ex: 'The margin of error gives a plausible range of 54 − 3 = 51% to 54 + 3 = 57%. Only 52% falls in that range.' },
  { id: 'm92', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Inference from sample statistics and margin of error', d: 'H',
    q: 'Researchers took two random samples from the same population to estimate the mean height of adults. Sample A had 100 people, and sample B had 900 people. Both estimates used the same confidence level. Which statement about the margins of error is most likely true?',
    ch: ['The margin of error for sample B is smaller than the margin of error for sample A.',
         'The margin of error for sample B is larger than the margin of error for sample A.',
         'The two margins of error are equal, because the samples come from the same population.',
         'The margin of error for sample B is 9 times the margin of error for sample A.'],
    a: 0,
    ex: 'Larger random samples give more precise estimates, so the margin of error shrinks as the sample size grows. Sample B is larger, so its margin of error is most likely smaller.' },

  // Problem-Solving and Data Analysis: Evaluating statistical claims
  { id: 'm93', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Evaluating statistical claims', d: 'E',
    q: 'A researcher recruited 200 volunteers and randomly assigned half of them to drink a cup of green tea each day and the other half to drink a cup of water each day. After two months, the green tea group reported lower stress levels on average. Which conclusion is best supported by the study?',
    ch: ['Drinking green tea daily likely causes lower stress for people similar to the volunteers.',
         'Drinking green tea daily causes lower stress for all adults.',
         'There is no relationship between drinking green tea and stress.',
         'Having lower stress causes people to drink more green tea.'],
    a: 0,
    ex: 'Random assignment to groups allows a cause-and-effect conclusion. But the volunteers were not a random sample of all adults, so the result applies only to people similar to them, not to everyone.' },
  { id: 'm94', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Evaluating statistical claims', d: 'H',
    q: 'A survey of 1,000 randomly selected adults in a city found that dog owners reported exercising more hours per week, on average, than people who do not own dogs. Which conclusion is best supported by the survey?',
    ch: ['Among adults in the city, owning a dog is associated with exercising more, but the survey does not show that owning a dog causes more exercise.',
         'Owning a dog causes adults in the city to exercise more.',
         'Exercising more causes adults in the city to buy dogs.',
         'There is no relationship between owning a dog and exercise among adults in the city.'],
    a: 0,
    ex: 'A random sample lets you generalize to adults in the city. But the survey only observed people; no one was assigned to own a dog. So it shows an association, not a cause in either direction.' },
  { id: 'm95', sec: 'math', dom: 'Problem-Solving and Data Analysis', skill: 'Evaluating statistical claims', d: 'M',
    q: 'A principal wants to estimate the average number of hours per week that students at her school spend on homework. Which method of choosing students to survey is most likely to give an unbiased estimate?',
    ch: ['Survey 100 students chosen at random from a list of all students at the school',
         'Survey 100 students who are in the library after school',
         'Survey the first 100 students who arrive at school in the morning',
         'Survey every student on the school\'s math team'],
    a: 0,
    ex: 'Only a random sample from all students gives every student the same chance of being chosen. Students in the library or on the math team probably do more homework than average, and early arrivals may differ too.' },

  // Geometry and Trigonometry: Lines and angles
  { id: 'm96', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Lines and angles', d: 'E',
    q: 'Two lines intersect, forming four angles. One of the angles measures 65°. What is the measure, in degrees, of an angle adjacent to it?',
    spr: 115, ex: 'Adjacent angles formed by two intersecting lines lie along a straight line, so they add to 180°: 180 − 65 = 115.' },
  { id: 'm97', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Lines and angles', d: 'M',
    q: 'Two parallel lines are cut by a transversal. Two same-side interior angles measure (3<i>x</i> + 10)° and (2<i>x</i> + 20)°. What is the value of <i>x</i>?',
    spr: 30, ex: 'Same-side interior angles of parallel lines add to 180°: (3<i>x</i> + 10) + (2<i>x</i> + 20) = 180 → 5<i>x</i> + 30 = 180 → <i>x</i> = 30.' },
  { id: 'm98', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Lines and angles', d: 'M',
    q: 'The measures of the three angles of a triangle are in the ratio 2 : 3 : 4. What is the measure, in degrees, of the largest angle?',
    spr: 80, ex: 'The angles add to 180°, split into 2 + 3 + 4 = 9 parts of 20° each. The largest angle is 4 × 20 = 80°.' },
  { id: 'm99', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Lines and angles', d: 'H',
    q: 'Each interior angle of a regular polygon measures 150°. How many sides does the polygon have?',
    spr: 12, ex: 'Each exterior angle is 180 − 150 = 30°. The exterior angles of any polygon add to 360°, so there are 360 ÷ 30 = 12 sides.' },

  // Geometry and Trigonometry: Right triangles
  { id: 'm100', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangles', d: 'E',
    q: 'A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?',
    spr: 10, ex: 'By the Pythagorean theorem, 6<sup>2</sup> + 8<sup>2</sup> = 36 + 64 = 100, and √100 = 10.' },
  { id: 'm101', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangles', d: 'M',
    q: 'A 13-foot ladder leans against a vertical wall. The bottom of the ladder is 5 feet from the base of the wall. How many feet above the ground does the top of the ladder touch the wall?',
    spr: 12, ex: 'The ladder is the hypotenuse: 5<sup>2</sup> + <i>h</i><sup>2</sup> = 13<sup>2</sup> → 25 + <i>h</i><sup>2</sup> = 169 → <i>h</i><sup>2</sup> = 144 → <i>h</i> = 12.' },
  { id: 'm102', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangles', d: 'M',
    q: 'An isosceles right triangle has a hypotenuse of length 8√2. What is the area of the triangle?',
    spr: 32, ex: 'In a 45°-45°-90° triangle, the hypotenuse is a leg times √2, so each leg is 8. The area is (1/2)(8)(8) = 32.' },
  { id: 'm103', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangles', d: 'H',
    q: 'In a 30°-60°-90° triangle, the side opposite the 30° angle has length 5. What is the perimeter of the triangle?',
    ch: ['15', '15 + 5√3', '20', '15 + 10√3'], a: 1, fixed: true,
    ex: 'The sides of a 30°-60°-90° triangle are in the ratio 1 : √3 : 2, so they are 5, 5√3, and 10. The perimeter is 5 + 10 + 5√3 = 15 + 5√3.' },

  // Geometry and Trigonometry: Right triangle trigonometry
  { id: 'm104', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangle trigonometry', d: 'E',
    q: 'In right triangle <i>ABC</i>, angle <i>C</i> is a right angle, <i>AC</i> = 3, <i>BC</i> = 4, and <i>AB</i> = 5. What is the value of sin <i>A</i>?',
    ch: ['3/5', '3/4', '4/5', '4/3'], a: 2,
    ex: 'Sine is opposite over hypotenuse. The side opposite angle <i>A</i> is <i>BC</i> = 4, and the hypotenuse is <i>AB</i> = 5, so sin <i>A</i> = 4/5.' },
  { id: 'm105', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangle trigonometry', d: 'M',
    q: 'If sin(<i>x</i>°) = cos(40°) and 0 &lt; <i>x</i> &lt; 90, what is the value of <i>x</i>?',
    spr: 50, ex: 'The sine of an angle equals the cosine of its complement: sin(<i>x</i>°) = cos(90° − <i>x</i>°). So 90 − <i>x</i> = 40 and <i>x</i> = 50.' },
  { id: 'm106', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangle trigonometry', d: 'M',
    q: 'In a right triangle, angle <i>A</i> is acute and tan <i>A</i> = 5/12. What is the value of cos <i>A</i>?',
    spr: 12 / 13, key: '12/13', ex: 'Tangent is opposite over adjacent, so use opposite 5 and adjacent 12. The hypotenuse is √(25 + 144) = 13. Cosine is adjacent over hypotenuse: 12/13 (about 0.923).' },
  { id: 'm107', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Right triangle trigonometry', d: 'H',
    q: 'In right triangle <i>ABC</i>, angle <i>C</i> is a right angle, <i>AB</i> = 20, and sin <i>A</i> = 0.6. What is the length of <i>AC</i>?',
    spr: 16, ex: 'sin <i>A</i> = <i>BC</i>/<i>AB</i>, so <i>BC</i> = 0.6 × 20 = 12. Then <i>AC</i><sup>2</sup> + 12<sup>2</sup> = 20<sup>2</sup> → <i>AC</i><sup>2</sup> = 256 → <i>AC</i> = 16.' },

  // Geometry and Trigonometry: Similar triangles
  { id: 'm108', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Similar triangles', d: 'E',
    q: 'A triangle has sides of length 3, 4, and 5. A similar triangle has a shortest side of length 9. What is the length of its longest side?',
    spr: 15, ex: 'The scale factor is 9 ÷ 3 = 3. The longest side is 5 × 3 = 15.' },
  { id: 'm109', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Similar triangles', d: 'M',
    q: 'At the same time of day, a 6-foot-tall person casts a 4-foot shadow and a tree casts a 30-foot shadow. How tall, in feet, is the tree?',
    spr: 45, ex: 'The sun makes similar triangles, so height and shadow are proportional: 6/4 = <i>h</i>/30 → <i>h</i> = 30 × 1.5 = 45 feet.' },
  { id: 'm110', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Similar triangles', d: 'M',
    q: 'In triangle <i>ABC</i>, point <i>D</i> is on side <i>AB</i> and point <i>E</i> is on side <i>AC</i>, and segment <i>DE</i> is parallel to side <i>BC</i>. If <i>AD</i> = 4, <i>DB</i> = 6, and <i>DE</i> = 5, what is the length of <i>BC</i>?',
    spr: 12.5, key: '25/2', ex: '<i>DE</i> ∥ <i>BC</i> makes triangle <i>ADE</i> similar to triangle <i>ABC</i>. <i>AB</i> = 4 + 6 = 10, so the ratio is <i>AD</i>/<i>AB</i> = 4/10. Then 5/<i>BC</i> = 4/10 → <i>BC</i> = 12.5. A common mistake is to use 4/6 instead of 4/10.' },
  { id: 'm111', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Similar triangles', d: 'H',
    q: 'Two similar triangles have corresponding sides in the ratio 2 : 5. The area of the smaller triangle is 12. What is the area of the larger triangle?',
    spr: 75, ex: 'Areas scale by the square of the side ratio: (5/2)<sup>2</sup> = 25/4. So the larger area is 12 × 25/4 = 75.' },

  // Geometry and Trigonometry: Area and volume
  { id: 'm112', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Area and volume', d: 'E',
    q: 'A rectangular box has a length of 5 inches, a width of 4 inches, and a height of 3 inches. What is the volume of the box, in cubic inches?',
    spr: 60, ex: 'Volume = length × width × height = 5 × 4 × 3 = 60 cubic inches.' },
  { id: 'm113', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Area and volume', d: 'M',
    q: 'A right circular cylinder has a radius of 3 and a height of 10. What is the volume of the cylinder?',
    ch: ['30π', '60π', '90π', '180π'], a: 2,
    ex: 'The volume of a cylinder is π<i>r</i><sup>2</sup><i>h</i> = π(3)<sup>2</sup>(10) = 90π.' },
  { id: 'm114', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Area and volume', d: 'H',
    q: 'The total surface area of a cube is 150 square centimeters. What is the volume of the cube, in cubic centimeters?',
    spr: 125, ex: 'A cube has 6 equal square faces, so each face has area 150 ÷ 6 = 25 and each edge is 5. The volume is 5<sup>3</sup> = 125.' },

  // Geometry and Trigonometry: Circles
  { id: 'm115', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Circles', d: 'M',
    q: 'The area of a circle is 49π. What is the circumference of the circle?',
    ch: ['7π', '14π', '49π', '98π'], a: 1,
    ex: 'π<i>r</i><sup>2</sup> = 49π, so <i>r</i> = 7. The circumference is 2π<i>r</i> = 14π.' },
  { id: 'm116', sec: 'math', dom: 'Geometry and Trigonometry', skill: 'Circles', d: 'H',

       'm20 m21 m22 m24 m25 m27 m7 m9 m30 m32 m33 m34 m37 m11 m38 m40 m14 m15 m16 m44',
    H: 'rw43 m23 m36'
  };
  const map = {};
  Object.entries(T).forEach(([d, s]) => s.split(' ').forEach(id => map[id] = d));

// Spread correct answers across A–D with a fixed per-question order (same every visit).
// Purely numeric math choices stay in ascending order, as on the real test.
(function spreadAnswers() {
  const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  BANK.forEach(q => {
    if (!q.ch || q.fixed) return;
    const plain = q.ch.map(c => c.replace(/<[^>]+>/g, '').replace(/[$,π]/g, '').replace('−', '-'));
    if (q.sec === 'math' && plain.every(c => /^-?[\d.\/]+$/.test(c))) return;
    let seed = hash(q.id + 'x');
    const order = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; const j = (seed >>> 8) % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }
    q.ch = order.map(k => q.ch[k]);
    q.a = order.indexOf(q.a);
    q.order = order;
  });
})();
