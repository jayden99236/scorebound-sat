      Случайным образом выбирают ученика, который играет на музыкальном инструменте. Какова вероятность, что он также занимается спортом?`,
  m84: `Из целых чисел от 1 до 20 случайным образом выбирают одно. Какова вероятность, что оно кратно 3 или кратно 5?`,
  m85: `Чему равна медиана набора данных 7, 3, 9, 4, 12?`,
  m86: `Среднее арифметическое набора из 5 значений равно 8. Когда добавили шестое значение, среднее стало равно 9. Чему равно шестое значение?`,
  m87: `Диаграмма рассеяния показывает высоту растения в сантиметрах через <i>x</i> недель после посадки. Линия наилучшего приближения: <i>y</i> = 2,5<i>x</i> + 10. Какую высоту растения в сантиметрах предсказывает эта линия через 6 недель после посадки?`,
  m88: `Для группы учеников линия наилучшего приближения для балла за тест <i>y</i> в зависимости от числа часов просмотра телевизора в неделю <i>x</i> имеет вид <i>y</i> = −0,8<i>x</i> + 92. Какое утверждение лучше всего объясняет угловой коэффициент этой прямой?`,
  m89: `<div class="tablescroll"><table>

      В таблице приведены четыре значения функции <i>f</i>. Какое уравнение может задавать <i>f</i>?`,
  m90: `В городе живут 20 000 человек. В случайной выборке из 400 жителей 120 человек сказали, что поддерживают строительство нового парка. Сколько примерно жителей города поддерживают строительство парка, судя по выборке?`,
  m91: `По данным опроса на случайной выборке, 54% избирателей города поддерживают предложение; погрешность — 3 процентных пункта. Какое из значений правдоподобно для настоящей доли всех избирателей города, поддерживающих предложение?`,
  m92: `Чтобы оценить средний рост взрослых, исследователи взяли из одной генеральной совокупности две случайные выборки. В выборке A было 100 человек, в выборке B — 900. Обе оценки сделаны с одинаковым уровнем доверия. Какое утверждение о погрешностях, скорее всего, верно?`,
  m93: `Исследователь набрал 200 добровольцев и случайным образом распределил их на две группы: одна половина каждый день пила чашку зелёного чая, другая — чашку воды. Через два месяца группа, пившая чай, в среднем сообщала о более низком уровне стресса. Какой вывод лучше всего подтверждается исследованием?`,
  m94: `Опрос 1 000 случайно выбранных взрослых жителей города показал, что владельцы собак в среднем занимаются спортом больше часов в неделю, чем люди без собак. Какой вывод лучше всего подтверждается опросом?`,
  m95: `Директор школы хочет оценить, сколько часов в неделю ученики её школы в среднем тратят на домашние задания. Какой способ выбора учеников для опроса скорее всего даст несмещённую оценку?`,
  m96: `Две прямые пересекаются и образуют четыре угла. Один из углов равен 65°. Чему равна в градусах величина смежного с ним угла?`,
  m97: `Две параллельные прямые пересечены секущей. Два односторонних угла равны (3<i>x</i> + 10)° и (2<i>x</i> + 20)°. Чему равно <i>x</i>?`,
  m98: `Углы треугольника относятся как 2 : 3 : 4. Чему равен наибольший угол в градусах?`,
  m99: `Каждый внутренний угол правильного многоугольника равен 150°. Сколько сторон у многоугольника?`,
  m100: `Катеты прямоугольного треугольника равны 6 и 8. Чему равна гипотенуза?`,
  m101: `Лестница длиной 13 футов прислонена к вертикальной стене. Нижний конец лестницы находится в 5 футах от основания стены. На какой высоте в футах верхний конец касается стены?`,
  m102: `Гипотенуза равнобедренного прямоугольного треугольника равна 8√2. Чему равна площадь треугольника?`,
  m103: `В треугольнике с углами 30°, 60° и 90° сторона, лежащая против угла 30°, равна 5. Чему равен периметр треугольника?`,
  m104: `В прямоугольном треугольнике <i>ABC</i> угол <i>C</i> прямой, <i>AC</i> = 3, <i>BC</i> = 4 и <i>AB</i> = 5. Чему равен sin <i>A</i>?`,

  m107: `В прямоугольном треугольнике <i>ABC</i> угол <i>C</i> прямой, <i>AB</i> = 20 и sin <i>A</i> = 0,6. Чему равна длина <i>AC</i>?`,
  m108: `Стороны треугольника равны 3, 4 и 5. Наименьшая сторона подобного ему треугольника равна 9. Чему равна его наибольшая сторона?`,
  m109: `В одно и то же время дня человек ростом 6 футов отбрасывает тень длиной 4 фута, а дерево — тень длиной 30 футов. Какова высота дерева в футах?`,
  m110: `В треугольнике <i>ABC</i> точка <i>D</i> лежит на стороне <i>AB</i>, точка <i>E</i> — на стороне <i>AC</i>, и отрезок <i>DE</i> параллелен стороне <i>BC</i>. Если <i>AD</i> = 4, <i>DB</i> = 6 и <i>DE</i> = 5, чему равна длина <i>BC</i>?`,
  m111: `Соответствующие стороны двух подобных треугольников относятся как 2 : 5. Площадь меньшего треугольника равна 12. Чему равна площадь большего?`,
  m112: `Длина прямоугольной коробки — 5 дюймов, ширина — 4 дюйма, высота — 3 дюйма. Чему равен объём коробки в кубических дюймах?`,
  m113: `Радиус прямого кругового цилиндра равен 3, высота — 10. Чему равен объём цилиндра?`,
  m114: `Площадь полной поверхности куба равна 150 квадратным сантиметрам. Чему равен объём куба в кубических сантиметрах?`,
  m115: `Площадь круга равна 49π. Чему равна длина окружности?`,
  m116: `На плоскости <i>xy</i> центр окружности находится в точке (2, −3), а сама окружность проходит через точку (5, 1). Какое уравнение задаёт эту окружность?`,
  m117: `Какое значение <i>x</i> является решением неравенства 3<i>x</i> − 5 &gt; 10?`,

  m119: `Если 3(<i>x</i> + 4) = 5<i>x</i> − 6, чему равно <i>x</i>?`,
  m120: `Диаграмма рассеяния показывает стоимость <i>y</i> в долларах поездок на такси длиной <i>x</i> миль. Линия наилучшего приближения: <i>y</i> = 2,1<i>x</i> + 3,5. На сколько долларов, согласно этой линии, прогнозируемая стоимость поездки на 10 миль больше, чем поездки на 4 мили?`,
  m121: `Модель <i>h</i>(<i>t</i>) = −5<i>t</i><sup>2</sup> + 20<i>t</i> + 1 оценивает высоту мяча в метрах через <i>t</i> секунд после броска. Какова, согласно модели, наибольшая высота мяча в метрах?`,
  m122: `Фабрика каждый день упаковывает 4 000 коробок. В случайной выборке из 50 коробок за один день 3 оказались повреждены. Сколько примерно из 4 000 коробок этого дня повреждены, судя по выборке?`,
  m123: `В случайной выборке из 500 студентов университета X средняя продолжительность сна за ночь составила 6,8 часа с погрешностью 0,3 часа. Какой вывод наиболее обоснован?`,
  m124: `Компания разместила на сайте опрос: нравится ли посетителям её новый логотип. Из 2 000 человек, которые решили проголосовать, 85% ответили, что нравится. Какое утверждение лучше всего объясняет, почему этот результат может не отражать мнение всех покупателей компании?`,

         'Удобрение X повышает урожайность на фермах во всём мире.',
         'Высокая урожайность заставляет фермеров выбирать удобрение X.',

const Q_UZ = {
  m1: `Agar 3<i>x</i> − 7 = 11 boʻlsa, <i>x</i> nechaga teng?`,
  m2: `Sport zali bir martalik $40 roʻyxatdan oʻtish toʻlovi va oyiga $25 oladi. Qaysi funksiya <i>m</i> oylik aʼzolikning umumiy narxi <i>C</i> ni (dollarda) beradi?`,
  m3: `<i>x</i> + <i>y</i> = 10<br><i>x</i> − <i>y</i> = 4<br><br>Agar (<i>x</i>, <i>y</i>) yuqoridagi tenglamalar sistemasining yechimi boʻlsa, <i>x</i> nechaga teng?`,
  m4: `<i>xy</i> tekisligidagi toʻgʻri chiziq (2, 5) va (6, 13) nuqtalardan oʻtadi. Toʻgʻri chiziqning burchak koeffitsiyenti nechaga teng?`,
  m5: `<i>x</i><sup>2</sup> − 5<i>x</i> + 6 = 0 tenglama yechimlarining yigʻindisi nechaga teng?`,
  m6: `<i>f</i> funksiya <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> − 3 formula bilan berilgan. <i>f</i>(−2) nechaga teng?`,
  m7: `500 ta bakteriyadan iborat koloniya har 3 soatda ikki baravar koʻpayadi. Qaysi ifoda <i>t</i> soatdan keyingi bakteriyalar sonini beradi?`,
  m8: `Qaysi ifoda (<i>x</i> + 3)<sup>2</sup> ga teng kuchli?`,
  m9: `Agar 2<sup><i>x</i> + 1</sup> = 32 boʻlsa, <i>x</i> nechaga teng?`,
  m10: `4, 8, 10, 14 va <i>x</i> sonlarining oʻrta arifmetigi 9 ga teng. <i>x</i> nechaga teng?`,
  m11: `Odatdagi narxi $80 boʻlgan kurtka 25% chegirma bilan sotilmoqda. Chegirmali narxga 8% savdo soligʻi qoʻshiladi. Kurtkaning umumiy narxi qancha?`,
  m12: `Xaltada 6 ta qizil, 4 ta koʻk va 10 ta yashil shar bor. Tasodifan bitta shar olinsa, uning koʻk boʻlish ehtimoli qancha?`,
  m13: `Toʻgʻri burchakli uchburchakning katetlari 6 va 8 ga teng. Gipotenuza nechaga teng?`,
  m14: `<i>xy</i> tekisligida aylana (<i>x</i> − 3)<sup>2</sup> + (<i>y</i> + 2)<sup>2</sup> = 49 tenglama bilan berilgan. Aylana markazining koordinatalari qanday?`,
  m15: `<i>ABC</i> toʻgʻri burchakli uchburchakda <i>C</i> burchak toʻgʻri va sin <i>A</i> = 3/5. cos <i>A</i> nechaga teng?`,
  m16: `Aylana uzunligi 10π ga teng. Doiraning yuzi qancha?`,
  m17: `Agar 5(<i>x</i> − 2) = 3<i>x</i> + 4 boʻlsa, <i>x</i> nechaga teng?`,
  m18: `<i>xy</i> tekisligida <i>y</i> = −3<i>x</i> + 6 grafigi <i>y</i> oʻqini qayerda kesib oʻtadi?`,
  m19: `Qaysi tenglama <i>y</i> = 4<i>x</i> − 1 toʻgʻri chiziqqa parallel toʻgʻri chiziqni ifodalaydi?`,
  m20: `Yuk mashinasi koʻpi bilan 2 000 funt yuk koʻtara oladi. Unda allaqachon 600 funt jihoz bor, har bir quti esa 35 funt. Qaysi tengsizlik mashina olib keta oladigan qutilar soni <i>b</i> ni ifodalaydi?`,
  m21: `Yuk mashinasi koʻpi bilan 2 000 funt yuk koʻtara oladi. Unda allaqachon 600 funt jihoz bor, har bir quti esa 35 funt. Mashina eng koʻpi bilan nechta quti olib keta oladi?`,
  m22: `2<i>x</i> + 3<i>y</i> = 12<br><i>y</i> = <i>x</i> − 1<br><br>Agar (<i>x</i>, <i>y</i>) yuqoridagi sistemaning yechimi boʻlsa, <i>y</i> nechaga teng?`,
  m23: `3<i>x</i> + <i>ky</i> = 8<br>6<i>x</i> + 4<i>y</i> = 5<br><br>Yuqoridagi sistemada <i>k</i> — oʻzgarmas son. Agar sistema yechimga ega boʻlmasa, <i>k</i> nechaga teng?`,
  m24: `Teatr kattalar chiptasini $12 dan, bolalar chiptasini $8 dan sotadi. Bir kechada jami $520 ga 50 ta chipta sotildi. Nechta kattalar chiptasi sotilgan?`,
  m25: `<i>f</i> chiziqli funksiya uchun <i>f</i>(1) = 7 va <i>f</i>(4) = 16. <i>f</i>(0) nechaga teng?`,
  m26: `<i>C</i> = 15<i>h</i> + 50 tenglama santexnikning <i>h</i> soat davom etgan chaqiruvi narxi <i>C</i> ni (dollarda) beradi. Bu vaziyatda 15 sonini qanday tushunish eng toʻgʻri?`,
  m27: `Quyidagilardan qaysi biri |<i>x</i> − 4| = 9 tenglamaning yechimi?`,
  m28: `Qaysi ifoda <i>x</i><sup>2</sup> − 9 ga teng kuchli?`,
  m29: `<i>xy</i> tekisligida <i>y</i> = (<i>x</i> − 2)<sup>2</sup> + 5 grafigining uchi qayerda?`,
  m30: `<i>x</i><sup>2</sup> = 4<i>x</i> + 12 tenglamaning musbat yechimi nechaga teng?`,
  m31: `<i>f</i> funksiya <i>f</i>(<i>x</i>) = 3<sup><i>x</i></sup> formula bilan berilgan. <i>f</i>(4) nechaga teng?`,
  m32: `<i>g</i> va <i>h</i> funksiyalar <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 1 va <i>h</i>(<i>x</i>) = 2<i>x</i> − 3 formulalar bilan berilgan. <i>g</i>(<i>h</i>(2)) nechaga teng?`,
  m33: `$24 000 turadigan avtomobil har yili qiymatining 15% ini yoʻqotadi. Qaysi funksiya avtomobilning <i>t</i> yildan keyingi qiymati <i>V</i> ni (dollarda) beradi?`,
  m34: `Qaysi ifoda (2<i>x</i><sup>2</sup> + 3<i>x</i>) − (<i>x</i><sup>2</sup> − 5<i>x</i> + 4) ga teng kuchli?`,
  m35: `<i>x</i> ≠ 0 boʻlganda qaysi ifoda (<i>x</i><sup>2</sup> + 6<i>x</i>) ÷ <i>x</i> ga teng kuchli?`,
  m36: `<i>c</i> oʻzgarmasning qanday qiymatida <i>x</i><sup>2</sup> + 6<i>x</i> + <i>c</i> = 0 tenglama roppa-rosa bitta haqiqiy yechimga ega?`,
  m37: `Agar √(<i>x</i> + 3) = 5 boʻlsa, <i>x</i> nechaga teng?`,
  m38: `Printer 45 soniyada 18 sahifa chop etadi. Shu tezlikda u 5 daqiqada nechta sahifa chop eta oladi?`,
  m39: `3, 7, 7, 9, 12, 15 maʼlumotlar toʻplamining medianasi nechaga teng?`,
  m40: `11- va 12-sinflarning 140 nafar oʻquvchisidan sport yoki sanʼat mashgʻulotlarini afzal koʻrishlari soʻraldi. Natijalar quyida keltirilgan.<div class="tablescroll"><table><thead><tr><th></th><th>Sport</th><th>Sanʼat</th><th>Jami</th></tr></thead><tbody><tr><td>11-sinf</td><td>40</td><td>20</td><td>60</td></tr><tr><td>12-sinf</td><td>30</td><td>50</td><td>80</td></tr></tbody></table></div>Soʻrovda qatnashgan 12-sinf oʻquvchilaridan biri tasodifan tanlansa, uning sanʼatni afzal koʻrish ehtimoli qancha?`,
  m41: `Retseptda har 2 stakan shakarga 3 stakan un ishlatiladi. Qandolatchi 12 stakan un ishlatsa, necha stakan shakar ishlatishi kerak?`,
  m42: `Ikki burchakning yigʻindisi 180° ga teng. Bir burchak ikkinchisidan 4 marta katta. Kichik burchak necha gradus?`,
  m43: `Toʻgʻri doiraviy silindrning radiusi 3 ga, balandligi 10 ga teng. Uning hajmi qancha?`,
  m44: `<i>ABC</i> uchburchak <i>DEF</i> uchburchakka oʻxshash, bunda <i>A</i>, <i>B</i>, <i>C</i> mos ravishda <i>D</i>, <i>E</i>, <i>F</i> ga mos keladi. Agar <i>AB</i> = 4, <i>DE</i> = 10 va <i>BC</i> = 6 boʻlsa, <i>EF</i> nechaga teng?`,
  m45: `4(<i>x</i> − <i>a</i>) + 2 = 4<i>x</i> − 10 tenglamada <i>a</i> — oʻzgarmas son. Agar tenglama cheksiz koʻp yechimga ega boʻlsa, <i>a</i> nechaga teng?`,
  m46: `<i>y</i> = <i>kx</i> + 4 toʻgʻri chiziq (bunda <i>k</i> — oʻzgarmas son) (−2, 10) nuqtadan oʻtadi. Toʻgʻri chiziq <i>x</i> oʻqini qaysi <i>x</i> koordinatada kesib oʻtadi?`,
  m47: `Doʻkon daftarlarni $3 dan, papkalarni $7 dan sotadi. Mia 10 ta narsa sotib olib, roppa-rosa $50 sarfladi. U nechta papka sotib olgan?`,
  m48: `2<i>x</i> − 5<i>y</i> = 7<br><i>ax</i> + 15<i>y</i> = −21<br><br>Yuqoridagi sistemada <i>a</i> — oʻzgarmas son. Agar sistema cheksiz koʻp yechimga ega boʻlsa, <i>a</i> nechaga teng?`,
  m49: `Qaysi (<i>x</i>, <i>y</i>) nuqta <i>y</i> &gt; 2<i>x</i> − 3 va <i>y</i> &lt; −<i>x</i> + 6 tengsizliklar sistemasining yechimi?`,
  m50: `Bakda 500 litr suv bor va u oʻzgarmas tezlikda boʻshaydi. 8 daqiqadan keyin bakda 340 litr qoldi. Suv chiqa boshlaganidan necha daqiqa oʻtib bak boʻshaydi?`,
  m51: `3<i>x</i> + 2<i>y</i> = 11<br><i>x</i> − 2<i>y</i> = 1<br><br>Agar (<i>x</i>, <i>y</i>) yuqoridagi sistemani qanoatlantirsa, 4<i>x</i> nechaga teng?`,
  m52: `ℓ toʻgʻri chiziq 2<i>x</i> + 3<i>y</i> = 6 toʻgʻri chiziqqa perpendikulyar va (4, 1) nuqtadan oʻtadi. ℓ toʻgʻri chiziq <i>y</i> oʻqini qaysi <i>y</i> koordinatada kesib oʻtadi?`,
  m53: `Kompaniyaning yillik daromadi <i>R</i> (ming dollarda) <i>R</i> = 12<i>t</i> + 150 modeli bilan ifodalanadi, bunda <i>t</i> — 2015-yildan beri oʻtgan yillar soni. Modelga koʻra daromad qaysi yilda birinchi marta $300 000 dan oshadi?`,
  m54: `<i>x</i><sup>2</sup> + <i>bx</i> + 16 = 0 tenglamaning (bunda <i>b</i> — oʻzgarmas son) yechimlaridan biri 2 ga teng. Ikkinchi yechim nechaga teng?`,
  m55: `<i>f</i> funksiya <i>f</i>(<i>x</i>) = (<i>x</i> − 3)(<i>x</i> + 5) formula bilan berilgan. <i>x</i> ning qanday qiymatida <i>f</i>(<i>x</i>) eng kichik qiymatga erishadi?`,
  m56: `<i>g</i>(<i>x</i>) = <i>a</i>(<i>x</i> − 2)<sup>2</sup> + 7 grafigi (bunda <i>a</i> — oʻzgarmas son) (4, −5) nuqtadan oʻtadi. <i>a</i> nechaga teng?`,
  m57: `Agar 9<sup><i>x</i></sup> = 27 boʻlsa, <i>x</i> nechaga teng?`,
  m58: `<i>x</i> ≠ −2 boʻlganda qaysi ifoda (<i>x</i><sup>2</sup> − 4) ÷ (<i>x</i><sup>2</sup> + 4<i>x</i> + 4) ga teng kuchli?`,
  m59: `2<i>x</i><sup>2</sup> − 4<i>x</i> + 5 = 0 tenglama nechta haqiqiy yechimga ega?`,
  m60: `<i>P</i>(<i>t</i>) = 1 200(1,05)<sup><i>t</i></sup> funksiya shaharning 2020-yildan <i>t</i> yil keyingi aholisini ifodalaydi. Modelga koʻra qaysi fikr toʻgʻri?`,
  m61: `<i>y</i> = <i>x</i><sup>2</sup> − 4<i>x</i> + 7<br><i>y</i> = 2<i>x</i> − 2<br><br>Agar (<i>x</i>, <i>y</i>) yuqoridagi sistemaning yechimi boʻlsa, <i>x</i> nechaga teng?`,
  m62: `<i>p</i> koʻphad <i>p</i>(<i>x</i>) = <i>x</i><sup>3</sup> − 2<i>x</i><sup>2</sup> − 9<i>x</i> + 18 formula bilan berilgan. Quyidagilardan qaysi biri <i>p</i>(<i>x</i>) ning koʻpaytuvchisi?`,
  m63: `Velosiped narxi 20% ga oshirildi, soʻng yangi narx 20% ga kamaytirildi. Oxirgi narx dastlabki narxning necha foizini tashkil qiladi?`,
  m64: `10 ta qiymatdan iborat toʻplamning oʻrta arifmetigi 12 ga teng. Toʻplamdan 30 qiymati olib tashlansa, qolgan qiymatlarning oʻrta arifmetigi nechaga teng boʻladi?`,
  m65: `<i>xy</i> tekisligida <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> − 6<i>x</i> + 8<i>y</i> = 0 tenglamaning grafigi aylanadir. Uning radiusi nechaga teng?`,
  m66: `Aylananing radiusi 6 ga teng. Markaziy burchagi 120° boʻlgan yoyning uzunligi qancha?`,
  m67: `<i>y</i> = <i>x</i><sup>2</sup><br><i>y</i> = 9<br><br>Agar (<i>x</i>, <i>y</i>) yuqoridagi sistemaning yechimi va <i>x</i> &gt; 0 boʻlsa, <i>x</i> nechaga teng?`,
  m68: `<i>y</i> = <i>x</i><sup>2</sup> + 1<br><i>y</i> = <i>x</i> + 3<br><br>Yuqoridagi sistema ikkita yechimga ega. Ikkala yechimning <i>x</i> koordinatalari yigʻindisi nechaga teng?`,
  m69: `<i>y</i> = (<i>x</i> − 1)<sup>2</sup><br><i>y</i> = 4<br><br>Yuqoridagi sistema nechta yechimga ega?`,
  m70: `<i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> = 25<br><i>y</i> = <i>x</i> + 1<br><br>Agar (<i>a</i>, <i>b</i>) yuqoridagi sistemaning yechimi va <i>a</i> &gt; 0 boʻlsa, <i>b</i> nechaga teng?`,
  m71: `Retseptda har 2 stakan shakarga 3 stakan un ishlatiladi. 8 stakan shakar ishlatilsa, necha stakan un kerak?`,
  m72: `Xaritada 1 dyuym 25 milyaga toʻgʻri keladi. Xaritada ikki shahar orasidagi masofa 3,5 dyuym. Shaharlar orasidagi haqiqiy masofa necha milya?`,
  m73: `36 nafar oʻquvchidan iborat sinfda oʻgʻil va qiz bolalar soni 4 ga 5 nisbatda. Sinfda nechta qiz bola bor?`,
  m74: `Agar <i>x</i>/<i>y</i> = 3/4 va <i>y</i>/<i>z</i> = 2/5 boʻlsa, <i>x</i>/<i>z</i> nechaga teng?`,
  m75: `Avtomobil 2,5 soatda 150 milya yoʻl bosadi. Uning oʻrtacha tezligi soatiga necha milya?`,
  m76: `Printer 3 daqiqada 45 sahifa chop etadi. Shu tezlikda 240 sahifani chop etish necha daqiqa oladi?`,
  m77: `Jism soniyasiga 3 fut oʻzgarmas tezlik bilan harakatlanadi. Bu tezlik daqiqasiga necha dyuym? (1 fut = 12 dyuym)`,
  m78: `Boʻsh bakka suv soniyasiga 2,5 litr oʻzgarmas tezlikda quyiladi. Bak 27 000 litr sigʻadi. Bak necha soatda toʻladi?`,
  m79: `250 ning 30% i nechaga teng?`,
  m80: `20% chegirmadan keyin kurtka $80 turadi. Kurtkaning dastlabki narxi necha dollar edi?`,
  m81: `Shahar aholisi 1 600 dan 2 000 gacha oʻsdi. Aholi necha foizga oʻsgan?`,
  m82: `Xaltada 4 ta qizil, 6 ta koʻk va 10 ta yashil shar bor. Tasodifan bitta shar olinsa, uning koʻk boʻlish ehtimoli qancha?`,
  m83: `<div class="tablescroll"><table><caption>200 nafar oʻquvchi oʻrtasidagi soʻrov</caption>
      <thead><tr><th></th><th>Cholgʻu chaladi</th><th>Cholgʻu chalmaydi</th><th>Jami</th></tr></thead>
      <tbody><tr><th>Sport bilan shugʻullanadi</th><td>45</td><td>75</td><td>120</td></tr>
      <tr><th>Sport bilan shugʻullanmaydi</th><td>35</td><td>45</td><td>80</td></tr>
      <tr><th>Jami</th><td>80</td><td>120</td><td>200</td></tr></tbody></table></div>
      Cholgʻu chaladigan oʻquvchilardan biri tasodifan tanlansa, uning sport bilan ham shugʻullanish ehtimoli qancha?`,
  m84: `1 dan 20 gacha boʻlgan butun sonlardan biri tasodifan tanlanadi. Uning 3 ga yoki 5 ga karrali boʻlish ehtimoli qancha?`,
  m85: `7, 3, 9, 4, 12 maʼlumotlar toʻplamining medianasi nechaga teng?`,
  m86: `5 ta qiymatdan iborat toʻplamning oʻrta arifmetigi 8 ga teng. Oltinchi qiymat qoʻshilgach, oʻrta arifmetik 9 ga teng boʻldi. Oltinchi qiymat nechaga teng?`,
  m87: `Tarqalish diagrammasi oʻsimlikning ekilganidan <i>x</i> hafta keyingi balandligini (santimetrda) koʻrsatadi. Eng yaxshi yaqinlashuv chizigʻi: <i>y</i> = 2,5<i>x</i> + 10. Bu chiziqqa koʻra ekilganidan 6 hafta keyin oʻsimlikning taxminiy balandligi necha santimetr?`,
  m88: `Bir guruh oʻquvchilar uchun test bali <i>y</i> ning haftasiga televizor koʻrish soatlari <i>x</i> ga bogʻliqligini ifodalovchi eng yaxshi yaqinlashuv chizigʻi <i>y</i> = −0,8<i>x</i> + 92. Bu toʻgʻri chiziqning burchak koeffitsiyentini qaysi fikr eng yaxshi tushuntiradi?`,
  m89: `<div class="tablescroll"><table>
      <thead><tr><th><i>t</i></th><th>0</th><th>1</th><th>2</th><th>3</th></tr></thead>
      <tbody><tr><th><i>f</i>(<i>t</i>)</th><td>5</td><td>15</td><td>45</td><td>135</td></tr></tbody></table></div>
      Jadvalda <i>f</i> funksiyaning toʻrtta qiymati keltirilgan. Qaysi tenglama <i>f</i> ni ifodalashi mumkin?`,
  m90: `Shaharda 20 000 kishi yashaydi. 400 nafar aholidan iborat tasodifiy tanlanmada 120 kishi yangi bogʻ qurilishini qoʻllab-quvvatlashini aytdi. Tanlanmaga koʻra shahar aholisidan taxminan necha kishi bogʻ qurilishini qoʻllab-quvvatlaydi?`,
  m91: `Tasodifiy tanlanma asosidagi soʻrov shahar saylovchilarining 54% i taklifni qoʻllab-quvvatlashini koʻrsatdi, xatolik chegarasi 3 foiz punkt. Quyidagilardan qaysi biri taklifni qoʻllab-quvvatlovchi barcha saylovchilarning haqiqiy ulushi uchun ehtimolga yaqin qiymat?`,
  m92: `Kattalarning oʻrtacha boʻyini baholash uchun tadqiqotchilar bir xil bosh toʻplamdan ikkita tasodifiy tanlanma oldi. A tanlanmada 100 kishi, B tanlanmada 900 kishi bor edi. Ikkala baho ham bir xil ishonch darajasida olingan. Xatolik chegaralari haqidagi qaysi fikr toʻgʻri boʻlishi ehtimoli yuqori?`,
  m93: `Tadqiqotchi 200 nafar koʻngilli yigʻdi va ularni tasodifiy ravishda ikki guruhga ajratdi: bir yarmi har kuni bir piyola koʻk choy, ikkinchi yarmi bir piyola suv ichdi. Ikki oydan keyin koʻk choy ichgan guruh oʻrtacha past stress darajasini qayd etdi. Tadqiqot qaysi xulosani eng yaxshi tasdiqlaydi?`,
  m94: `Shahardagi tasodifiy tanlangan 1 000 nafar katta yoshli kishi oʻrtasidagi soʻrov shuni koʻrsatdiki, it boqadiganlar it boqmaydiganlarga qaraganda haftasiga oʻrtacha koʻproq soat jismoniy mashq qiladi. Soʻrov qaysi xulosani eng yaxshi tasdiqlaydi?`,
  m95: `Maktab direktori oʻquvchilar uy vazifasiga haftasiga oʻrtacha necha soat sarflashini baholamoqchi. Soʻrov uchun oʻquvchilarni tanlashning qaysi usuli xolis baho berishi ehtimoli yuqori?`,
  m96: `Ikki toʻgʻri chiziq kesishib, toʻrtta burchak hosil qiladi. Burchaklardan biri 65° ga teng. Unga qoʻshni burchak necha gradus?`,
  m97: `Ikki parallel toʻgʻri chiziq kesuvchi bilan kesilgan. Ikkita bir tomonli ichki burchak (3<i>x</i> + 10)° va (2<i>x</i> + 20)° ga teng. <i>x</i> nechaga teng?`,

  const group = k => shuffle(qs.filter(q => (st[q.id] || 'n') === k));

function startSession(mods, spec, full, at = 0) {
  const mult = paceMult();
  mods.forEach(m => { m.limit = Math.round(m.limit * mult); });
  S = { mult, qtime: {}, timerHidden: false, warned: false, toastUntil: 0, mods, m: 0, full: !!full, ids: mods[0].ids, limit: mods[0].limit, spec,
        i: at, answers: {}, marked: new Set(), struck: {}, checked: new Set(),
        timed: cfg.timed, feedback: cfg.feedback, elapsed: 0, used: 0, nav: false, exitAsk: false,
        usedIds: new Set(mods.flatMap(m => m.ids || [])) };
  startTimer();
  renderTest();
  window.scrollTo(0, 0);
}
function startTimer() {
  stopTimer();
  let last = Date.now();
  tick = setInterval(() => {
    const now = Date.now(), dt = (now - last) / 1000; last = now;
    S.elapsed += dt;
    if (view === 'test' && S.ids) { const id = S.ids[S.i]; S.qtime[id] = (S.qtime[id] || 0) + dt; }
    const t = document.getElementById('timer');
    if (!S.timed) { if (t) t.textContent = fmt(S.elapsed); return; }
    const rem = S.limit - S.elapsed;
    // Like the real test: with 5 minutes left the timer comes back (and can't be hidden) and a notice appears.
    if (rem <= 300 && !S.warned && S.limit > 300) {
      S.warned = true; S.timerHidden = false; S.toastUntil = now + 8000;
      if (t) t.hidden = false;
      const tb = document.getElementById('timerToggle'); if (tb) { tb.disabled = true; tb.textContent = T('hideT'); }
      const ts = document.getElementById('toast'); if (ts) ts.textContent = T('fiveLeft');
    }
    if (S.toastUntil && now > S.toastUntil) { S.toastUntil = 0; const ts = document.getElementById('toast'); if (ts) ts.textContent = ''; }
    if (t) { t.textContent = fmt(rem); t.classList.toggle('low', rem <= 60); }
    if (rem <= 0) { S.mods[S.m].timedOut = true; finish(); }
  }, 250);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }
function timerHtml() {
  const rem = S.limit - S.elapsed;

  const hide = S.timerHidden && !locked;
  const shown = S.timed ? fmt(rem) : fmt(S.elapsed);
  return `<span class="timer num ${S.timed && rem <= 60 ? 'low' : ''}" id="timer" ${hide ? 'hidden' : ''} ${S.timed ? '' : `aria-label="${T('elapsedL')}" title="${T('elapsedL')}"`}>${shown}</span>

  <footer class="testfoot"><div class="inner">
    <div><button class="btn" id="backBtn" ${S.i === 0 ? 'disabled' : ''}>${T('back')}</button></div>
    <button class="navtoggle" id="navBtn" aria-expanded="${S.nav}">${T('questionOf')(S.i + 1, n)} <span aria-hidden="true">${S.nav ? '▾' : '▴'}</span></button>
    <div>${canCheck ? `<button class="btn btn-pencil" id="checkBtn">${T('check')}</button>` : ''}
      <button class="btn btn-primary" id="nextBtn">${last ? T('review') : T('next')}</button></div>
  </div></footer>`;

  // wiring
  wireLang('langTest');
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(+b.dataset.k));
  app.querySelectorAll('[data-strike]').forEach(b => b.onclick = () => {
    const k = +b.dataset.strike; const set = S.struck[q.id] || (S.struck[q.id] = new Set());
    set.has(k) ? set.delete(k) : set.add(k);
    if (set.has(k) && S.answers[q.id] === k) delete S.answers[q.id];
    renderTest();
  });
  const expBtn = document.getElementById('expBtn');
  if (expBtn) {
    const wrap = document.getElementById('expWrap');
    expBtn.onclick = () => { const open = !wrap.classList.contains('open'); wrap.classList.toggle('open', open); expBtn.setAttribute('aria-expanded', open); };
    wrap.onmouseenter = () => expBtn.setAttribute('aria-expanded', 'true');
    wrap.onmouseleave = () => { if (!wrap.classList.contains('open')) expBtn.setAttribute('aria-expanded', 'false'); };
  }
  const inp = app.querySelector('.gridin input');
  if (inp) {
    inp.oninput = () => {
      inp.value = inp.value.replace(/[^0-9.,\/\-]/g, '');
      S.answers[q.id] = inp.value;
      const had = !!document.getElementById('checkBtn');
      if (S.feedback === 'each' && had !== (inp.value !== '')) { renderTest(); const i2 = app.querySelector('.gridin input'); if (i2) { i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); } }
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); canCheckNow() ? check() : go(1); } };
  }
  document.getElementById('markBtn').onclick = () => { S.marked.has(q.id) ? S.marked.delete(q.id) : S.marked.add(q.id); renderTest(); };
  document.getElementById('backBtn').onclick = () => go(-1);
  document.getElementById('nextBtn').onclick = () => last ? (S.nav = true, renderTest()) : go(1);
  document.getElementById('navBtn').onclick = () => { S.nav = !S.nav; renderTest(); };
  const cb = document.getElementById('checkBtn'); if (cb) cb.onclick = check;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.i = +b.dataset.go; S.nav = false; renderTest(); });
  const sb = document.getElementById('submitBtn'); if (sb) sb.onclick = finish;
  const tt = document.getElementById('timerToggle'); if (tt) tt.onclick = () => { S.timerHidden = !S.timerHidden; renderTest(); };
  const eb = document.getElementById('exitBtn'); if (eb) eb.onclick = () => { S.exitAsk = true; renderTest(); };
  const ey = document.getElementById('exitYes'); if (ey) ey.onclick = goHome;
  const en = document.getElementById('exitNo'); if (en) en.onclick = () => { S.exitAsk = false; renderTest(); };
}
function canCheckNow() { const id = S.ids[S.i]; const a = S.answers[id]; return S.feedback === 'each' && !S.checked.has(id) && a !== undefined && a !== ''; }
function choose(k) {
  const q = byId[S.ids[S.i]];
  if (S.checked.has(q.id) || q.spr !== undefined) return;
  S.answers[q.id] = k;
  if (S.struck[q.id]) S.struck[q.id].delete(k);
  renderTest();
}
function check() { S.checked.add(S.ids[S.i]); renderTest(); }
function go(d) {
  const ni = S.i + d;
  if (ni < 0 || ni >= S.ids.length) return;
  S.i = ni; S.nav = false; S.exitAsk = false; renderTest(); window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const w = document.getElementById('expWrap'); if (w && w.classList.contains('open')) { w.classList.remove('open'); return; } }
  if (!S || view !== 'test') return;
  if (['INPUT', 'SELECT'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (['a', 'b', 'c', 'd'].includes(k)) { choose('abcd'.indexOf(k)); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Escape' && S.nav) { S.nav = false; renderTest(); }
});

// ---------- between modules ----------
function finish() {
  if (!S || S.done || S.between) return;
  stopTimer();
  S.used += S.timed ? Math.min(S.elapsed, S.limit) : S.elapsed;
  if (S.m < S.mods.length - 1) return betweenModules();
  S.done = true;
  finalizeResults();
}
function betweenModules() {
  S.between = true;
  const cur = S.mods[S.m], next = S.mods[S.m + 1];
  if (next.adaptive && !next.ids) buildAdaptive(S.m + 1);
  S.breakEnds = cur.sec !== next.sec ? Date.now() + 600000 : null;
  if (S.breakEnds) {
    brkTick = setInterval(() => {
      const el = document.getElementById('brk');
      const left = (S.breakEnds - Date.now()) / 1000;
      if (el) el.textContent = left > 0 ? fmt(left) : T('breakOver');
      if (left <= 0) { clearInterval(brkTick); brkTick = null; if (view === 'between') startNextModule(); }
    }, 500);
  }
  renderBetween();
  window.scrollTo(0, 0);
}
function startNextModule() {
  if (brkTick) { clearInterval(brkTick); brkTick = null; }
  S.between = false; S.breakEnds = null; S.m++;
  const n = S.mods[S.m];
  Object.assign(S, { ids: n.ids, limit: n.limit, elapsed: 0, i: 0, nav: false, exitAsk: false, warned: false, toastUntil: 0 });
  startTimer(); renderTest(); window.scrollTo(0, 0);
}
function renderBetween() {
  view = 'between';
  const cur = S.mods[S.m], next = S.mods[S.m + 1];
  const answered = cur.ids.filter(isAnswered).length;
  const left = S.breakEnds ? (S.breakEnds - Date.now()) / 1000 : 0;
  app.innerHTML = `
  <div class="wrap">
    <header class="topbar">${brand}<div class="topbar-right"><small>${labelText(S.spec)}</small>${langSelect('langBetween')}</div></header>
    <section class="between">
      <div class="eyebrow">${T('modSubmitted')(S.m + 1, S.mods.length)}</div>
      <h1>${T('complete')(modName(cur))}</h1>
      ${cur.timedOut ? `<p class="timeup" role="status">${T('timeUpMod')}</p>` : ''}
      <p>${T('answeredOf')(answered, cur.ids.length)}${next.adaptive ? T('nextChosen') : ''}</p>
      ${S.breakEnds ? `<div class="breakbox"><div><span class="eyebrow">${T('brk')}</span><p>${T('breakText')} ${T('breakAuto')}</p></div><span class="timer num" id="brk">${left > 0 ? fmt(left) : T('breakOver')}</span></div>` : ''}
      <ol class="modout">${S.mods.map((m, k) => `<li class="${k <= S.m ? 'done' : k === S.m + 1 ? 'next' : ''}"><span>${modName(m)}</span><span class="num">${k <= S.m ? T('submitted') : (k === S.m + 1 ? T('upNext') : '') + minStr(m.limit) + ' ' + T('min')}</span></li>`).join('')}</ol>
      <div class="actions"><button class="btn btn-pencil" id="nextMod">${T('startMod')(modName(next))}</button><button class="linkbtn" id="endFull">${T('endTest')}</button></div>
      <p class="note">${T('endNote')}</p>
    </section>
  </div>`;
  wireLang('langBetween');
  const clearBrk = () => { if (brkTick) { clearInterval(brkTick); brkTick = null; } };
  document.getElementById('nextMod').onclick = startNextModule;
  document.getElementById('endFull').onclick = () => {
    clearBrk(); S.between = false; S.done = true;
    S.mods.forEach((m, k) => { if (m.adaptive && !m.ids) buildAdaptive(k); });
    finalizeResults();
  };
}

// ---------- results ----------
function computeResults() {
  const allIds = S.mods.flatMap(m => m.ids);
  const rows = allIds.map(id => { const q = byId[id]; const a = S.answers[id]; const skipped = a === undefined || a === ''; return { q, a, skipped, ok: isCorrect(q, a) }; });
  const correct = rows.filter(r => r.ok).length;
  const bySec = {};
  rows.forEach(r => { const s = bySec[r.q.sec] || (bySec[r.q.sec] = { c: 0, t: 0 }); s.t++; if (r.ok) s.c++; });
  const routeOf = k => S.full ? (S.mods.find(m => m.sec === k && m.adaptive) || {}).route : null;
  const scores = Object.keys(bySec).map(k => ({ key: k, v: sectionScore(bySec[k].c, bySec[k].t, routeOf(k)), c: bySec[k].c, t: bySec[k].t }));
  const total = S.full && scores.length === 2 ? scores[0].v + scores[1].v : 0;
  return { rows, correct, scores, total };
}
function finalizeResults() {
  const R = computeResults();
  const hist = loadHistory();
  const now = new Date();
  hist.unshift({ label: labelText(S.spec), when: now.toLocaleDateString(uiL(), { month: 'short', day: 'numeric' }) + ', ' + now.toLocaleTimeString(uiL(), { hour: 'numeric', minute: '2-digit' }),
                 correct: R.correct, total: R.rows.length,
                 scores: (R.total ? [{ k: T('totalShort'), v: R.total }] : []).concat(R.scores.map(s => ({ k: secShort(s.key), v: s.v }))) });
  saveHistory(hist);
  saveStatus(R.rows);
  renderResults();
  window.scrollTo(0, 0);
}
function renderResults() {
  view = 'results';
  const { rows, correct, scores, total } = computeResults();
  const totalLimit = S.mods.reduce((t, m) => t + m.limit, 0);
  const byDom = {};
  rows.forEach(r => { const d = byDom[r.q.dom] || (byDom[r.q.dom] = { c: 0, t: 0 }); d.t++; if (r.ok) d.c++; });
  const missed = rows.filter(r => !r.ok).map(r => r.q.id);
  const bySkill = {};
  rows.forEach(r => { const w = bySkill[r.q.skill] || (bySkill[r.q.skill] = { s: r.q.skill, c: 0, t: 0 }); w.t++; if (r.ok) w.c++; });
  const sessWeak = weakSort(Object.values(bySkill));
  // Pacing: average time per question vs SAT pace (71 s R&W, 95 s Math, scaled for +50% time).
  const qt = S.qtime || {};
  const target = q => SECTIONS[q.sec].perQ * (S.mult || 1);
  const pace = ['rw', 'math'].map(sec => {
    const rs = rows.filter(r => r.q.sec === sec);
    if (!rs.length) return null;
    const avg = rs.reduce((t, r) => t + (qt[r.q.id] || 0), 0) / rs.length;
    return { sec, avg, target: SECTIONS[sec].perQ * (S.mult || 1) };
  }).filter(Boolean);
  const isSlow = q => (qt[q.id] || 0) > 2 * target(q);
  const slowCount = rows.filter(r => isSlow(r.q)).length;
  const modLine = k => S.full ? S.mods.filter(m => m.sec === k).map(m =>
      `${T('modCap')} ${m.k}${m.route ? T(m.route === 'hard' ? 'harder' : 'easier') : ''}: ${m.ids.filter(id => isCorrect(byId[id], S.answers[id])).length}/${m.ids.length}`).join(' · ') : '';
  const pct = Math.round(100 * correct / rows.length);
  const ansText = (q, a) => (a === undefined || a === '') ? '—' : q.spr !== undefined ? a : letter(a);
  const card = (label, v, frac, pctPos, ticks, line) => `
          <div class="scorecard">
            <div class="top"><span class="eyebrow">${label}</span><span class="num" style="color:var(--muted);font-size:13px">${frac}</span></div>
            <div class="big">${v}</div>
            <div class="track" aria-hidden="true"><div class="fill" style="width:${pctPos}%"></div><div class="pin" style="left:${pctPos}%"></div></div>
            <div class="ticks">${ticks.map(t => `<span>${t}</span>`).join('')}</div>
            ${line ? `<p class="note num" style="font-size:12px">${line}</p>` : ''}
          </div>`;

  app.innerHTML = `
  <div class="wrap">
    <header class="topbar">${brand}<div class="topbar-right">${langSelect('langRes')}<button class="linkbtn" id="homeBtn">${fromBank() ? T('backBank') : T('backSetup')}</button></div></header>
    <section class="res-head">
      <div>
        <div class="eyebrow">${labelText(S.spec)}${T('resultsSuffix')}</div>
        <h1 style="margin-top:8px">${T('headline')(pct)}</h1>
        ${S.mods.some(m => m.timedOut) ? `<p class="timeup" role="status" style="margin-top:12px">${T('timeUpRes')}</p>` : ''}
        <p>${T('youAnswered')(correct, rows.length, pct)} ${S.full ? T('fullScoreNote') : T('scoreNote')}</p>
      </div>
      <div class="scorecards">
        ${total ? card(T('estTotal'), total, `${correct}/${rows.length}`, (total - 400) / 12, [400, 800, 1200, 1600], '') : ''}
        ${scores.map(s => card(T('estSec')(secName(s.key)), s.v, `${s.c}/${s.t}`, (s.v - 200) / 6, [200, 400, 600, 800], modLine(s.key))).join('')}
      </div>
    </section>
    <div class="res-grid">
      <section class="panel">
        <h2>${T('byDomain')}</h2>
        <div class="statline" style="margin-top:14px">
          <div class="stat"><b>${correct}</b><span>${T('correctS')}</span></div>
          <div class="stat"><b>${rows.filter(r => !r.ok && !r.skipped).length}</b><span>${T('incorrect')}</span></div>
          <div class="stat"><b>${fmt(S.used)}</b><span>${S.timed ? T('ofUsed')(fmt(totalLimit)) : T('timeSpent')}</span></div>
        </div>
        ${Object.entries(byDom).map(([d, v]) => { const p = Math.round(100 * v.c / v.t); return `
          <div class="dom"><div class="row"><span>${domName(d)}</span><span>${v.c}/${v.t}</span></div>
          <div class="bar"><i class="${p < 60 ? 'weak' : ''}" style="width:${Math.max(p, 2)}%"></i></div></div>`; }).join('')}
        <div class="weaksess">
          <h3 class="weakhead">${T('pacing')}</h3>
          ${pace.map(p => `<div class="dom" style="margin-top:12px"><div class="row"><span>${secName(p.sec)}</span><span>${fmt(p.avg)} ${T('perQShort')}</span></div>
            <div class="pbar"><i class="${p.avg > p.target ? 'weak' : ''}" style="width:${Math.max(2, Math.min(100, Math.round(50 * p.avg / p.target)))}%"></i></div>
            <p class="weaksub" style="margin-top:6px">${T('paceLine')(fmt(p.target), p.avg <= p.target)}</p></div>`).join('')}
          ${slowCount ? `<p class="weaksub" style="margin-top:10px">${T('slowN')(slowCount)}</p>` : ''}
        </div>
        ${sessWeak.length ? `<div class="weaksess">
          <h3 class="weakhead">${T('weakSessH')}</h3>
          <p class="weaksub">${T('weakSessSub')}</p>
          ${weakList(sessWeak.slice(0, 4))}
        </div>` : ''}
        <div class="actions">
          ${missed.length ? `<button class="btn btn-pencil" id="retryBtn">${T('retry')(missed.length)}</button>` : ''}
          <button class="btn" id="newBtn">${T('newSession')}</button>
        </div>
      </section>
      <section>
        <h2 style="font-size:20px;margin-bottom:12px">${T('answerReview')}</h2>
        <div class="review">
          ${rows.map((r, k) => `
            <details class="ritem">
              <summary>
                <span class="mark ${r.ok ? 'ok' : r.skipped ? 'skip' : 'no'}" aria-label="${r.ok ? T('correctS') : r.skipped ? T('skipped') : T('incorrect')}">${r.ok ? '✓' : r.skipped ? '–' : '✕'}</span>
                <span class="num qn" style="color:var(--muted)">Q${k + 1}</span>
                <span class="t">${skillName(r.q.skill)} (${diffName(r.q.d)}): <span lang="${qLang(r.q)}">${stripTags(qText(r.q)).slice(0, 90)}</span></span>
                <span class="pair">${T('youKey')(ansText(r.q, r.a), keyText(r.q))} · <span class="${isSlow(r.q) ? 'slowt' : ''}">${fmt(qt[r.q.id] || 0)}</span></span>
              </summary>
              <div class="body">
                <div style="margin-bottom:8px" lang="${qLang(r.q)}">${qText(r.q)}</div>
                ${r.q.ch ? `<p lang="${qLang(r.q)}">${r.q.ch.map((c, i) => `<b>${letter(i)}.</b> ${chText(r.q, i)}`).join('<br>')}</p>` : ''}
                <div class="ex"><div class="exhead"><span class="lbl exhint">${STR[exL()].explainHint}</span>${exToggle()}</div>${exBody(r.q, 'div')}</div>
              </div>
            </details>`).join('')}
        </div>
      </section>
    </div>
  </div>`;
  wireLang('langRes');
  document.getElementById('homeBtn').onclick = goHome;
  document.getElementById('newBtn').onclick = goHome;
  wireQuick();
  const rb = document.getElementById('retryBtn');
  if (rb) rb.onclick = () => startSession([{ sec: null, k: 0, ids: missed, limit: limitFor(missed) }], { type: 'missed' });
}

document.documentElement.lang = uiL();
renderHome();
</script>
</body>
</html>
